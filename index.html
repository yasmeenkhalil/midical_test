ed","Mandatory at 18","Required before braces"],"c":1,"e":"NICE advises against."},{"q":"Pericoronitis is inflammation of:","o":["The pulp","Soft tissue around a partially erupted crown","The periapex","Gingival margin of all teeth"],"c":1,"e":"Operculum over partially erupted tooth."},{"q":"A radiolucent line (Winter's lines / red line) helps assess:","o":["Caries","Depth of impaction","Nerve","Sinus"],"c":1,"e":"Depth and difficulty."},{"q":"Coronectomy is considered when:","o":["Roots are far from IAN","Roots intimately related to IAN canal","Tooth is carious","Patient is young"],"c":1,"e":"To avoid IAN injury, crown removed leaving roots."},{"q":"Maxillary impacted canines are most often positioned:","o":["Buccal","Palatal","Distal","Apical"],"c":1,"e":"Commonly palatal."}],"pearls":["Mesioangular impactions are the commonest and usually the easiest; distoangular lower thirds are generally the most difficult.","Read the radiograph for IAN proximity: darkening or notching of the root, diversion or loss of the canal's white lines means CBCT and consider coronectomy.","Most third-molar nerve injuries are neuropraxia and recover; document sensation when roots are close to the canal."],"mistakes":["Operating on a lower third molar without assessing IAN proximity first.","Applying uncontrolled force to an upper third molar and displacing it into the infratemporal fossa/sinus.","Performing a coronectomy on an infected or mobile tooth.","Removing asymptomatic, disease-free impactions prophylactically.","Damaging the lingual tissues/nerve by poor lingual flap/retractor placement.","Extracting in the acute phase of pericoronitis instead of settling it first.","Operating on a lower 3rd molar without assessing IAN proximity first.","Applying uncontrolled force to an upper 3rd molar and displacing it into the infratemporal fossa/sinus."],"facts":["Most commonly impacted: mandibular 3rd molar; 2nd: maxillary canine (often palatal).","Winter's classification = angulation: mesioangular (commonest/easiest), vertical, distoangular (hardest), horizontal.","Pell & Gregory = depth (A/B/C) + ramus relationship (class 1/2/3).","IAN-proximity radiographic signs: root darkening/notching, diverted canal, loss of canal white lines → CBCT.","Indications to remove: recurrent pericoronitis, caries, cyst/tumour, resorption of adjacent tooth, fracture line.","NICE: avoid prophylactic removal of asymptomatic, disease-free impactions.","Nerves at risk (lower 8): inferior alveolar & lingual.","Most nerve injuries are neuropraxia (recover); persistence >6 mo suggests axonotmesis/neurotmesis.","Coronectomy: remove crown, leave vital roots when intimately related to the IAN canal.","Coronectomy contraindicated if non-vital/infected/mobile/horizontal along the nerve.","Localise impacted canine: parallax/SLOB rule or CBCT.","Upper 8 risks: displacement into the sinus/infratemporal fossa; lower root into canal/floor of mouth.","Mesiodens = midline supernumerary; may block/divert incisor eruption.","Most common post-op complication after lower 8: dry socket.","Pericoronitis = operculum inflammation over a partially erupted tooth.","An impacted tooth fails to erupt into its expected position by the expected time, blocked by bone, tooth or soft tissue.","Order of frequency: mandibular 3rd molar > maxillary 3rd molar / canine > premolars / supernumeraries.","Winter's classification = angulation: mesioangular (commonest/easiest), vertical, distoangular (hardest), horizontal, transverse."],"mnemonics":["Winter = Angulation (Mesio commonest/easiest, Disto hardest, Horizontal, Vertical).","Pell & Gregory = Depth A/B/C + Ramus relation 1/2/3."]},"maxillary_sinus":{"study":[{"h":"1. Applied Anatomy","html":"\n   <p>The maxillary sinus (antrum of Highmore) is the largest paranasal sinus, lined by {{respiratory epithelium|ظهارة تنفسية}} (ciliated pseudostratified). Ostium drains high on the medial wall → poor gravity drainage. Floor relates to premolar/molar apices.</p>"},{"h":"2. Oro-antral Communication / Fistula","html":"\n   <ul><li><b>OAC</b>: fresh; <b>OAF</b>: epithelialized chronic tract.</li>\n   <li>Diagnosis: {{Valsalva|فالسالفا}}, bubbling, nasal regurgitation. Size dictates Tx (<2 leave; 2–6 suture; >6 buccal advancement (Rehrmann)/palatal flap).</li></ul>\n   <div class=\"hy\"><b>⭐:</b> Don't probe an OAC repeatedly — may push infection/create a fistula.</div>"},{"h":"3. Odontogenic Sinusitis & Root in Antrum","html":"\n   <ul><li>Unilateral foul sinusitis suggests a dental cause (apical infection, OAF, displaced root).</li>\n   <li>Displaced root → confirm radiographically; retrieve via <b>Caldwell-Luc</b> or endoscopic approach.</li></ul>"}],"flashcards":[{"q":"Lining of the maxillary sinus?","a":"Respiratory (ciliated pseudostratified) epithelium."},{"q":"Why does the sinus drain poorly?","a":"Ostium is high on the medial wall (against gravity)."},{"q":"OAC vs OAF?","a":"OAC fresh communication; OAF epithelialized chronic tract."},{"q":"OAC diagnostic test?","a":"Valsalva maneuver."}],"quiz":[{"q":"The maxillary sinus is lined by:","o":["Keratinized squamous","Respiratory ciliated epithelium","Cuboidal","Transitional"],"c":1,"e":"Ciliated pseudostratified columnar."},{"q":"The maxillary sinus drains poorly because the ostium is:","o":["At the floor","High on the medial wall","Posterior","Anterior"],"c":1,"e":"Against gravity."},{"q":"A chronic epithelialized oro-antral tract is an:","o":["OAC","OAF","Abscess","Cyst"],"c":1,"e":"Oro-antral fistula."},{"q":"Best test to confirm an oro-antral communication:","o":["Percussion","Valsalva","Vitality test","Bite test"],"c":1,"e":"Valsalva (nose-blowing)."},{"q":"An OAC of 5 mm is managed by:","o":["Leave alone","Figure-8 suture/clot","Immediate large flap","Caldwell-Luc"],"c":1,"e":"2–6 mm → suture/dressing."},{"q":"A root displaced into the antrum is retrieved by:","o":["IANB","Caldwell-Luc/endoscopic","Rehrmann only","Observation"],"c":1,"e":"Antral approach."},{"q":"Unilateral foul-smelling sinusitis suggests:","o":["Allergic","Odontogenic","Viral","Fungal only"],"c":1,"e":"Dental origin."},{"q":"The maxillary sinus is also called:","o":["Antrum of Highmore","Sphenoid","Frontal recess","Ethmoid bulla"],"c":0,"e":"Antrum of Highmore."},{"q":"The largest paranasal sinus is the:","o":["Frontal","Ethmoid","Maxillary","Sphenoid"],"c":2,"e":"Maxillary."},{"q":"Repeated probing of an OAC should be:","o":["Encouraged","Avoided","Done daily","Done with air"],"c":1,"e":"Risks creating a fistula/infection."},{"q":"The roots most related to the sinus floor are:","o":["Mandibular molars","Maxillary premolars/molars","Incisors","Canines"],"c":1,"e":"Posterior maxillary teeth."},{"q":"A buccal advancement flap for OAC is the:","o":["Rehrmann flap","Caldwell-Luc","Le Fort","Weber-Ferguson"],"c":0,"e":"Rehrmann (buccal advancement)."}],"pearls":["Confirm an oro-antral communication with the Valsalva test (air/bubbles), and manage by size: <2 mm clot, 2-6 mm figure-of-eight suture, >6 mm a flap.","Do not repeatedly probe a suspected OAC — it enlarges the defect and drives infection into the sinus."],"mistakes":["Repeatedly probing an OAC and turning a small communication into a chronic fistula.","Blindly instrumenting through the socket to retrieve a root in the antrum.","Treating unilateral foul sinusitis as a simple URTI and missing the dental cause.","Trying to close an established epithelialised OAF with a suture alone.","Omitting sinus precautions after creating an OAC.","Repeatedly probing an OAC and turning a small communication into a chronic fistula.","Blindly instrumenting through the socket to retrieve a root in the antrum.","Treating unilateral foul sinusitis as a simple URTI and missing the dental cause."],"facts":["Maxillary sinus = antrum of Highmore; largest paranasal sinus; respiratory ciliated lining.","Ostium high on the medial wall → poor gravity drainage (into the middle meatus).","Floor relates to premolar/molar apices; pneumatises lower after extraction.","OAC = fresh communication; OAF = epithelialised chronic tract.","Diagnose OAC: Valsalva (air/bubbles), nasal regurgitation, echo on suction.","OAC by size: <2 mm clot; 2-6 mm figure-8 suture; >6 mm buccal advancement (Rehrmann)/palatal flap.","Buccal fat pad flap for larger posterior defects.","Root in antrum → Caldwell-Luc or endoscopic retrieval; don't blindly instrument.","Odontogenic sinusitis: unilateral, foul-smelling; treat the dental cause.","Sinus precautions: no nose-blowing/straws/smoking after OAC.","Don't repeatedly probe an OAC (risk of fistula/infection).","Mucous retention cyst: dome-shaped, often incidental.","Imaging: CT / occipitomental (Waters') view.","The maxillary sinus (antrum of Highmore) is the largest paranasal sinus.","It is lined by respiratory (ciliated pseudostratified columnar) epithelium.","The ostium is high on the medial wall → poor gravity drainage, into the middle meatus.","The floor relates to the premolar/molar apices; pneumatisation lowers the floor after extraction."],"mnemonics":["OAC size rule: <2 clot, 2-6 suture, >6 flap.","Confirm OAC = Valsalva (air/bubbles)."]},"tmj":{"study":[{"h":"1. TMJ Dislocation","html":"\n   <p>Condyle displaced <b>anterior to the articular eminence</b> and can't self-reduce; often after wide opening/yawn. Patient: open lock, unable to close, pain.</p>\n   <div class=\"hy\"><b>⭐:</b> Reduce with the {{Hippocratic method|طريقة أبقراط}}: downward then backward pressure on posterior teeth (thumbs on external oblique ridges). Recurrent → consider eminectomy.</div>"},{"h":"2. Myofascial Pain Dysfunction (MPDS)","html":"\n   <ul><li>Most common cause of TMJ pain; muscular, related to <b>parafunction/bruxism</b>, stress.</li>\n   <li>Signs: muscle tenderness, limited opening, clicking, no joint pathology on imaging.</li>\n   <li>Tx: reassurance, soft diet, NSAIDs, occlusal splint, physiotherapy — conservative first.</li></ul>"},{"h":"3. Internal Derangement & Ankylosis","html":"\n   <ul><li><b>Disc displacement with reduction</b> = clicking; <b>without reduction</b> = closed lock (limited opening).</li>\n   <li><b>Ankylosis</b>: bony/fibrous fusion; childhood trauma/infection → restricted opening + facial asymmetry.</li></ul>"},{"h":"4. Trigeminal Neuralgia","html":"\n   <p>Severe, brief, electric-shock pain in V distribution, trigger zones. Often vascular compression of the nerve root. <b>First-line drug: {{carbamazepine|كاربامازيبين}}</b>; surgical microvascular decompression for refractory cases.</p>"},{"h":"5. Applied Anatomy & Examination","html":"\n  <ul><li>Ginglymoarthrodial joint: condyle + glenoid fossa + fibrocartilaginous <b>disc</b> dividing it into <b>upper (translation)</b> and <b>lower (rotation)</b> compartments.</li>\n  <li>Ligaments: lateral (temporomandibular); accessory <b>sphenomandibular & stylomandibular</b>. Nerve supply: <b>auriculotemporal + masseteric (V3)</b>.</li>\n  <li>Exam: palpate joint & muscles, measure opening (normal ~40 mm), note deviation, clicks/crepitus, occlusion.</li></ul>"}],"flashcards":[{"q":"Direction of TMJ dislocation?","a":"Condyle anterior to the articular eminence."},{"q":"Reduction method for dislocation?","a":"Hippocratic: down then back pressure on posterior teeth."},{"q":"Most common cause of TMJ pain?","a":"Myofascial pain dysfunction (MPDS)."},{"q":"MPDS first-line treatment?","a":"Conservative: splint, NSAIDs, soft diet, reassurance."}],"quiz":[{"q":"In TMJ dislocation the condyle lies:","o":["Posterior to the fossa","Anterior to the articular eminence","Medial","In the fossa"],"c":1,"e":"Anterior to the eminence."},{"q":"The classic reduction of TMJ dislocation is the:","o":["Hippocratic method","Gillies approach","Caldwell-Luc","Champy method"],"c":0,"e":"Down and back on the posterior teeth."},{"q":"The most common cause of TMJ pain:","o":["Ankylosis","Myofascial pain dysfunction","Tumor","Fracture"],"c":1,"e":"MPDS."},{"q":"First-line management of MPDS:","o":["Surgery","Conservative (splint, NSAIDs)","Joint replacement","Radiotherapy"],"c":1,"e":"Conservative therapy."},{"q":"A reciprocal click indicates disc displacement:","o":["With reduction","Without reduction","Ankylosis","Fracture"],"c":0,"e":"With reduction."},{"q":"A 'closed lock' with limited opening indicates disc displacement:","o":["With reduction","Without reduction","Hypermobility","Subluxation"],"c":1,"e":"Without reduction."},{"q":"TMJ ankylosis most commonly results from:","o":["Aging","Childhood trauma/infection","Caries","Bruxism"],"c":1,"e":"Trauma/infection in childhood."},{"q":"First-line drug for trigeminal neuralgia:","o":["Carbamazepine","Paracetamol","Morphine","Amitriptyline"],"c":0,"e":"Carbamazepine."},{"q":"Trigeminal neuralgia pain is typically:","o":["Constant dull","Brief electric-shock with triggers","Burning continuous","Throbbing"],"c":1,"e":"Paroxysmal, trigger zones."},{"q":"A surgical option for recurrent dislocation:","o":["Eminectomy","Coronoidectomy","Condylar fracture","Le Fort"],"c":0,"e":"Eminectomy (or down-fracture/augmentation)."},{"q":"The TMJ articular disc divides the joint into:","o":["One space","Upper & lower compartments","Three spaces","No spaces"],"c":1,"e":"Upper (gliding) & lower (rotation)."},{"q":"Wide opening + inability to close suggests:","o":["Ankylosis","Acute dislocation","MPDS","Fracture"],"c":1,"e":"Open lock dislocation."},{"q":"Refractory trigeminal neuralgia may be treated by:","o":["Microvascular decompression","Eminectomy","IMF","Splint"],"c":0,"e":"MVD or ablative procedures."}],"pearls":["Most temporomandibular pain is myofascial pain dysfunction with normal imaging — treat conservatively first (splint, NSAIDs, soft diet, reassurance).","A reciprocal click is disc displacement WITH reduction; a sudden limited opening (closed lock) without a click is disc displacement WITHOUT reduction.","Acute dislocation is an open lock the patient cannot self-reduce — relieve it with the Hippocratic method (down then back on the posterior teeth)."],"mistakes":["Jumping to TMJ surgery for what is myofascial pain treatable conservatively.","Confusing disc displacement with reduction (click) and without reduction (closed lock).","Prolonged intermaxillary fixation of a condylar fracture (promotes ankylosis), especially in children.","Missing giant cell arteritis (jaw claudication + raised ESR) and risking blindness.","Treating trigeminal neuralgia as a dental problem and doing irreversible dentistry.","Forgetting to exclude a sinister cause (young/bilateral pain, sensory loss) in 'neuralgia'.","Jumping to TMJ surgery for what is myofascial pain treatable conservatively.","Confusing disc displacement WITH reduction (click) and WITHOUT reduction (closed lock)."],"facts":["TMJ = ginglymoarthrodial; disc → upper (translation) + lower (rotation) compartments.","TMJ ligaments: lateral (temporomandibular); accessory stylomandibular & sphenomandibular.","TMJ nerve supply: auriculotemporal + masseteric (V3).","Disc displacement WITH reduction = reciprocal click, normal opening.","Disc displacement WITHOUT reduction = closed lock, limited opening, no click.","MPDS = commonest TMJ pain; muscular/parafunction; normal imaging; treat conservatively.","Dislocation: condyle anterior to the eminence; reduce by Hippocratic method (down then back).","Recurrent dislocation surgery: eminectomy.","Ankylosis: true (intra-articular) vs false (extra-articular); childhood trauma/infection.","Child ankylosis → restricted opening + asymmetry/retrognathia ('bird face').","Ankylosis surgery: gap/interpositional arthroplasty + physiotherapy.","Osteoarthritis = crepitus/flattening in older patients; RA = bilateral, may cause anterior open bite.","Trigeminal neuralgia: brief electric-shock pain, trigger zones; first-line carbamazepine.","Refractory trigeminal neuralgia: microvascular decompression / ablative rhizotomy.","Giant cell (temporal) arteritis: elderly, jaw claudication, raised ESR → urgent steroids.","Imaging: MRI for disc/internal derangement; CT for bony ankylosis.","The TMJ is a ginglymoarthrodial (hinge + gliding) synovial joint: condyle + glenoid fossa + fibrocartilaginous disc.","The disc divides the joint into an upper compartment (translation/gliding) and a lower compartment (rotation/hinge)."],"mnemonics":["Click WITH reduction; Closed lock WITHOUT reduction.","Dislocation reduction (Hippocratic) = Down then Back on the posterior teeth."]},"salivary":{"study":[{"h":"1. Sialolithiasis (Stones)","html":"\n   <p>Most stones occur in the <b>submandibular gland/Wharton's duct</b> (mucous, alkaline saliva; upward tortuous duct). Pain & swelling at <b>mealtimes</b>.</p>\n   <div class=\"hy\"><b>⭐:</b> Submandibular = most common stones; most are <b>radiopaque</b>. Tx: sialogogues/massage; removal (intraoral) or sialendoscopy; gland excision if recurrent.</div>"},{"h":"2. Mucocele & Ranula","html":"\n   <ul><li><b>Mucocele</b>: extravasation cyst, lower lip, from minor gland trauma.</li>\n   <li><b>Ranula</b>: floor of mouth from sublingual gland; \"plunging\" ranula crosses mylohyoid.</li></ul>"},{"h":"3. Salivary Tumors","html":"\n   <ul><li><b>Pleomorphic adenoma</b>: most common salivary tumor; usually <b>parotid</b>; benign but can recur (incomplete excision).</li>\n   <li><b>Warthin's tumor</b>: parotid, older males, bilateral possible.</li>\n   <li><b>Mucoepidermoid carcinoma</b>: most common malignant; <b>Adenoid cystic carcinoma</b>: perineural invasion, late lung mets.</li></ul>\n   <div class=\"hy\"><b>⭐ Rule:</b> The <b>smaller</b> the salivary gland, the <b>higher</b> the chance a tumor is malignant.</div>"},{"h":"4. Inflammatory/Other","html":"\n   <ul><li><b>Mumps</b> (viral parotitis); <b>Sjögren's syndrome</b> (dry eyes/mouth, autoimmune, ↑ lymphoma risk); bacterial sialadenitis in dehydrated/elderly.</li>\n   <li>Parotid surgery risk: <b>facial nerve</b> injury, Frey's syndrome.</li></ul>"},{"h":"5. Applied Anatomy","html":"\n  <ul><li><b>Parotid</b> (serous): <b>Stensen's duct</b> opposite the upper 2nd molar; <b>facial nerve</b> runs through it; secretomotor IX → otic ganglion → auriculotemporal.</li>\n  <li><b>Submandibular</b> (mixed): <b>Wharton's duct</b> in floor of mouth; <b>lingual nerve</b> loops under the duct; secretomotor VII (chorda tympani).</li>\n  <li><b>Sublingual</b> (mucous): ducts of Rivinus/Bartholin. Plus hundreds of minor glands.</li></ul>"}],"flashcards":[{"q":"Most common site of salivary stones?","a":"Submandibular gland / Wharton's duct."},{"q":"Why submandibular stones common?","a":"Mucous alkaline saliva + upward tortuous duct."},{"q":"Salivary stone radiopacity?","a":"Mostly radiopaque."},{"q":"Classic stone symptom?","a":"Mealtime pain & swelling."},{"q":"Most common salivary tumor?","a":"Pleomorphic adenoma (parotid)."}],"quiz":[{"q":"Most salivary calculi occur in the:","o":["Parotid","Submandibular","Sublingual","Minor glands"],"c":1,"e":"Submandibular/Wharton's duct."},{"q":"Submandibular stones are common because saliva is:","o":["Serous, acidic","Mucous, alkaline + uphill duct","Watery","Scant"],"c":1,"e":"Mucous, alkaline, tortuous uphill duct."},{"q":"Salivary gland stones are mostly:","o":["Radiolucent","Radiopaque","Invisible","Gas-filled"],"c":1,"e":"Radiopaque."},{"q":"Pain and swelling at mealtimes suggests:","o":["Tumor","Sialolithiasis","Mucocele","Sjögren's"],"c":1,"e":"Obstructive stone."},{"q":"The most common salivary gland tumor:","o":["Warthin's","Pleomorphic adenoma","Mucoepidermoid","Adenoid cystic"],"c":1,"e":"Pleomorphic adenoma."},{"q":"The most common MALIGNANT salivary tumor:","o":["Pleomorphic adenoma","Mucoepidermoid carcinoma","Warthin's","Oncocytoma"],"c":1,"e":"Mucoepidermoid carcinoma."},{"q":"The salivary malignancy known for perineural invasion:","o":["Mucoepidermoid","Adenoid cystic carcinoma","Acinic cell","Warthin's"],"c":1,"e":"Adenoid cystic carcinoma."},{"q":"Regarding gland size and malignancy:","o":["Larger gland = more malignant","Smaller gland = higher malignancy chance","No relation","Only parotid malignant"],"c":1,"e":"Smaller glands → higher malignant proportion."},{"q":"A mucocele most commonly occurs on the:","o":["Upper lip","Lower lip","Palate","Tongue tip"],"c":1,"e":"Lower lip minor glands."},{"q":"A ranula arises from the:","o":["Parotid","Sublingual gland","Submandibular only","Minor palatal"],"c":1,"e":"Sublingual gland."},{"q":"Warthin's tumor characteristically occurs in:","o":["Young females","Older males, may be bilateral","Children","Newborns"],"c":1,"e":"Older males, can be bilateral."},{"q":"Sjögren's syndrome features:","o":["Hypersalivation","Dry eyes & mouth","Stones only","Pigmentation"],"c":1,"e":"Autoimmune sicca; ↑ lymphoma risk."}],"pearls":["Mealtime pain and swelling of a single gland is obstructive sialadenitis from a stone — most are in the submandibular gland/Wharton's duct and most are radiopaque.","The bigger the gland the more likely a tumour is benign; the smaller the gland (e.g., palate), the higher the chance of malignancy.","The commonest salivary tumour is the pleomorphic adenoma (parotid); it recurs if incompletely excised, so enucleation alone is inadequate."],"mistakes":["Enucleating a pleomorphic adenoma (high recurrence) instead of an adequate excision.","Doing a clinic excisional biopsy of a parotid mass and risking tumour seeding and facial-nerve injury.","Forgetting that small-gland (palatal) tumours have a higher malignancy rate.","Missing perineural spread of adenoid cystic carcinoma.","Performing sialography during acute infection.","Overlooking Sjögren's (and its lymphoma risk) in a patient with sicca symptoms.","Enucleating a pleomorphic adenoma (high recurrence) instead of an adequate excision.","Doing a clinic excisional biopsy of a parotid mass (seeding & facial-nerve injury risk)."],"facts":["Parotid (serous): Stensen's duct, opposite upper 2nd molar; facial nerve runs through it.","Submandibular (mixed): Wharton's duct; lingual nerve loops under it.","Sublingual (mucous): ducts of Rivinus/Bartholin.","Most stones: submandibular/Wharton's duct; mostly radiopaque; mealtime pain.","Most common salivary tumour: pleomorphic adenoma (parotid, recurs if incomplete).","Warthin's: older males, smoking, may be bilateral.","Most common malignant: mucoepidermoid carcinoma.","Adenoid cystic carcinoma: perineural invasion, late lung metastases.","Smaller gland → higher chance a tumour is malignant; ~80% parotid tumours benign.","Mucocele: lower lip extravasation cyst; ranula: sublingual gland (plunging crosses mylohyoid).","Sjögren's: dry eyes + mouth; ↑ MALT lymphoma; anti-Ro/La, labial gland biopsy.","Mumps = viral parotitis (paramyxovirus); acute bacterial parotitis = Staph aureus.","Parotidectomy key risk: facial nerve; Frey's syndrome = gustatory sweating.","Never do clinic excisional biopsy of a suspected major salivary malignancy (seeding/nerve).","Necrotising sialometaplasia: benign self-healing palatal ulcer mimicking malignancy.","Sialosis: bilateral painless enlargement (diabetes, alcohol, bulimia).","Parotid (serous): Stensen's duct opens opposite the upper 2nd molar; the facial nerve runs through it; secretomotor via IX → otic ganglion → auriculotemporal.","Submandibular (mixed): Wharton's duct in the floor of mouth; the lingual nerve loops under it; secretomotor via VII (chorda tympani → submandibular ganglion).","Sublingual (mucous): ducts of Rivinus / Bartholin."],"mnemonics":["Stones = Submandibular (mucous, alkaline, uphill duct), mostly radiopaque, mealtime pain.","Smaller gland → higher Malignancy chance."]},"preprosthetic":{"study":[{"h":"1. Goals","html":"\n   <p>Prepare the mouth for a stable, retentive, comfortable prosthesis: ideal ridge form (broad U-shaped), adequate sulcus depth, no sharp bone/undercuts, healthy mucosa, correct frenal attachments.</p>"},{"h":"2. Hard Tissue Procedures","html":"\n   <ul><li><b>Alveoloplasty</b>: recontour bone after extractions.</li>\n   <li><b>Alveolectomy</b>, removal of {{tori|نتوءات عظمية}} (torus palatinus/mandibularis) & exostoses, reduction of mylohyoid ridge, genial tubercle reduction.</li></ul>"},{"h":"3. Soft Tissue Procedures","html":"\n   <ul><li><b>Frenectomy</b> (high frenal pull destabilizing denture).</li>\n   <li><b>Vestibuloplasty</b> (deepen sulcus), excision of {{denture hyperplasia|فرط تنسج الدنشر}} (epulis fissuratum), flabby ridge correction.</li></ul>"}],"flashcards":[{"q":"Goal of preprosthetic surgery?","a":"Stable, retentive base for a prosthesis."},{"q":"Alveoloplasty =?","a":"Recontouring of alveolar bone."},{"q":"Torus palatinus location?","a":"Midline of hard palate."},{"q":"Torus mandibularis location?","a":"Lingual mandible near premolars."}],"quiz":[{"q":"The main goal of preprosthetic surgery is:","o":["Esthetics only","A stable retentive denture-bearing area","Caries control","Endodontics"],"c":1,"e":"Optimize tissues for a prosthesis."},{"q":"Alveoloplasty refers to:","o":["Removing a tooth","Recontouring alveolar bone","Deepening the sulcus","Frenum removal"],"c":1,"e":"Bone recontouring."},{"q":"Torus palatinus is located:","o":["Lingual mandible","Midline hard palate","Buccal maxilla","Floor of mouth"],"c":1,"e":"Midline palate."},{"q":"Torus mandibularis is typically:","o":["Midline palate","Lingual near premolars","Buccal molar","Retromolar"],"c":1,"e":"Lingual surface, premolar region."},{"q":"Epulis fissuratum is caused by:","o":["Virus","Ill-fitting denture flange","Smoking","Stone"],"c":1,"e":"Chronic denture irritation."},{"q":"Vestibuloplasty aims to:","o":["Remove bone","Deepen the vestibule/sulcus","Extract teeth","Close OAC"],"c":1,"e":"Increase denture-bearing height."},{"q":"In sequencing, you generally do:","o":["Soft tissue before hard","Hard tissue before soft","Only soft","Random"],"c":1,"e":"Hard tissue first."},{"q":"A high labial frenum destabilizing a denture is treated by:","o":["Alveoloplasty","Frenectomy","Vestibuloplasty","Tori removal"],"c":1,"e":"Frenectomy."}],"pearls":["The aim is a broad, smooth, U-shaped ridge with adequate sulcus depth and healthy mucosa — plan hard-tissue procedures before soft-tissue ones.","Epulis fissuratum and papillary hyperplasia are denture-induced — correct the denture as well as excising the tissue."],"mistakes":["Doing soft-tissue surgery before hard-tissue recontouring.","Excising denture hyperplasia without correcting the causative denture.","Removing tori that do not actually interfere with the denture.","Leaving sharp bony spicules/undercuts that will traumatise the mucosa.","Doing soft-tissue surgery before hard-tissue recontouring.","Excising denture hyperplasia without correcting the causative denture.","Removing tori that do not actually interfere with the denture.","Leaving sharp bony spicules/undercuts that traumatise the mucosa."],"facts":["Goal: stable, retentive, comfortable denture-bearing area (broad U-shaped ridge).","Sequence: hard-tissue procedures before soft-tissue.","Alveoloplasty = recontour alveolar bone after extractions; alveolectomy = bone removal.","Remove tori (palatinus midline palate / mandibularis lingual premolar) if interfering.","Mylohyoid ridge & genial tubercle reduction; tuberosity reduction (bony/fibrous) for inter-arch space.","Frenectomy for a high frenal attachment that unseats a denture.","Vestibuloplasty deepens the sulcus to increase denture-bearing area.","Epulis fissuratum (denture hyperplasia) from an ill-fitting flange → excise.","Papillary hyperplasia of the palate: denture + candida related.","Flabby/mobile ridge → correct; ideal ridge = broad, rounded, no sharp undercuts.","Severe resorption → ridge augmentation grafts or implants.","Implants have reduced the need for many traditional preprosthetic procedures.","Aim: a stable, retentive, comfortable denture-bearing area — a broad, smooth, U-shaped ridge with adequate sulcus depth and healthy mucosa.","Sequence: hard-tissue procedures BEFORE soft-tissue procedures.","Alveoloplasty = recontouring of the alveolar bone after extractions."],"mnemonics":["Sequence: Hard tissue before Soft tissue."]},"ortho_aids":{"study":[{"h":"1. Surgical Exposure of Impacted Teeth","html":"\n   <p>Most often the <b>maxillary canine</b>. After localization (parallax/CBCT), expose by an <b>open</b> (apically repositioned/window) or <b>closed</b> technique (bond a chain, mucosa replaced) then orthodontic traction.</p>"},{"h":"2. Frenectomy & Exposure for Ortho","html":"\n   <ul><li>Midline {{diastema|فرجة بين الأسنان}} with thick frenum → frenectomy (often after orthodontic closure).</li>\n   <li>Removal of supernumerary (mesiodens) blocking eruption.</li></ul>"}],"flashcards":[{"q":"Most commonly exposed impacted tooth for ortho?","a":"Maxillary canine."},{"q":"Open vs closed exposure?","a":"Open: window left; Closed: bracket/chain bonded, mucosa replaced."},{"q":"Mesiodens =?","a":"Midline supernumerary tooth (may block eruption)."},{"q":"TAD purpose?","a":"Skeletal/temporary anchorage for tooth movement."}],"quiz":[{"q":"The tooth most often surgically exposed for orthodontics:","o":["Mandibular molar","Maxillary canine","Premolar","Incisor"],"c":1,"e":"Maxillary canine."},{"q":"In the closed exposure technique:","o":["Window left open","Bracket/chain bonded, mucosa repositioned","Tooth extracted","No traction"],"c":1,"e":"Attachment bonded, flap closed over it."},{"q":"A midline supernumerary tooth is called a:","o":["Mesiodens","Distomolar","Paramolar","Odontoma"],"c":0,"e":"Mesiodens."},{"q":"TADs provide:","o":["Esthetics","Temporary skeletal anchorage","Hemostasis","Sterilization"],"c":1,"e":"Anchorage for movement."},{"q":"A thick labial frenum commonly causes a:","o":["Crossbite","Midline diastema","Open bite","Crowding"],"c":1,"e":"Diastema."},{"q":"Frenectomy for a diastema is usually performed:","o":["Before any ortho","After orthodontic closure","Never","Only in adults"],"c":1,"e":"After closure to prevent relapse."},{"q":"Corticotomy-assisted orthodontics works via the:","o":["Osteopetrosis","Regional acceleratory phenomenon","Ankylosis","Resorption arrest"],"c":1,"e":"RAP speeds movement."},{"q":"Impacted canine localization uses:","o":["TNM","Parallax/SLOB rule","Winter's lines","Champy"],"c":1,"e":"Parallax/CBCT."}],"pearls":["For a deep palatal impacted canine, the closed exposure technique (bond a chain, replace the flap) gives a better aesthetic and periodontal result than leaving an open window.","Remove a mesiodens that is blocking or diverting incisor eruption."],"mistakes":["Choosing an open exposure for a deep palatal canine where a closed technique is better.","Doing a frenectomy before orthodontic closure (higher relapse).","Placing TADs in mobile, unattached mucosa.","Leaving a mesiodens that is obstructing incisor eruption.","Choosing an open exposure for a deep palatal canine where a closed technique is better.","Doing a frenectomy before orthodontic closure (higher relapse).","Placing TADs in mobile, unattached mucosa."],"facts":["Most exposed tooth for ortho: maxillary canine (often palatal).","Open exposure (window) for superficial teeth; closed (bonded chain, flap closed) for deep/palatal.","Localise impacted canine: parallax/SLOB rule or CBCT.","Mesiodens = midline supernumerary; may block/divert incisor eruption.","Thick labial frenum → midline diastema; frenectomy usually AFTER orthodontic closure.","TADs = temporary skeletal anchorage; placed in attached gingiva/interradicular bone.","TAD failure: mobile mucosa, inflammation, root contact.","Corticotomy/PAOO accelerates movement via the regional acceleratory phenomenon.","Surgical exposure timing is coordinated with the orthodontist.","Interceptive removal of the deciduous canine can help guide an ectopic permanent canine.","The maxillary canine is the tooth most often surgically exposed for orthodontics (commonly palatal).","Localise an impacted canine with the parallax (SLOB) rule or CBCT before exposure."],"mnemonics":["Open exposure = superficial tooth; Closed (bonded chain) = deep/palatal.","Diastema frenectomy = AFTER space closure."]},"reconstruction":{"study":[{"h":"1. Principles & Reconstructive Ladder","html":"\n   <p>Restore form & function after resection/trauma. The <b>reconstructive ladder</b>: secondary healing → primary closure → skin graft → local flap → regional flap → <b>free (microvascular) flap</b>.</p>"},{"h":"2. Bone Grafts","html":"\n   <ul><li><b>Autograft</b> (gold standard: osteogenic+osteoinductive+osteoconductive), e.g., iliac crest.</li>\n   <li><b>Allograft</b> (donor), <b>xenograft</b> (animal, e.g., Bio-Oss), <b>alloplast</b> (synthetic).</li></ul>\n   <div class=\"hy\"><b>⭐:</b> Only autograft provides living osteogenic cells. Properties: osteogenesis, osteoinduction (BMP), osteoconduction (scaffold).</div>"},{"h":"3. Flaps for the Jaws","html":"\n   <ul><li><b>Free fibula flap</b>: workhorse for mandibular reconstruction (long bone + skin paddle).</li>\n   <li><b>Pectoralis major</b> (regional pedicled), radial forearm (soft tissue), DCIA (iliac crest).</li></ul>"}],"flashcards":[{"q":"Steps of the reconstructive ladder?","a":"2ry healing→primary closure→graft→local→regional→free flap."},{"q":"Gold standard bone graft?","a":"Autograft."},{"q":"Three properties of an ideal graft?","a":"Osteogenesis, osteoinduction, osteoconduction."},{"q":"Only graft with living osteogenic cells?","a":"Autograft."}],"quiz":[{"q":"The gold standard bone graft is:","o":["Allograft","Autograft","Xenograft","Alloplast"],"c":1,"e":"Autograft (living cells)."},{"q":"Osteoinduction is mediated mainly by:","o":["Collagen","BMP","Calcium","Vitamin D"],"c":1,"e":"Bone morphogenetic proteins."},{"q":"The workhorse free flap for mandibular reconstruction:","o":["Radial forearm","Free fibula","Pectoralis major","Latissimus"],"c":1,"e":"Fibula osteocutaneous flap."},{"q":"A graft from another human is a/an:","o":["Autograft","Allograft","Xenograft","Alloplast"],"c":1,"e":"Allograft."},{"q":"A graft from another species is a/an:","o":["Autograft","Allograft","Xenograft","Alloplast"],"c":2,"e":"Xenograft."},{"q":"Which property means providing a scaffold?","o":["Osteogenesis","Osteoinduction","Osteoconduction","Osteolysis"],"c":2,"e":"Osteoconduction."},{"q":"The reconstructive ladder's highest rung is:","o":["Primary closure","Skin graft","Local flap","Free microvascular flap"],"c":3,"e":"Free flap."},{"q":"Only this graft contains living osteogenic cells:","o":["Allograft","Xenograft","Autograft","Alloplast"],"c":2,"e":"Autograft."}],"pearls":["Autograft is the gold standard because it alone is osteogenic (living cells), as well as osteoinductive (BMP) and osteoconductive (scaffold).","The free fibula flap is the workhorse for segmental mandibular reconstruction (long vascularised bone plus a skin paddle)."],"mistakes":["Calling an allograft/xenograft 'osteogenic' — only autograft contains living osteogenic cells.","Choosing a complex free flap when a simpler rung of the ladder would suffice.","Ignoring post-operative flap monitoring after a microvascular anastomosis.","Forgetting that radiotherapy impairs graft/flap healing.","Calling an allograft/xenograft 'osteogenic' (only autograft contains living osteogenic cells).","Choosing a complex free flap when a simpler rung of the ladder would suffice.","Neglecting post-operative free-flap monitoring after a microvascular anastomosis.","Forgetting that radiotherapy impairs graft/flap healing."],"facts":["Graft properties: osteogenesis (autograft only), osteoinduction (BMP), osteoconduction (scaffold).","Autograft = gold standard (iliac crest, ramus/chin, fibula vascularised).","Allograft (human), xenograft (Bio-Oss/bovine), alloplast (HA, β-TCP, bioglass).","Reconstructive ladder: 2ry healing → primary closure → graft → local → regional → free flap.","Free fibula = workhorse for mandibular reconstruction (bone + skin paddle).","Radial forearm (soft tissue), DCIA/iliac crest (bulky bone), pec major (pedicled regional).","Free flaps need microvascular anastomosis; monitor perfusion post-op.","Non-vascularised grafts heal by creeping substitution; large defects need vascularised bone.","Distraction osteogenesis: latency → activation → consolidation.","Maxillary defects rehabilitated with obturators; implants placed in reconstructed bone.","Goal: restore form AND function (continuity, occlusion, oral competence).","Goal of reconstruction: restore form AND function (continuity, occlusion, oral competence, swallowing/speech, contour).","Graft properties: osteogenesis (living cells), osteoinduction (BMP recruits cells), osteoconduction (scaffold).","Autograft = gold standard (the only osteogenic graft — living cells)."],"mnemonics":["Graft properties 'OII': Osteogenesis (autograft only), Osteoinduction (BMP), Osteoconduction (scaffold).","Mandible workhorse = Free Fibula."]},"endo_surgery":{"study":[{"h":"1. Apicectomy (Apical Surgery)","html":"\n   <p>Surgical removal of the apical portion of a root + curettage of periapical pathology when orthograde RCT fails or is impractical. A {{retrograde filling|حشوة راجعة}} seals the canal apically.</p>\n   <div class=\"hy\"><b>⭐:</b> Resect ~3 mm of the apex (removes most lateral canals/apical ramifications) with a shallow bevel; modern MTA retrograde fillings give best seal.</div>"},{"h":"2. Indications & Contraindications","html":"\n   <ul><li><b>Indications:</b> failed RCT not retreatable, persistent periapical lesion, broken instrument/post precluding orthograde, biopsy of periapical lesion.</li>\n   <li><b>Contraindications:</b> poor access, untreatable tooth, vertical root fracture, proximity to vital structures without control.</li></ul>"},{"h":"3. Retrograde Filling Materials & Other Procedures","html":"\n   <ul><li>Materials: <b>MTA</b> (best), IRM/super-EBA; amalgam now largely abandoned.</li>\n   <li>Other: hemisection, root amputation, bicuspidization, intentional replantation.</li></ul>"}],"flashcards":[{"q":"What is apicectomy?","a":"Surgical resection of the root apex + periapical curettage."},{"q":"How much apex is resected?","a":"~3 mm."},{"q":"Best retrograde filling material?","a":"MTA."},{"q":"Purpose of retrograde filling?","a":"Apical seal of the canal."}],"quiz":[{"q":"Apicectomy involves removal of the:","o":["Whole root","Apical portion of the root","Crown","Pulp chamber only"],"c":1,"e":"Root apex + curettage."},{"q":"The recommended length of apex resected is about:","o":["1 mm","3 mm","7 mm","10 mm"],"c":1,"e":"~3 mm removes most ramifications."},{"q":"The best modern retrograde filling material:","o":["Amalgam","MTA","GIC","Composite"],"c":1,"e":"MTA seals well, biocompatible."},{"q":"The purpose of a retrograde filling is to:","o":["Restore the crown","Seal the canal apically","Splint the tooth","Whiten"],"c":1,"e":"Apical seal."},{"q":"A clear indication for apical surgery:","o":["Healthy tooth","Failed non-retreatable RCT with lesion","Mild sensitivity","Caries"],"c":1,"e":"Persistent periapical pathology."},{"q":"A contraindication to apicectomy:","o":["Good access","Vertical root fracture","Single root","Anterior tooth"],"c":1,"e":"VRF → extraction."},{"q":"Hemisection is usually performed on:","o":["Maxillary incisors","Mandibular molars","Canines","Premolars"],"c":1,"e":"Multi-rooted mandibular molars."},{"q":"Root amputation removes:","o":["A root, keeping the crown","The crown","The whole tooth","The apex 1mm"],"c":0,"e":"Removes a root, retains crown."},{"q":"A shallow bevel during apicectomy is preferred to:","o":["Increase dentin tubule exposure","Minimize exposed tubules/leakage","Speed surgery","Improve esthetics"],"c":1,"e":"Less bevel = fewer exposed tubules."}],"pearls":["Apicectomy is indicated when orthograde root canal treatment has failed and cannot be retreated, with persistent periapical pathology.","Resect about 3 mm of the apex to remove most lateral canals and apical ramifications, and use a shallow bevel to minimise exposed dentinal tubules."],"mistakes":["Doing apical surgery on a vertically fractured (unrestorable) tooth instead of extracting it.","Resecting with a steep bevel, exposing many dentinal tubules and increasing leakage.","Using amalgam as a retrograde filling instead of MTA.","Relying on periapical curettage without sealing the canal apically.","Operating without first considering orthograde retreatment.","Doing apical surgery on a vertically fractured (unrestorable) tooth instead of extracting it.","Resecting with a steep bevel, exposing many dentinal tubules and increasing leakage.","Using amalgam as a retrograde filling instead of MTA."],"facts":["Apicectomy = surgical resection of the root apex + periapical curettage.","Resect ~3 mm of apex (removes most lateral canals/apical ramifications) with a shallow bevel.","Retrograde filling seals the canal apically; best material = MTA (amalgam obsolete).","Root-end prep ~3 mm along the canal axis with ultrasonic retro-tips.","Flap designs: sulcular, submarginal (Ochsenbein-Luebke), semilunar.","Indications: failed/non-retreatable RCT with periapical lesion, blocked canal/post, biopsy.","Contraindications: untreatable tooth, vertical root fracture, poor access/support.","Hemisection (remove one root + crown portion), root amputation (remove a root, keep crown), bicuspidisation.","Intentional replantation: extract, seal apex extra-orally, replant.","Periapical curettage alone is insufficient without sealing the canal.","Apicectomy (apical surgery) = surgical removal of the root apex + curettage of the periapical pathology.","Indications: failed orthograde RCT that cannot be retreated, a blocking post, a separated instrument beyond the apex, the need for a periapical biopsy.","Contraindications: untreatable/unrestorable tooth, vertical root fracture, poor access, inadequate periodontal support.","Flap designs: sulcular full-thickness, submarginal (Ochsenbein-Luebke), or semilunar (limited)."],"mnemonics":["Resect ~3 mm apex + shallow bevel.","Retrograde filling = MTA (not amalgam)."]},"an_skull":{"hasLevels":true,"ar":"الجمجمة والحُفَر القحفية","blurb":"The bony container of the brain — its bones, sutures, fossae, and the foramina that transmit every nerve and vessel entering or leaving the cranium.","study":[{"h":"Enumerations · المسميات والأعداد","lvl":"surface","html":"<h4>Two regions of the skull</h4><ul><li>Cranium (braincase)</li><li>Facial skeleton</li></ul><h4>The three cranial fossae</h4><ul><li>Anterior cranial fossa — holds the frontal lobes</li><li>Middle cranial fossa — holds the temporal lobes</li><li>Posterior cranial fossa — holds the cerebellum, pons & medulla</li></ul><h4>The three major sutures</h4><ul><li>Coronal suture (frontal ↔ parietals)</li><li>Sagittal suture (between the two parietals)</li><li>Lambdoid suture (parietals ↔ occipital)</li></ul>"},{"h":"Functions · الوظائف","lvl":"surface","html":"<table><tr><th>Structure</th><th>Function</th></tr><tr><td><b>Cranium</b></td><td>Encloses and protects the brain and its meninges.</td></tr><tr><td><b>Facial skeleton</b></td><td>Frames the eyes, nose and mouth; anchors the teeth and muscles of mastication.</td></tr><tr><td><b>Sutures</b></td><td>Fibrous joints that permit growth of the skull and allow slight movement (moulding) during birth.</td></tr></table>"},{"h":"Comparisons & Differences · الفوارق","lvl":"surface","html":"<p><b>Cranium</b> vs <b>Facial skeleton</b>: The cranium is the upper box that holds the brain; the facial skeleton is the front framework of the face. 8 cranial bones vs 14 facial bones.</p><p><b>Cranial vault</b> vs <b>Cranial base</b>: The vault (roof & sides) is smooth and rounded; the base (floor) is irregular and stepped into three fossae.</p>"},{"h":"Precision Facts · معلومات دقيقة","lvl":"surface","html":"<ol class=\"facts\"><li>The skull is divided into the cranium and the facial bones.</li><li>There are three cranial fossae: anterior, middle and posterior.</li><li>The pterion is the thinnest part of the side of the skull.</li></ol>"}],"scenarios":[],"quiz":[],"flashcards":[{"q":"Foramen spinosum transmits?","a":"Middle meningeal artery (+ vein & meningeal branch of V3)"},{"q":"Foramen rotundum transmits?","a":"Maxillary nerve (V2)"},{"q":"Foramen ovale transmits?","a":"Mandibular nerve (V3) + lesser petrosal nerve"},{"q":"Optic canal transmits?","a":"CN II (optic nerve) + ophthalmic artery"}],"pearls":["Spinosum → middle meningeal artery. Rotundum → V2. Ovale → V3. Lock these three together.","Pterion = thinnest lateral skull = anterior middle meningeal artery = extradural haemorrhage."],"mistakes":["<b>Myth:</b> The maxillary nerve (V2) exits through the superior orbital fissure. <b style=\"color:var(--green)\">Truth:</b> V2 exits through the foramen ROTUNDUM. The superior orbital fissure carries V1 (with III, IV, VI).","<b>Myth:</b> The outer table of the skull is thinner and fractures first. <b style=\"color:var(--green)\">Truth:</b> The INNER table is thinner and more brittle and may fracture even when the outer table is intact."]},"an_cranial-nerves":{"hasLevels":true,"ar":"الأعصاب القحفية الاثنا عشر","blurb":"The twelve paired nerves that emerge directly from the brain — their names, functional components, skull exits, and the muscles, glands and sensations they govern.","study":[{"h":"Enumerations · المسميات والأعداد","lvl":"surface","html":"<h4>The twelve nerves in order</h4><ul><li>I Olfactory</li><li>II Optic</li><li>III Oculomotor</li><li>IV Trochlear</li><li>V Trigeminal</li><li>VI Abducent</li><li>VII Facial</li><li>VIII Vestibulocochlear</li><li>IX Glossopharyngeal</li><li>X Vagus</li><li>XI Accessory</li><li>XII Hypoglossal</li></ul><div class=\"hy\"><b>Note:</b> Mnemonic: 'Oh Oh Oh To Touch And Feel Very Good Velvet, Ah!'</div><h4>Purely sensory nerves (3)</h4><ul><li>I Olfactory</li><li>II Optic</li><li>VIII Vestibulocochlear</li></ul><h4>Purely motor nerves (5)</h4><ul><li>III Oculomotor</li><li>IV Trochlear</li><li>VI Abducent</li><li>XI Accessory</li><li>XII Hypoglossal</li></ul><h4>Mixed nerves (4)</h4><ul><li>V Trigeminal</li><li>VII Facial</li><li>IX Glossopharyngeal</li><li>X Vagus</li></ul>"},{"h":"Functions · الوظائف","lvl":"surface","html":"<table><tr><th>Structure</th><th>Function</th></tr><tr><td><b>CN I Olfactory</b></td><td>Sense of smell.</td></tr><tr><td><b>CN II Optic</b></td><td>Sense of vision.</td></tr><tr><td><b>CN VIII Vestibulocochlear</b></td><td>Hearing and balance.</td></tr><tr><td><b>CN XII Hypoglossal</b></td><td>Moves the tongue.</td></tr></table>"},{"h":"Comparisons & Differences · الفوارق","lvl":"surface","html":"<p><b>Sensory nerves (I, II, VIII)</b> vs <b>Motor nerves (III, IV, VI, XI, XII)</b>: Sensory nerves carry information INTO the brain (smell, sight, hearing); motor nerves carry commands OUT to muscles.</p><p><b>CN II Optic</b> vs <b>CN I Olfactory</b>: Both are sensory, but the optic nerve is really a brain tract (myelinated by oligodendrocytes, sheathed in meninges); the olfactory filaments are true peripheral nerves through the cribriform plate.</p>"},{"h":"Precision Facts · معلومات دقيقة","lvl":"surface","html":"<ol class=\"facts\"><li>Three cranial nerves are purely sensory: I, II and VIII.</li><li>The vagus is the tenth cranial nerve.</li><li>The hypoglossal nerve moves the tongue.</li></ol>"}],"scenarios":[],"quiz":[],"flashcards":[{"q":"Purely sensory cranial nerves?","a":"I (Olfactory), II (Optic), VIII (Vestibulocochlear)"},{"q":"Purely motor cranial nerves?","a":"III, IV, VI, XI, XII"},{"q":"Mixed cranial nerves?","a":"V, VII, IX, X"},{"q":"Four parasympathetic ganglia of the head?","a":"Ciliary (III), Pterygopalatine (VII), Submandibular (VII), Otic (IX)"}],"pearls":["Sensory: I, II, VIII. Motor: III, IV, VI, XI, XII. Both: V, VII, IX, X.","Jugular foramen = IX, X, XI together."],"mistakes":["<b>Myth:</b> All cranial nerves arise from the brainstem. <b style=\"color:var(--green)\">Truth:</b> I (olfactory) arises from the olfactory bulb (forebrain) and II (optic) from the diencephalon; only III–XII arise from the brainstem.","<b>Myth:</b> A stroke affecting the face paralyses the whole half including the forehead. <b style=\"color:var(--green)\">Truth:</b> That is a lower motor neuron pattern. An upper motor neuron lesion (stroke) SPARES the forehead."]},"an_meninges":{"hasLevels":true,"ar":"السحايا والجيوب الوريدية والنزوف","blurb":"The three protective coverings of the brain, the dural venous sinuses that drain it, and the four classic patterns of intracranial bleeding.","study":[{"h":"Enumerations · المسميات والأعداد","lvl":"surface","html":"<h4>The three meninges (outer → inner)</h4><ul><li>Dura mater (tough outer layer)</li><li>Arachnoid mater (middle web)</li><li>Pia mater (delicate inner layer on the brain)</li></ul><h4>The four types of intracranial haemorrhage</h4><ul><li>Extradural (epidural)</li><li>Subdural</li><li>Subarachnoid</li><li>Intracerebral</li></ul>"},{"h":"Functions · الوظائف","lvl":"surface","html":"<table><tr><th>Structure</th><th>Function</th></tr><tr><td><b>Dura mater</b></td><td>Tough protective outer envelope of the brain and spinal cord.</td></tr><tr><td><b>Arachnoid mater</b></td><td>Encloses the cerebrospinal fluid in the subarachnoid space.</td></tr><tr><td><b>Pia mater</b></td><td>Closely invests the brain surface and carries its blood vessels.</td></tr></table>"},{"h":"Comparisons & Differences · الفوارق","lvl":"surface","html":"<p><b>Dura mater</b> vs <b>Pia mater</b>: Dura is the tough outer layer; pia is the delicate inner layer that hugs the brain's surface.</p><p><b>Subdural space</b> vs <b>Subarachnoid space</b>: Subdural is only a potential space; the subarachnoid space is a real space filled with cerebrospinal fluid.</p>"},{"h":"Precision Facts · معلومات دقيقة","lvl":"surface","html":"<ol class=\"facts\"><li>There are three meninges: dura, arachnoid and pia mater.</li><li>Cerebrospinal fluid lies in the subarachnoid space.</li><li>Extradural haemorrhage follows a blow to the side of the head.</li></ol>"}],"scenarios":[],"quiz":[],"flashcards":[{"q":"Three meninges (outer→inner)?","a":"Dura, arachnoid, pia mater"},{"q":"Two layers of dura?","a":"Endosteal (periosteal) + meningeal"},{"q":"Extradural haemorrhage source?","a":"Anterior division of the middle meningeal artery"},{"q":"Subdural haemorrhage source?","a":"Superior cerebral bridging veins"},{"q":"Subarachnoid haemorrhage source?","a":"Ruptured berry aneurysm (circle of Willis)"},{"q":"Cavernous sinus WALL contents?","a":"CN III, IV, V1, V2"},{"q":"Cavernous sinus LUMEN contents?","a":"Internal carotid artery + CN VI"}],"pearls":["Extradural = arterial (middle meningeal). Subdural = venous (bridging veins). Lock the pair together.","Cavernous sinus WALL = III, IV, V1, V2. LUMEN = ICA + VI. CN VI goes first.","Pterion + lucid interval + contralateral weakness = extradural haemorrhage."],"mistakes":["<b>Myth:</b> Extradural haemorrhage is venous. <b style=\"color:var(--green)\">Truth:</b> It is ARTERIAL — from the middle meningeal artery. Subdural haemorrhage is the venous one.","<b>Myth:</b> The internal carotid artery lies in the wall of the cavernous sinus. <b style=\"color:var(--green)\">Truth:</b> It passes THROUGH the sinus lumen, together with CN VI."]},"an_orbit-eye":{"hasLevels":true,"ar":"الحجاج والعين","blurb":"The bony socket, the six muscles that move the eyeball and the nerves that drive them, plus the tear pathway and the pupillary reflexes.","study":[{"h":"Enumerations · المسميات والأعداد","lvl":"surface","html":"<h4>The two openings at the back of the orbit</h4><ul><li>Optic canal (for the optic nerve)</li><li>Superior orbital fissure (for the nerves that move the eye)</li></ul><h4>The number of muscles that move each eyeball</h4><ul><li>Six (four 'recti' + two 'obliques')</li></ul>"},{"h":"Functions · الوظائف","lvl":"surface","html":"<table><tr><th>Structure</th><th>Function</th></tr><tr><td><b>Orbit</b></td><td>The bony socket that houses and protects the eyeball and its muscles.</td></tr><tr><td><b>Extra-ocular muscles</b></td><td>Move the eyeball so the two eyes point together.</td></tr><tr><td><b>Lacrimal gland</b></td><td>Produces tears that lubricate and protect the eye.</td></tr></table>"},{"h":"Comparisons & Differences · الفوارق","lvl":"surface","html":"<p><b>Optic canal</b> vs <b>Superior orbital fissure</b>: The optic canal carries the nerve of SIGHT (II); the superior orbital fissure carries the nerves of MOVEMENT (III, IV, VI) plus V1.</p>"},{"h":"Precision Facts · معلومات دقيقة","lvl":"surface","html":"<ol class=\"facts\"><li>Six muscles move each eyeball.</li><li>The optic nerve passes through the optic canal.</li><li>Tears drain into the nose.</li></ol>"}],"scenarios":[],"quiz":[],"flashcards":[{"q":"How many extra-ocular muscles?","a":"Six (4 recti + 2 obliques)"},{"q":"Nerve to lateral rectus?","a":"Abducent (VI) — 'LR6'"},{"q":"Nerve to superior oblique?","a":"Trochlear (IV) — 'SO4'"},{"q":"Nerve to all other eye muscles?","a":"Oculomotor (III)"},{"q":"Nasolacrimal duct drains into?","a":"Inferior meatus of the nose"},{"q":"Which muscle raises the upper lid?","a":"Levator palpebrae superioris (III)"}],"pearls":["LR6 SO4 — everything else is III.","Optic nerve = optic canal; eye-movement nerves = superior orbital fissure.","Light reflex: in by optic (II), out by oculomotor (III)."],"mistakes":["<b>Myth:</b> The optic nerve passes through the superior orbital fissure. <b style=\"color:var(--green)\">Truth:</b> The optic nerve uses the OPTIC CANAL; the superior orbital fissure carries III, IV, V1 and VI.","<b>Myth:</b> The lateral rectus is supplied by the oculomotor nerve. <b style=\"color:var(--green)\">Truth:</b> It is supplied by the ABDUCENT nerve (VI). 'LR6'."]},"an_ear":{"hasLevels":true,"ar":"الأذن","blurb":"Three parts — external, middle and internal — the chain of tiny bones that conducts sound, and the clinically vital relations of the middle-ear cavity.","study":[{"h":"Enumerations · المسميات والأعداد","lvl":"surface","html":"<h4>The three parts of the ear</h4><ul><li>External ear (auricle + ear canal)</li><li>Middle ear (the air-filled cavity with the ossicles)</li><li>Internal ear (the labyrinth for hearing & balance)</li></ul><h4>The three little ear bones (ossicles)</h4><ul><li>Malleus (hammer)</li><li>Incus (anvil)</li><li>Stapes (stirrup)</li></ul>"},{"h":"Functions · الوظائف","lvl":"surface","html":"<table><tr><th>Structure</th><th>Function</th></tr><tr><td><b>External ear</b></td><td>Collects sound and channels it to the eardrum.</td></tr><tr><td><b>Middle ear (ossicles)</b></td><td>Conducts and amplifies sound from the eardrum to the inner ear.</td></tr><tr><td><b>Internal ear</b></td><td>Converts sound to nerve signals (cochlea) and senses balance (vestibule/canals).</td></tr></table>"},{"h":"Comparisons & Differences · الفوارق","lvl":"surface","html":"<p><b>External ear</b> vs <b>Middle ear</b>: The external ear gathers sound through air; the middle ear conducts it mechanically through three tiny bones.</p>"},{"h":"Precision Facts · معلومات دقيقة","lvl":"surface","html":"<ol class=\"facts\"><li>The ear has three parts: external, middle and internal.</li><li>The three ossicles are the malleus, incus and stapes.</li><li>The inner ear handles both hearing and balance.</li></ol>"}],"scenarios":[],"quiz":[],"flashcards":[{"q":"Three parts of the ear?","a":"External, middle, internal"},{"q":"The three ossicles?","a":"Malleus, incus, stapes"},{"q":"Stapes sits in which window?","a":"The oval window"},{"q":"Nerve to tensor tympani?","a":"Mandibular (V3)"}],"pearls":["Ossicles: malleus → incus → stapes; stapes sits in the oval window.","Tensor tympani = V3; stapedius = VII (loss → hyperacusis)."],"mistakes":["<b>Myth:</b> Tensor tympani is supplied by the facial nerve. <b style=\"color:var(--green)\">Truth:</b> Tensor tympani = V3. STAPEDIUS is the facial-nerve (VII) muscle.","<b>Myth:</b> The auditory tube connects the middle ear to the oropharynx. <b style=\"color:var(--green)\">Truth:</b> It connects to the NASOpharynx."]},"an_mandible-tmj":{"hasLevels":true,"ar":"الفك السفلي والمفصل الصدغي وعضلات المضغ","blurb":"The only mobile bone of the skull, the joint that moves it, and the four muscles that power the bite — core territory for the maxillofacial surgeon.","study":[{"h":"Enumerations · المسميات والأعداد","lvl":"surface","html":"<h4>Parts of the mandible</h4><ul><li>Body (horizontal, carries the teeth)</li><li>Ramus (vertical)</li><li>Angle (where body meets ramus)</li></ul><h4>Two processes on top of the ramus</h4><ul><li>Coronoid process (front) — temporalis attaches</li><li>Condylar process (back) — forms the joint</li></ul><h4>The four muscles of mastication</h4><ul><li>Masseter</li><li>Temporalis</li><li>Medial pterygoid</li><li>Lateral pterygoid</li></ul>"},{"h":"Functions · الوظائف","lvl":"surface","html":"<table><tr><th>Structure</th><th>Function</th></tr><tr><td><b>Mandible</b></td><td>Holds the lower teeth and is the only freely movable bone of the skull.</td></tr><tr><td><b>TMJ</b></td><td>The hinge-and-slide joint that lets you open, close and grind.</td></tr><tr><td><b>Muscles of mastication</b></td><td>Power chewing by moving the mandible.</td></tr></table>"},{"h":"Comparisons & Differences · الفوارق","lvl":"surface","html":"<p><b>Body of mandible</b> vs <b>Ramus of mandible</b>: The body is the horizontal part that carries the teeth; the ramus is the vertical part that rises to the joint.</p><p><b>Open the jaw</b> vs <b>Close the jaw</b>: Opening is mainly lateral pterygoid (+ gravity & suprahyoids); closing is masseter, temporalis and medial pterygoid.</p>"},{"h":"Precision Facts · معلومات دقيقة","lvl":"surface","html":"<ol class=\"facts\"><li>The mandible is the only movable bone of the skull.</li><li>There are four muscles of mastication.</li><li>The temporomandibular joint allows you to open, close and grind.</li></ol>"}],"scenarios":[],"quiz":[],"flashcards":[{"q":"Four muscles of mastication?","a":"Masseter, Temporalis, Medial pterygoid, Lateral pterygoid"},{"q":"Which muscle OPENS the jaw?","a":"Lateral pterygoid"},{"q":"Nerve to all muscles of mastication?","a":"Mandibular nerve (V3)"},{"q":"Inferior alveolar nerve: entry and exit?","a":"Enters mandibular foramen, exits mental foramen"},{"q":"TMJ articular surface covering?","a":"Fibrocartilage (not hyaline)"},{"q":"What divides the TMJ into two compartments?","a":"The articular disc (upper = glide, lower = hinge)"},{"q":"Landmark for an IAN block?","a":"The lingula (sphenomandibular ligament attaches there)"},{"q":"Reduce an anterior TMJ dislocation by?","a":"Press down on molars + push jaw backward"}],"pearls":["Lateral pterygoid is the ONLY masticatory muscle that opens the jaw; the other three close it.","All four chewing muscles = mandibular nerve (V3).","IAN: enters mandibular foramen, exits mental foramen."],"mistakes":["<b>Myth:</b> The masseter opens the jaw. <b style=\"color:var(--green)\">Truth:</b> The masseter CLOSES (elevates) the jaw. The lateral pterygoid opens it.","<b>Myth:</b> The TMJ is covered by hyaline cartilage like other synovial joints. <b style=\"color:var(--green)\">Truth:</b> It is covered by FIBROcartilage."]},"an_face":{"hasLevels":true,"ar":"الوجه والعصب الوجهي","blurb":"The muscles of expression and the seventh cranial nerve that drives them — plus the sensory map of the trigeminal nerve and the venous 'danger area' of the face.","study":[{"h":"Enumerations · المسميات والأعداد","lvl":"surface","html":"<h4>Two nerve supplies of the face</h4><ul><li>Motor — facial nerve (VII) to the muscles of expression</li><li>Sensory — trigeminal nerve (V) to the skin</li></ul><h4>The facial nerve's job in one line</h4><ul><li>Moves every muscle of facial expression</li><li>Carries taste from the front of the tongue</li><li>Drives tear and saliva glands</li></ul>"},{"h":"Functions · الوظائف","lvl":"surface","html":"<table><tr><th>Structure</th><th>Function</th></tr><tr><td><b>Muscles of expression</b></td><td>Open and close the eyes, nose and mouth and convey emotion.</td></tr><tr><td><b>Facial nerve (VII)</b></td><td>Supplies all the muscles of facial expression.</td></tr><tr><td><b>Trigeminal nerve (V)</b></td><td>Provides sensation to the skin of the face.</td></tr></table>"},{"h":"Comparisons & Differences · الفوارق","lvl":"surface","html":"<p><b>Facial nerve (VII)</b> vs <b>Trigeminal nerve (V)</b>: VII MOVES the face (motor to expression). V FEELS the face (sensory to skin) and moves the chewing muscles.</p><p><b>Muscles of expression</b> vs <b>Muscles of mastication</b>: Expression muscles = facial nerve (VII), thin and attach to skin. Chewing muscles = mandibular nerve (V3), bulky and attach to the mandible.</p>"},{"h":"Precision Facts · معلومات دقيقة","lvl":"surface","html":"<ol class=\"facts\"><li>The facial nerve (VII) supplies the muscles of facial expression.</li><li>The trigeminal nerve (V) supplies sensation to the face.</li><li>The muscles of expression develop from the second pharyngeal arch.</li></ol>"}],"scenarios":[],"quiz":[],"flashcards":[{"q":"Nerve supply to muscles of facial expression?","a":"Facial nerve (VII)"},{"q":"Five terminal branches of VII?","a":"Temporal, Zygomatic, Buccal, Marginal mandibular, Cervical"},{"q":"Facial nerve exits skull through?","a":"Stylomastoid foramen"},{"q":"Buccal branch of VII vs buccal nerve of V3?","a":"VII = motor to buccinator; V3 = sensory to cheek"},{"q":"Sensation to angle of jaw?","a":"Great auricular nerve (C2,3) — not trigeminal"},{"q":"Chorda tympani carries?","a":"Taste ant. 2/3 tongue + secretomotor to submandibular/sublingual glands"},{"q":"Greater petrosal nerve supplies?","a":"Lacrimal gland (+ nasal/palatine glands)"},{"q":"UMN facial palsy spares the…?","a":"Forehead (bilateral cortical supply)"}],"pearls":["VII MOVES the face, V FEELS the face. Lock this in.","Forehead spared = stroke (UMN). Forehead involved = Bell's palsy (LMN).","Buccal branch of VII = motor to buccinator; buccal nerve of V3 = sensory to cheek. Same name, opposite job."],"mistakes":["<b>Myth:</b> Bell's palsy spares the forehead. <b style=\"color:var(--green)\">Truth:</b> Bell's palsy is a LMN lesion and paralyses the WHOLE half of the face, including the forehead. It is the UMN (stroke) lesion that spares the forehead.","<b>Myth:</b> The buccinator is supplied by the trigeminal nerve. <b style=\"color:var(--green)\">Truth:</b> Buccinator is MOVED by the buccal branch of the FACIAL nerve. The buccal nerve of V3 only gives sensation to the cheek."]},"an_scalp":{"hasLevels":true,"ar":"فروة الرأس","blurb":"Five layers, a memorable acronym, and the reason scalp wounds bleed so dramatically yet heal so well.","study":[{"h":"Enumerations · المسميات والأعداد","lvl":"surface","html":"<h4>The 5 layers of the scalp (S-C-A-L-P)</h4><ul><li>Skin</li><li>Connective tissue (dense)</li><li>Aponeurosis (epicranial / galea)</li><li>Loose areolar tissue</li><li>Pericranium</li></ul><div class=\"hy\"><b>Note:</b> Spelling SCALP gives you the five layers in order from outside in.</div><h4>The muscle of the scalp</h4><ul><li>Occipitofrontalis (frontal + occipital bellies joined by the aponeurosis)</li></ul>"},{"h":"Functions · الوظائف","lvl":"surface","html":"<table><tr><th>Structure</th><th>Function</th></tr><tr><td><b>Scalp</b></td><td>Protects the skull and is highly vascular for temperature regulation.</td></tr><tr><td><b>Occipitofrontalis</b></td><td>Raises the eyebrows and wrinkles the forehead (surprise).</td></tr></table>"},{"h":"Comparisons & Differences · الفوارق","lvl":"surface","html":"<p><b>Top 3 layers</b> vs <b>Bottom 2 layers</b>: Skin + connective tissue + aponeurosis move as one mobile cap; the loose areolar + pericranium stay behind.</p>"},{"h":"Precision Facts · معلومات دقيقة","lvl":"surface","html":"<ol class=\"facts\"><li>The scalp has five layers, remembered by the word SCALP.</li><li>The muscle of the scalp is occipitofrontalis.</li><li>The scalp has a very rich blood supply.</li></ol>"}],"scenarios":[],"quiz":[],"flashcards":[{"q":"The 5 scalp layers (acronym)?","a":"S-C-A-L-P: Skin, Connective tissue, Aponeurosis, Loose areolar, Pericranium"},{"q":"Which 3 layers move as one?","a":"Skin + connective tissue + aponeurosis"},{"q":"Why do scalp wounds bleed so much?","a":"Vessels held open by fibrous septa — can't retract"}],"pearls":["SCALP = Skin, Connective tissue, Aponeurosis, Loose areolar, Pericranium.","Loose areolar = dangerous area = emissary veins to the intracranial sinuses."],"mistakes":["<b>Myth:</b> The skin layer is responsible for the heavy bleeding of scalp wounds. <b style=\"color:var(--green)\">Truth:</b> It is the dense connective tissue layer, whose septa hold vessels open.","<b>Myth:</b> All five scalp layers move together. <b style=\"color:var(--green)\">Truth:</b> Only the outer THREE (skin, connective tissue, aponeurosis) move as a unit."]},"an_neck-triangles":{"hasLevels":true,"ar":"الرقبة: اللفافات والمثلثات","blurb":"How the deep cervical fascia organises the neck into compartments and spaces, and how the sternocleidomastoid divides it into surgical triangles.","study":[{"h":"Enumerations · المسميات والأعداد","lvl":"surface","html":"<h4>Two main triangles of the neck</h4><ul><li>Anterior triangle (in front of sternocleidomastoid)</li><li>Posterior triangle (behind sternocleidomastoid)</li></ul><h4>The muscle that divides the neck</h4><ul><li>Sternocleidomastoid (SCM)</li></ul>"},{"h":"Functions · الوظائف","lvl":"surface","html":"<table><tr><th>Structure</th><th>Function</th></tr><tr><td><b>Sternocleidomastoid</b></td><td>Turns the head to the opposite side and tilts it to the same side; landmark dividing the neck.</td></tr><tr><td><b>Cervical fascia</b></td><td>Organises the neck into sleeves and spaces, allowing structures to glide and limiting the spread of infection.</td></tr></table>"},{"h":"Comparisons & Differences · الفوارق","lvl":"surface","html":"<p><b>Anterior triangle</b> vs <b>Posterior triangle</b>: Anterior triangle lies in front of SCM (contains the airway, great vessels and thyroid); the posterior triangle lies behind SCM (contains nerves to the upper limb and the accessory nerve).</p>"},{"h":"Precision Facts · معلومات دقيقة","lvl":"surface","html":"<ol class=\"facts\"><li>The sternocleidomastoid divides the neck into anterior and posterior triangles.</li><li>The carotid sheath contains the carotid artery, internal jugular vein and vagus nerve.</li><li>The thyroid gland moves on swallowing.</li></ol>"}],"scenarios":[],"quiz":[],"flashcards":[{"q":"What divides the neck into two triangles?","a":"Sternocleidomastoid (SCM)"},{"q":"Three layers of deep cervical fascia?","a":"Investing, Pretracheal, Prevertebral"},{"q":"Contents of the carotid sheath?","a":"Carotid artery, internal jugular vein, vagus nerve"},{"q":"Which fascia makes the thyroid move on swallowing?","a":"Pretracheal fascia"},{"q":"Nerve crossing the posterior triangle?","a":"Accessory nerve (XI)"}],"pearls":["SCM splits the neck into anterior (airway/vessels) and posterior (nerves) triangles.","Carotid sheath = carotid artery + internal jugular vein + vagus."],"mistakes":["<b>Myth:</b> The phrenic nerve runs inside the carotid sheath. <b style=\"color:var(--green)\">Truth:</b> The phrenic nerve lies on scalenus anterior, OUTSIDE the sheath. The sheath holds the carotid, IJV and vagus.","<b>Myth:</b> The thyroid moves on swallowing because it is muscular. <b style=\"color:var(--green)\">Truth:</b> It moves because the pretracheal fascia tethers it to the larynx."]},"an_arteries":{"hasLevels":true,"ar":"شرايين الرأس والرقبة","blurb":"From the common carotid bifurcation to the eight branches of the external carotid and the circle of Willis that feeds the brain.","study":[{"h":"Enumerations · المسميات والأعداد","lvl":"surface","html":"<h4>The carotid system splits into</h4><ul><li>External carotid artery (supplies the face & neck)</li><li>Internal carotid artery (supplies the brain & eye)</li></ul><h4>Where the common carotid divides</h4><ul><li>At the upper border of the thyroid cartilage (about C3–C4)</li></ul>"},{"h":"Functions · الوظائف","lvl":"surface","html":"<table><tr><th>Structure</th><th>Function</th></tr><tr><td><b>External carotid artery</b></td><td>Supplies the structures of the face, scalp and neck.</td></tr><tr><td><b>Internal carotid artery</b></td><td>Supplies the brain and the eye.</td></tr></table>"},{"h":"Comparisons & Differences · الفوارق","lvl":"surface","html":"<p><b>External carotid</b> vs <b>Internal carotid</b>: External carotid supplies the face/neck and has eight branches; internal carotid supplies the brain/eye and gives NO branches in the neck.</p>"},{"h":"Precision Facts · معلومات دقيقة","lvl":"surface","html":"<ol class=\"facts\"><li>The common carotid artery divides into external and internal carotid arteries.</li><li>The internal carotid artery supplies the brain.</li><li>The facial artery supplies the face.</li></ol>"}],"scenarios":[],"quiz":[],"flashcards":[{"q":"Common carotid divides into?","a":"External + internal carotid arteries"},{"q":"Where does the common carotid divide?","a":"Upper border of the thyroid cartilage"},{"q":"How many external carotid branches?","a":"Eight"},{"q":"Internal carotid branches in the neck?","a":"None"}],"pearls":["Internal carotid = NO branches in the neck; external carotid = eight branches.","Common carotid divides at the upper border of the thyroid cartilage."],"mistakes":["<b>Myth:</b> The internal carotid artery has several branches in the neck. <b style=\"color:var(--green)\">Truth:</b> It gives NO branches in the neck.","<b>Myth:</b> The carotid body senses blood pressure. <b style=\"color:var(--green)\">Truth:</b> The carotid body is a CHEMOreceptor (O₂/CO₂). The carotid SINUS senses pressure (baroreceptor)."]},"an_veins-lymph":{"hasLevels":true,"ar":"الأوردة والتصريف اللمفي","blurb":"The venous return of the head and neck — including the 'danger' connections to the cavernous sinus — and the lymph-node map that every head-and-neck surgeon must know.","study":[{"h":"Enumerations · المسميات والأعداد","lvl":"surface","html":"<h4>The main veins draining the head & neck</h4><ul><li>Internal jugular vein (deep, the main drainage)</li><li>External jugular vein (superficial)</li></ul><h4>Where all neck lymph eventually drains</h4><ul><li>Into the deep cervical chain of lymph nodes, then to the venous system</li></ul>"},{"h":"Functions · الوظائف","lvl":"surface","html":"<table><tr><th>Structure</th><th>Function</th></tr><tr><td><b>Internal jugular vein</b></td><td>The main vein draining blood from the brain, face and neck.</td></tr><tr><td><b>Lymph nodes</b></td><td>Filter lymph and mount immune responses; in cancer they reveal the spread of disease.</td></tr></table>"},{"h":"Comparisons & Differences · الفوارق","lvl":"surface","html":"<p><b>Internal jugular vein</b> vs <b>External jugular vein</b>: Internal jugular is deep and is the MAIN drainage of the head/neck; external jugular is superficial and drains the superficial tissues.</p>"},{"h":"Precision Facts · معلومات دقيقة","lvl":"surface","html":"<ol class=\"facts\"><li>The internal jugular vein is the main vein draining the head and neck.</li><li>All lymph of the head and neck ultimately reaches the deep cervical nodes.</li><li>The external jugular vein is superficial on the side of the neck.</li></ol>"}],"scenarios":[],"quiz":[],"flashcards":[{"q":"Main vein of the head & neck?","a":"Internal jugular vein"},{"q":"Final common lymph pathway?","a":"Deep cervical nodes (along the IJV)"},{"q":"Retromandibular vein is formed by?","a":"Superficial temporal + maxillary veins"}],"pearls":["Internal jugular = main drainage; all lymph ends in the deep cervical chain.","Tongue TIP → submental; tongue body → submandibular/jugulo-omohyoid."],"mistakes":["<b>Myth:</b> The external jugular is the main vein of the head and neck. <b style=\"color:var(--green)\">Truth:</b> The INTERNAL jugular is the main (deep) drainage; the external jugular is superficial.","<b>Myth:</b> The facial vein has valves that block backward spread. <b style=\"color:var(--green)\">Truth:</b> It is valveless, allowing infection to reach the cavernous sinus."]},"an_nose-sinuses":{"hasLevels":true,"ar":"الأنف والجيوب الأنفية","blurb":"The air-conditioning passage of the airway, the four paired sinuses that drain into it, and the artery responsible for most nosebleeds.","study":[{"h":"Enumerations · المسميات والأعداد","lvl":"surface","html":"<h4>Two jobs of the nose</h4><ul><li>Smell (olfaction)</li><li>Conditioning inspired air (warm, moisten, filter)</li></ul><h4>The four paired paranasal sinuses</h4><ul><li>Frontal</li><li>Maxillary</li><li>Ethmoidal</li><li>Sphenoidal</li></ul>"},{"h":"Functions · الوظائف","lvl":"surface","html":"<table><tr><th>Structure</th><th>Function</th></tr><tr><td><b>Nasal cavity</b></td><td>Warms, moistens and filters inspired air and houses the sense of smell.</td></tr><tr><td><b>Conchae (turbinates)</b></td><td>Increase the surface area and create turbulence to condition the air.</td></tr><tr><td><b>Paranasal sinuses</b></td><td>Lighten the skull, add resonance to the voice and produce mucus.</td></tr></table>"},{"h":"Comparisons & Differences · الفوارق","lvl":"surface","html":"<p><b>Nasal cavity</b> vs <b>Paranasal sinuses</b>: The nasal cavity is the main air passage; the sinuses are air-filled extensions in the surrounding bones that drain into it.</p>"},{"h":"Precision Facts · معلومات دقيقة","lvl":"surface","html":"<ol class=\"facts\"><li>There are four pairs of paranasal sinuses.</li><li>The nose warms, moistens and filters inspired air.</li><li>The conchae increase the surface area of the nasal cavity.</li></ol>"}],"scenarios":[],"quiz":[],"flashcards":[{"q":"Four paired paranasal sinuses?","a":"Frontal, maxillary, ethmoidal, sphenoidal"},{"q":"Largest sinus?","a":"Maxillary"},{"q":"Nasolacrimal duct drains into?","a":"Inferior meatus"},{"q":"Frontal/maxillary/ant. ethmoidal drain into?","a":"Middle meatus"}],"pearls":["Inferior meatus = tears (nasolacrimal duct); middle meatus = frontal/maxillary/ant. ethmoidal sinuses.","Little's area = anterior septum = common nosebleeds; sphenopalatine = posterior, severe."],"mistakes":["<b>Myth:</b> The maxillary sinus drains easily from its base. <b style=\"color:var(--green)\">Truth:</b> Its opening is HIGH on the medial wall, so it drains against gravity and is prone to sinusitis.","<b>Myth:</b> The nasolacrimal duct drains into the middle meatus. <b style=\"color:var(--green)\">Truth:</b> It drains into the INFERIOR meatus. The middle meatus receives the frontal/maxillary/anterior ethmoidal sinuses."]},"an_mouth-tongue":{"hasLevels":true,"ar":"الفم واللسان والحنك","blurb":"The most exam-tested innervation map in the head: the dual nerve supply of the tongue, the muscle exceptions, and the sensory map of the palate.","study":[{"h":"Enumerations · المسميات والأعداد","lvl":"surface","html":"<h4>Two parts of the palate</h4><ul><li>Hard palate (front, bony)</li><li>Soft palate (back, muscular)</li></ul><h4>Two functional jobs of the tongue</h4><ul><li>Moving food & speech (muscle)</li><li>Taste & sensation (nerves)</li></ul>"},{"h":"Functions · الوظائف","lvl":"surface","html":"<table><tr><th>Structure</th><th>Function</th></tr><tr><td><b>Tongue</b></td><td>Moves food for chewing and swallowing, shapes speech, and carries taste.</td></tr><tr><td><b>Hard palate</b></td><td>A rigid roof against which the tongue presses to crush food and form sounds.</td></tr><tr><td><b>Soft palate</b></td><td>Lifts to seal off the nose during swallowing and speech.</td></tr></table>"},{"h":"Comparisons & Differences · الفوارق","lvl":"surface","html":"<p><b>Hard palate</b> vs <b>Soft palate</b>: The hard palate is bony and fixed; the soft palate is muscular and moves to seal the nose during swallowing.</p>"},{"h":"Precision Facts · معلومات دقيقة","lvl":"surface","html":"<ol class=\"facts\"><li>The palate has a hard (bony) part and a soft (muscular) part.</li><li>The tongue both moves food and senses taste.</li><li>The soft palate rises during swallowing to close off the nose.</li></ol>"}],"scenarios":[],"quiz":[],"flashcards":[{"q":"Anterior 2/3 tongue — general sensation?","a":"Lingual nerve (V3)"},{"q":"Anterior 2/3 tongue — taste?","a":"Chorda tympani (VII)"},{"q":"Posterior 1/3 tongue — sensation AND taste?","a":"Glossopharyngeal nerve (IX)"},{"q":"Motor to all tongue muscles?","a":"Hypoglossal (XII) — except palatoglossus"}],"pearls":["Front of tongue: lingual (V3) = feeling, chorda tympani (VII) = taste. Back: IX = both.","All tongue muscles = XII EXCEPT palatoglossus (vagus)."],"mistakes":["<b>Myth:</b> The lingual nerve carries taste from the front of the tongue. <b style=\"color:var(--green)\">Truth:</b> The lingual nerve carries general SENSATION; taste is carried by the chorda tympani (VII).","<b>Myth:</b> The hypoglossal nerve supplies all tongue muscles. <b style=\"color:var(--green)\">Truth:</b> All EXCEPT palatoglossus (pharyngeal plexus / vagus)."]},"an_salivary":{"hasLevels":true,"ar":"الغدد اللعابية","blurb":"Three pairs of major glands, their ducts and — most importantly for exams — the two different parasympathetic pathways that drive them.","study":[{"h":"Enumerations · المسميات والأعداد","lvl":"surface","html":"<h4>The three major salivary glands</h4><ul><li>Parotid (largest)</li><li>Submandibular</li><li>Sublingual (smallest)</li></ul><h4>What saliva does</h4><ul><li>Moistens food & begins digestion</li><li>Protects and cleanses the mouth</li></ul>"},{"h":"Functions · الوظائف","lvl":"surface","html":"<table><tr><th>Structure</th><th>Function</th></tr><tr><td><b>Parotid gland</b></td><td>Produces watery (serous) saliva delivered near the upper molars.</td></tr><tr><td><b>Submandibular gland</b></td><td>Produces mixed saliva and contributes the most resting saliva.</td></tr><tr><td><b>Sublingual gland</b></td><td>Produces mainly mucous saliva into the floor of the mouth.</td></tr></table>"},{"h":"Comparisons & Differences · الفوارق","lvl":"surface","html":"<p><b>Parotid gland</b> vs <b>Submandibular gland</b>: The parotid is the largest and lies in front of the ear; the submandibular lies under the jaw and produces most of the resting saliva.</p>"},{"h":"Precision Facts · معلومات دقيقة","lvl":"surface","html":"<ol class=\"facts\"><li>There are three pairs of major salivary glands.</li><li>The parotid is the largest salivary gland.</li><li>Saliva moistens food and protects the mouth.</li></ol>"}],"scenarios":[],"quiz":[],"flashcards":[{"q":"Three major salivary glands?","a":"Parotid, submandibular, sublingual"},{"q":"Parotid duct opens where?","a":"Opposite the upper 2nd molar"},{"q":"Submandibular duct opens where?","a":"Floor of mouth, beside the frenulum"}],"pearls":["Parotid = IX (otic ganglion). Submandibular/sublingual = VII (chorda tympani, submandibular ganglion).","Facial nerve runs THROUGH the parotid (key in surgery) but does not supply it."],"mistakes":["<b>Myth:</b> The parotid gland is supplied by the facial nerve's parasympathetic fibres. <b style=\"color:var(--green)\">Truth:</b> The parotid's parasympathetic supply is from the GLOSSOPHARYNGEAL nerve (IX) via the otic ganglion. The facial nerve only passes through it.","<b>Myth:</b> Stones are most common in the parotid gland. <b style=\"color:var(--green)\">Truth:</b> They are most common in the SUBMANDIBULAR gland (uphill duct, mucous saliva)."]},"an_pharynx":{"hasLevels":true,"ar":"البلعوم","blurb":"The muscular tube shared by the airway and the food way — its three parts, its constrictor muscles, and the single nerve plexus that drives swallowing.","study":[{"h":"Enumerations · المسميات والأعداد","lvl":"surface","html":"<h4>The three parts of the pharynx (top → bottom)</h4><ul><li>Nasopharynx (behind the nose)</li><li>Oropharynx (behind the mouth)</li><li>Laryngopharynx (behind the larynx)</li></ul><h4>Two crossing pathw
