rdest).","Graft properties 'OII': Osteogenesis (autograft only), Osteoinduction (BMP), Osteoconduction (scaffold)."]},"tumors":{"study":[{"h":"1. Odontogenic Tumors Overview","html":"\n   <p>Classified by tissue origin: <b>epithelial</b>, <b>mesenchymal</b>, or <b>mixed</b>.</p>\n   <table><tr><th>Origin</th><th>Examples</th></tr>\n   <tr><td>Epithelial</td><td>Ameloblastoma, CEOT (Pindborg), AOT</td></tr>\n   <tr><td>Mixed</td><td>Odontoma, ameloblastic fibroma</td></tr>\n   <tr><td>Mesenchymal</td><td>Odontogenic myxoma, cementoblastoma</td></tr></table>"},{"h":"2. Ameloblastoma (key tumor)","html":"\n   <p>Most common clinically significant odontogenic tumor; <b>benign but locally aggressive</b>, mandible (molar/ramus) most common.</p>\n   <ul><li>Radiograph: <b>multilocular \"soap-bubble / honeycomb\"</b> radiolucency, root resorption, cortical expansion.</li>\n   <li>Types: solid/multicystic (aggressive), unicystic, peripheral.</li>\n   <li>Tx: <b>resection with margin</b> (1–1.5 cm) — high recurrence with curettage.</li></ul>\n   <div class=\"hy\"><b>⭐:</b> Most common <b>odontoma</b> = most common odontogenic tumor overall (a hamartoma); ameloblastoma = most common true neoplasm.</div>"},{"h":"3. Other Notable Tumors","html":"\n   <ul><li><b>AOT</b> (\"two-thirds tumor\"): anterior maxilla, young females, around impacted canine, snowflake calcifications.</li>\n   <li><b>CEOT (Pindborg)</b>: \"driven snow\"; contains amyloid + Liesegang calcifications.</li>\n   <li><b>Odontogenic myxoma</b>: \"tennis-racket/step-ladder\" trabeculation.</li>\n   <li><b>Osteosarcoma</b>: \"sunburst\", symmetrical {{PDL|الرباط حول السني}} widening (Garrington sign).</li></ul>"},{"h":"4. Fibro-osseous & Giant Cell Lesions","html":"\n   <ul><li><b>Fibrous dysplasia</b>: \"ground-glass\", ill-defined, McCune-Albright.</li>\n   <li><b>Ossifying fibroma</b>: well-defined, encapsulated.</li>\n   <li><b>Central giant cell granuloma</b>: anterior mandible, crosses midline.</li>\n   <li><b>Cherubism</b>: bilateral, childhood, familial.</li></ul>"},{"h":"5. Ameloblastoma — full detail","html":"\n  <p><b>Most common clinically significant true odontogenic neoplasm.</b> Benign but <b>locally aggressive</b>, infiltrates marrow spaces. Peak 3rd–5th decade; ~80% in the mandible (molar–ramus).</p>\n  <h4>Clinical types</h4>\n  <ul><li><b>Conventional solid/multicystic</b> — most common, most aggressive, high recurrence.</li>\n  <li><b>Unicystic</b> — younger patients, often around an impacted 3rd molar; subtypes <i>luminal, intraluminal, mural</i>; <b>mural</b> type behaves more aggressively. Best prognosis overall.</li>\n  <li><b>Peripheral (extraosseous)</b> — gingival soft tissue; least aggressive.</li>\n  <li><b>Desmoplastic</b> — often anterior maxilla, mixed radiolucent/radiopaque.</li></ul>\n  <h4>Histologic patterns</h4>\n  <p>Follicular (commonest) & plexiform; also acanthomatous, granular cell, basal cell, desmoplastic. Hallmark: peripheral <b>columnar cells with reversed polarity (Vickers–Gorlin)</b> + central stellate-reticulum-like loose cells.</p>\n  <h4>Radiology & treatment</h4>\n  <ul><li>Multilocular <b>\"soap-bubble / honeycomb\"</b> radiolucency, buccolingual expansion, root resorption, tooth displacement.</li>\n  <li>Solid type: <b>resection with 1–1.5 cm bony margin</b>. Unicystic (luminal/intraluminal): enucleation ± adjunct. Curettage → high recurrence.</li>\n  <li>Malignant variants: <b>ameloblastic carcinoma</b> (malignant histology) and <b>metastasizing ameloblastoma</b> (benign histology, distant spread — usually lung).</li></ul>\n  <div class=\"hy\"><b>⭐:</b> Recurrence after curettage is high; reversed nuclear polarity is the key histologic clue.</div>"},{"h":"6. Adenomatoid Odontogenic Tumor (AOT)","html":"\n  <p>The <b>\"two-thirds tumor\"</b>: ~2/3 in <b>maxilla</b>, ~2/3 in <b>anterior</b> region, ~2/3 in <b>young females</b> (10–19 y), ~2/3 associated with an <b>unerupted tooth</b> (often canine).</p>\n  <ul><li>Variants: follicular (around impacted crown — mimics dentigerous), extrafollicular, peripheral.</li>\n  <li>Radiology: well-defined radiolucency that may contain faint <b>\"snowflake\" calcifications</b>; can extend apical to the CEJ (helps distinguish from dentigerous cyst).</li>\n  <li>Histology: <b>duct-like/rosette structures</b> of columnar cells, whorls, calcified foci.</li>\n  <li>Behavior: <b>benign, encapsulated</b>; simple <b>enucleation</b> is curative; recurrence rare.</li></ul>"},{"h":"7. Calcifying Epithelial Odontogenic Tumor (Pindborg / CEOT)","html":"\n  <p>Uncommon; usually <b>posterior mandible</b>, often around an impacted tooth.</p>\n  <ul><li>Histology: sheets of polyhedral epithelial cells, nuclear pleomorphism, <b>amyloid</b> deposits with concentric <b>Liesegang ring</b> calcifications (Congo-red positive, apple-green birefringence).</li>\n  <li>Radiology: mixed radiolucent–radiopaque, <b>\"driven snow\"</b> appearance.</li>\n  <li>Behavior: locally invasive but less aggressive than ameloblastoma; treat by local excision with margin.</li></ul>"},{"h":"8. Odontogenic Myxoma","html":"\n  <ul><li>Benign tumor of <b>odontogenic ectomesenchyme</b>; 2nd–3rd decade; mandible common.</li>\n  <li>Radiology: multilocular radiolucency with <b>fine \"tennis-racket / step-ladder / honeycomb\"</b> trabeculae; scalloping between roots.</li>\n  <li>Histology: loose <b>myxoid</b> stroma, scattered stellate cells, little collagen.</li>\n  <li>Behavior: <b>locally aggressive, infiltrative, no capsule → recurs</b>; needs excision with margin.</li></ul>"}],"flashcards":[{"q":"Most common odontogenic tumor overall?","a":"Odontoma (hamartoma)."},{"q":"Most common true odontogenic neoplasm?","a":"Ameloblastoma."},{"q":"Classic ameloblastoma radiograph?","a":"Multilocular soap-bubble/honeycomb radiolucency."},{"q":"Ameloblastoma behavior?","a":"Benign but locally aggressive; high recurrence."},{"q":"Ameloblastoma treatment?","a":"Resection with 1–1.5 cm margin."}],"quiz":[{"q":"Most common odontogenic tumor overall:","o":["Ameloblastoma","Odontoma","Myxoma","AOT"],"c":1,"e":"Odontoma (a hamartoma)."},{"q":"Most common true odontogenic neoplasm:","o":["Odontoma","Ameloblastoma","Cementoblastoma","AOT"],"c":1,"e":"Ameloblastoma."},{"q":"Classic radiograph of ameloblastoma:","o":["Ground-glass","Multilocular soap-bubble","Sunburst","Cotton-wool"],"c":1,"e":"Soap-bubble/honeycomb."},{"q":"Ameloblastoma is best described as:","o":["Malignant","Benign but locally aggressive","Hamartoma","Inflammatory"],"c":1,"e":"Locally aggressive, high recurrence."},{"q":"Treatment of solid ameloblastoma:","o":["Curettage","Resection with margin","Radiotherapy","Observation"],"c":1,"e":"Resection with 1–1.5 cm margin."},{"q":"AOT is most common in:","o":["Posterior mandible/elderly","Anterior maxilla/young females","Ramus/males","Palate/children"],"c":1,"e":"Anterior maxilla, young females."},{"q":"'Driven snow' calcification suggests:","o":["AOT","CEOT (Pindborg)","Odontoma","Myxoma"],"c":1,"e":"Pindborg tumor."},{"q":"'Tennis-racket' trabeculation is seen in:","o":["Ameloblastoma","Odontogenic myxoma","Fibrous dysplasia","CGCG"],"c":1,"e":"Odontogenic myxoma."},{"q":"'Sunburst' appearance suggests:","o":["Fibrous dysplasia","Osteosarcoma","Odontoma","AOT"],"c":1,"e":"Osteosarcoma."},{"q":"'Ground-glass' appearance is typical of:","o":["Ossifying fibroma","Fibrous dysplasia","Ameloblastoma","CGCG"],"c":1,"e":"Fibrous dysplasia."},{"q":"Bilateral familial jaw swelling in a child:","o":["Cherubism","Paget's","CGCG","Myxoma"],"c":0,"e":"Cherubism."},{"q":"Symmetrical widening of the PDL space (Garrington sign):","o":["Ameloblastoma","Osteosarcoma","Odontoma","AOT"],"c":1,"e":"Early osteosarcoma."},{"q":"Cementoblastoma is attached to:","o":["Crown","Tooth root (radiopaque mass)","Sinus","Condyle"],"c":1,"e":"Fused to root, radiopaque with halo."},{"q":"Central giant cell granuloma commonly occurs in the:","o":["Posterior maxilla","Anterior mandible crossing midline","Condyle","Sinus"],"c":1,"e":"Anterior mandible."},{"q":"Odontoma composed of enamel/dentin in tooth-like forms is:","o":["Complex","Compound","Cementoma","Myxoma"],"c":1,"e":"Compound odontoma = multiple denticles; complex = disorganized mass."},{"q":"Odontogenic tumors are classified by their:","o":["Size","Tissue of origin (epithelial/mesenchymal/mixed)","Location only","Age only"],"c":1,"e":"Origin: epithelial, mesenchymal, or mixed."},{"q":"The most common SOLID/multicystic ameloblastoma site is the:","o":["Anterior maxilla","Posterior mandible (molar-ramus)","Hard palate","Condyle"],"c":1,"e":"Mandibular molar/ramus region."},{"q":"Histologic hallmark of follicular ameloblastoma:","o":["Ghost cells","Reverse polarity of basal cells (Vickers-Gorlin)","Amyloid","Psammoma bodies"],"c":1,"e":"Palisaded columnar cells with reversed polarity & stellate reticulum-like center."},{"q":"Unicystic ameloblastoma is important because it:","o":["Always malignant","Has a better prognosis/lower recurrence than solid type","Never recurs","Occurs in maxilla only"],"c":1,"e":"Less aggressive than solid/multicystic."},{"q":"Calcifying epithelial odontogenic tumor (Pindborg) contains:","o":["Ghost cells","Amyloid + Liesegang ring calcifications","Reversed polarity only","Cartilage"],"c":1,"e":"Amyloid with concentric calcifications; 'driven snow'."},{"q":"The adenomatoid odontogenic tumor is known as the:","o":["Two-thirds tumor","Master tumor","Ghost tumor","Soap-bubble tumor"],"c":0,"e":"2/3: maxilla, anterior, females, canine, around a tooth."},{"q":"Duct-like structures lined by columnar cells are seen in:","o":["Ameloblastoma","AOT","CEOT","Myxoma"],"c":1,"e":"Adenomatoid odontogenic tumor."},{"q":"The odontogenic tumor with 'tennis-racket/step-ladder' trabeculae:","o":["Odontoma","Odontogenic myxoma","AOT","CEOT"],"c":1,"e":"Odontogenic myxoma."},{"q":"A radiopaque mass fused to a tooth root with a radiolucent halo:","o":["Cementoblastoma","Ameloblastoma","Myxoma","AOT"],"c":0,"e":"Benign cementoblastoma."},{"q":"A compound odontoma is composed of:","o":["Disorganized enamel/dentin mass","Multiple small tooth-like denticles","Only cementum","Cartilage"],"c":1,"e":"Compound = denticles; complex = disorganized mass."},{"q":"Ghost cells are characteristic of:","o":["Ameloblastoma","Calcifying odontogenic cyst (Gorlin)","Myxoma","AOT"],"c":1,"e":"Calcifying odontogenic cyst / dentinogenic ghost cell tumor."},{"q":"Ameloblastic fibroma typically occurs in:","o":["Elderly","Young patients (mixed tumor)","Newborns only","Edentulous"],"c":1,"e":"Young patients; epithelium + mesenchyme, no hard tissue."},{"q":"The treatment of solid/multicystic ameloblastoma is:","o":["Enucleation only","Resection with 1–1.5 cm margin","Radiotherapy","Observation"],"c":1,"e":"Marginal/segmental resection; curettage recurs."},{"q":"'Sunburst/sunray' periosteal reaction suggests:","o":["Ameloblastoma","Osteosarcoma","Odontoma","Fibrous dysplasia"],"c":1,"e":"Osteosarcoma."},{"q":"Osteoblastoma differs from osteoid osteoma mainly by being:","o":["Smaller than 1 cm","Larger (>2 cm) with less aspirin-responsive pain","Always malignant","Found only in the skull"],"c":1,"e":"Osteoblastoma is larger (>2 cm); osteoid osteoma is <2 cm with classic night pain relieved by NSAIDs."},{"q":"'Ground-glass' radiopacity with ill-defined borders is typical of:","o":["Ossifying fibroma","Fibrous dysplasia","CGCG","Ameloblastoma"],"c":1,"e":"Fibrous dysplasia."},{"q":"A well-circumscribed, encapsulated fibro-osseous lesion is:","o":["Fibrous dysplasia","Ossifying fibroma","Paget's","Osteosarcoma"],"c":1,"e":"Ossifying fibroma (well-defined)."},{"q":"McCune-Albright syndrome includes:","o":["Multiple OKCs","Polyostotic fibrous dysplasia + café-au-lait + endocrinopathy","Bilateral jaw swelling in children","Hypercementosis"],"c":1,"e":"Polyostotic FD triad."},{"q":"Bilateral, symmetric, familial jaw expansion in a child:","o":["Cherubism","Paget's","CGCG","Osteosarcoma"],"c":0,"e":"Cherubism (autosomal dominant)."},{"q":"Central giant cell granuloma most commonly occurs in the:","o":["Posterior maxilla","Anterior mandible (crossing midline)","Condyle","Sinus"],"c":1,"e":"Anterior mandible."},{"q":"Giant cells in CGCG are:","o":["Osteoclast-like multinucleated cells","Plasma cells","Lymphocytes","Ghost cells"],"c":0,"e":"Multinucleated osteoclast-like giant cells in vascular stroma."},{"q":"A brown tumor of hyperparathyroidism is histologically identical to:","o":["Ameloblastoma","Central giant cell granuloma","Odontoma","Myxoma"],"c":1,"e":"Must exclude hyperparathyroidism (check serum Ca, PTH)."},{"q":"'Cotton-wool' appearance of bone is typical of:","o":["Fibrous dysplasia","Paget's disease (late)","Osteosarcoma","CGCG"],"c":1,"e":"Paget's disease of bone."},{"q":"In Paget's disease, a classic biochemical finding is raised:","o":["Serum calcium","Alkaline phosphatase","PTH","Phosphate"],"c":1,"e":"Markedly elevated ALP."},{"q":"The most common SOURCE of metastasis to the jaws:","o":["Skin","Breast/lung/prostate/kidney/thyroid","Brain","Liver"],"c":1,"e":"Breast (F), lung/prostate (M) most common."},{"q":"Metastasis to the jaw most commonly affects the:","o":["Maxilla anterior","Posterior mandible (molar/ramus)","Condyle","Palate"],"c":1,"e":"Posterior mandible (hematopoietic marrow)."},{"q":"A 'numb chin' (mental nerve anesthesia) with no dental cause suggests:","o":["Caries","Malignancy/metastasis in the mandible","Fluorosis","Attrition"],"c":1,"e":"Mental nerve neuropathy is a red flag for malignancy."},{"q":"The most common benign tumor of bone is:","o":["Osteoma","Osteosarcoma","Chondroma","Myxoma"],"c":0,"e":"Osteoma (e.g., torus, Gardner syndrome)."},{"q":"Multiple osteomas + intestinal polyps + supernumerary teeth =:","o":["Gardner syndrome","Gorlin syndrome","McCune-Albright","Cherubism"],"c":0,"e":"Gardner syndrome (FAP variant)."},{"q":"The most common malignant bone tumor of the jaws:","o":["Chondrosarcoma","Osteosarcoma","Ewing sarcoma","Myeloma"],"c":1,"e":"Osteosarcoma."},{"q":"Burkitt lymphoma in the African form classically affects the:","o":["Long bones","Jaws/facial bones of children","Spine","Skull base"],"c":1,"e":"Jaw involvement; EBV-associated."},{"q":"Multiple myeloma classically shows:","o":["Sunburst","Punched-out radiolucencies + Bence-Jones protein","Ground-glass","Cotton-wool"],"c":1,"e":"Punched-out lesions; monoclonal gammopathy."},{"q":"The peripheral counterpart of CGCG presenting as a gingival mass is:","o":["Pyogenic granuloma","Peripheral giant cell granuloma","Fibroma","Papilloma"],"c":1,"e":"Peripheral giant cell granuloma (gingiva/alveolus)."},{"q":"A rapidly growing pregnancy-associated vascular gingival lesion is:","o":["Pyogenic granuloma (granuloma gravidarum)","PGCG","Fibroma","Cyst"],"c":0,"e":"Pyogenic granuloma."},{"q":"Squamous odontogenic tumor arises from:","o":["Rests of Malassez","Dental lamina rests","Reduced enamel epithelium","Stratum intermedium"],"c":0,"e":"Benign, from rests of Malassez."},{"q":"The odontogenic keratocyst is now often classified as a:","o":["Cyst only","Keratocystic odontogenic tumor (neoplastic behavior)","Ameloblastoma","Myxoma"],"c":1,"e":"Aggressive, dental lamina origin, high recurrence."},{"q":"Nevoid basal cell carcinoma (Gorlin) syndrome features:","o":["Single odontoma","Multiple OKCs + BCCs + rib anomalies + falx calcification","Cherubism","Brown tumors"],"c":1,"e":"Multiple keratocysts among other features."},{"q":"Chondrosarcoma of the jaws most commonly involves the:","o":["Anterior mandible","Anterior maxilla/condyle (cartilage-forming sites)","Ramus","Symphysis"],"c":1,"e":"Cartilaginous regions."},{"q":"The most reliable way to confirm a jaw tumor diagnosis is:","o":["CT alone","Histopathology (biopsy)","Clinical exam","Blood test"],"c":1,"e":"Biopsy/histopathology."},{"q":"Ameloblastoma arises from all EXCEPT:","o":["Dental lamina rests","Enamel organ","Dentigerous cyst lining","Rests of Malassez (radicular origin)"],"c":3,"e":"Multiple odontogenic epithelial sources; classically not Malassez."},{"q":"Melanotic neuroectodermal tumor of infancy typically presents in the:","o":["Mandible of adults","Anterior maxilla of infants","Condyle","Sinus"],"c":1,"e":"Pigmented lesion of the anterior maxilla in infants; neural crest origin."},{"q":"Osteoid osteoma classically causes pain that is relieved by:","o":["Heat","NSAIDs/aspirin","Rest","Cold"],"c":1,"e":"Night pain relieved by aspirin; central nidus."},{"q":"Juvenile ossifying fibroma is notable for being:","o":["Slow & indolent","Aggressive with higher recurrence in young patients","Always malignant","Non-surgical"],"c":1,"e":"More aggressive than conventional ossifying fibroma."},{"q":"Langerhans cell histiocytosis shows on radiograph:","o":["Ground-glass","'Floating teeth' / punched-out lesions","Sunburst","Cotton-wool"],"c":1,"e":"Alveolar bone loss giving 'teeth floating in air'."},{"q":"A solitary, slowly enlarging painless mandibular swelling with multilocular 'soap-bubble' radiolucency in a 30-year-old is most likely:","o":["Radicular cyst","Ameloblastoma","Osteosarcoma","Periapical abscess"],"c":1,"e":"Classic ameloblastoma presentation."},{"q":"A 12-year-old has a painless anterior maxillary swelling; radiograph shows a unilocular radiolucency around an unerupted canine with faint 'snowflake' calcifications. Diagnosis:","o":["Dentigerous cyst","Adenomatoid odontogenic tumor","Ameloblastoma","CEOT"],"c":1,"e":"AOT — young, anterior maxilla, around impacted canine."},{"q":"Which odontogenic tumor most often surrounds the crown of an impacted tooth (mimics dentigerous cyst)?","o":["Odontogenic myxoma","AOT","Cementoblastoma","Squamous odontogenic tumor"],"c":1,"e":"AOT often pericoronal."},{"q":"The radiograph shows a mixed radiolucent-radiopaque lesion with a thin radiolucent rim and tooth-like densities in a teenager; diagnosis:","o":["Complex odontoma","Compound odontoma","Ameloblastoma","Fibrous dysplasia"],"c":1,"e":"Compound odontoma (multiple denticles)."}],"pearls":["The single most dangerous mistake in jaw pathology is biopsying or extracting into a central vascular lesion — image first if a lesion pulsates, has a bruit, or a tooth 'pumps'.","Ameloblastoma is benign but locally aggressive: it must be resected with a margin, because curettage recurs.","The OKC behaves like a neoplasm — high recurrence, grows along bone with little expansion; multiple OKCs mean Gorlin syndrome until proven otherwise.","Always correlate the radiograph with the clinical picture and age — 'soap-bubble' in a 30-year-old mandible is ameloblastoma; 'ground-glass' blending into bone in a teenager is fibrous dysplasia."],"mistakes":["Biopsying/extracting into a central haemangioma or AVM → catastrophic, sometimes fatal haemorrhage.","Treating an ameloblastoma or OKC by simple curettage → high recurrence.","Irradiating fibrous dysplasia → risk of sarcomatous transformation.","Forgetting to check Ca/PO4/PTH in a giant-cell lesion and missing hyperparathyroidism.","Dismissing a numb chin as 'nothing' instead of investigating for malignancy/metastasis.","Calling every multilocular radiolucency an ameloblastoma without histology (DDx: myxoma, CGCG, OKC).","Confusing fibrous dysplasia (ill-defined, blends) with ossifying fibroma (well-defined, shells out) and mismanaging.","Assuming a pericoronal radiolucency is always a benign dentigerous cyst."],"facts":["Most common odontogenic tumour overall: odontoma (hamartoma).","Most common true odontogenic neoplasm: ameloblastoma.","Ameloblastoma types: solid/multicystic (aggressive), unicystic (best prognosis), peripheral (least aggressive), desmoplastic.","Ameloblastoma histology: reversed nuclear polarity (Vickers-Gorlin) + stellate reticulum-like centre.","Malignant ameloblastoma: ameloblastic carcinoma (malignant histology) vs metastasising ameloblastoma (benign histology).","AOT '2/3 tumour': maxilla, anterior, young females, around a tooth; duct-like cells, snowflake calcification.","CEOT (Pindborg): amyloid + Liesegang calcifications, 'driven snow'.","Odontogenic myxoma: 'tennis-racket/step-ladder' trabeculae; locally aggressive, recurs.","Odontoma: compound (denticles, anterior maxilla) vs complex (mass, posterior mandible).","Cementoblastoma: radiopaque mass fused to a root with radiolucent halo (vital tooth).","Ghost cells: calcifying odontogenic cyst (Gorlin).","OKC/KCOT: dental lamina origin, highest recurrence; multiple → Gorlin (NBCC) syndrome.","Fibrous dysplasia: 'ground-glass', ill-defined, blends into bone; GNAS mutation; avoid radiotherapy.","Ossifying fibroma: well-defined/encapsulated, shells out; juvenile type aggressive.","Paget's: 'cotton-wool' bone, raised ALP, hypercementosis; osteosarcoma risk.","Giant cell lesions: CGCG (anterior mandible, crosses midline), PGCG (gingival), brown tumour (hyperPTH), cherubism (bilateral, familial).","Osteosarcoma: 'sunburst', Garrington sign (symmetric PDL widening); wide resection.","Other malignant clues: Ewing 'onion-skin', Burkitt (jaw/EBV), myeloma 'punched-out' + Bence-Jones, Langerhans 'floating teeth'."],"mnemonics":["Radiographic signs: Soap-bubble=ameloblastoma/myxoma/CGCG · Driven-snow=CEOT · Snowflake=AOT · Ground-glass=FD · Cotton-wool=Paget · Sunburst=osteosarcoma · Onion-skin=Ewing · Punched-out=myeloma · Floating teeth=Langerhans.","AOT '2/3 rule': 2/3 maxilla, anterior, young Females, around a tooth.","Syndromes: Gardner=Osteomas+Polyps; Gorlin=OKCs+BCCs; McCune-Albright=FD+café-au-lait+Endocrine; Cherubism=bilateral familial."]},"anatomy":{"study":[{"h":"1. Trigeminal Nerve (CN V)","html":"\n   <p>Three divisions: <b>V1 ophthalmic</b> (superior orbital fissure), <b>V2 maxillary</b> (foramen rotundum), <b>V3 mandibular</b> (foramen ovale). V3 is the only division carrying <b>motor</b> fibers (muscles of mastication).</p>\n   <div class=\"hy\"><b>⭐ Foramina:</b> rotundum→V2, ovale→V3, spinosum→middle meningeal artery, jugular→IX/X/XI, stylomastoid→facial nerve.</div>"},{"h":"2. Facial Nerve (CN VII)","html":"\n   <p>Exits skull via <b>stylomastoid foramen</b>; passes through the {{parotid gland|الغدة النكفية}} dividing into 5 branches: <b>temporal, zygomatic, buccal, marginal mandibular, cervical</b> (\"To Zanzibar By Motor Car\").</p>\n   <p>Supplies muscles of facial expression; also taste (anterior 2/3 tongue via chorda tympani).</p>"},{"h":"3. Arterial Supply","html":"\n   <p><b>External carotid</b> branches (mnemonic \"Some Anatomists Like Freaking Out Poor Medical Students\"): Superior thyroid, Ascending pharyngeal, Lingual, Facial, Occipital, Posterior auricular, Maxillary, Superficial temporal.</p>\n   <ul><li><b>Maxillary artery</b> supplies the deep face; the <b>middle meningeal</b> (via foramen spinosum) causes <b>extradural hemorrhage</b>.</li>\n   <li><b>Ascending pharyngeal</b> = only medial branch of ECA.</li></ul>"}],"flashcards":[{"q":"V2 exits via which foramen?","a":"Foramen rotundum."},{"q":"V3 exits via which foramen?","a":"Foramen ovale."},{"q":"Which trigeminal division is motor?","a":"V3 (mandibular)."},{"q":"Facial nerve exits skull via?","a":"Stylomastoid foramen."},{"q":"Five branches of facial nerve?","a":"Temporal, Zygomatic, Buccal, Marginal mandibular, Cervical."}],"quiz":[{"q":"The maxillary nerve (V2) exits the skull through:","o":["Foramen ovale","Foramen rotundum","Foramen spinosum","Jugular foramen"],"c":1,"e":"Foramen rotundum."},{"q":"The only trigeminal division carrying motor fibers:","o":["V1","V2","V3","None"],"c":2,"e":"V3 supplies muscles of mastication."},{"q":"The facial nerve exits the skull via:","o":["Foramen ovale","Stylomastoid foramen","Jugular foramen","Rotundum"],"c":1,"e":"Stylomastoid foramen."},{"q":"Artery most involved in extradural (epidural) hemorrhage:","o":["Facial","Middle meningeal","Lingual","Maxillary trunk"],"c":1,"e":"Middle meningeal via foramen spinosum."},{"q":"The only medial branch of the external carotid:","o":["Lingual","Facial","Ascending pharyngeal","Occipital"],"c":2,"e":"Ascending pharyngeal."},{"q":"Muscle responsible for protrusion of the mandible:","o":["Masseter","Temporalis","Lateral pterygoid","Medial pterygoid"],"c":2,"e":"Lateral pterygoid."},{"q":"Foramen spinosum transmits the:","o":["Mandibular nerve","Middle meningeal artery","Maxillary nerve","Facial nerve"],"c":1,"e":"Middle meningeal artery."},{"q":"Taste from the anterior two-thirds of the tongue travels via:","o":["Glossopharyngeal","Chorda tympani (VII)","Lingual nerve sensory","Vagus"],"c":1,"e":"Chorda tympani of CN VII."},{"q":"Parotid (Stensen's) duct opens opposite:","o":["Lower 1st molar","Upper 2nd molar","Lower incisors","Upper canine"],"c":1,"e":"Opposite the maxillary 2nd molar."},{"q":"Submandibular gland duct is called:","o":["Stensen's","Wharton's","Bartholin's","Rivinus"],"c":1,"e":"Wharton's duct."},{"q":"Which is NOT a muscle of mastication:","o":["Masseter","Temporalis","Buccinator","Medial pterygoid"],"c":2,"e":"Buccinator is facial expression (CN VII)."},{"q":"The jugular foramen transmits cranial nerves:","o":["III, IV, VI","IX, X, XI","V, VII","II only"],"c":1,"e":"Glossopharyngeal, vagus, accessory."},{"q":"Sensory supply to buccal gingiva of maxillary premolars:","o":["Greater palatine","Posterior superior alveolar / middle superior alveolar","Nasopalatine","Mental"],"c":1,"e":"Superior alveolar nerves (buccal)."},{"q":"The TMJ is classified as a:","o":["Simple hinge","Ginglymoarthrodial joint","Ball-and-socket","Pivot"],"c":1,"e":"Hinge + gliding (ginglymoarthrodial)."},{"q":"The posterior triangle of the neck is bounded anteriorly by:","o":["Trapezius","Sternocleidomastoid","Digastric","Omohyoid"],"c":1,"e":"SCM anterior, trapezius posterior."},{"q":"The foramen ovale transmits the:","o":["Maxillary nerve","Mandibular nerve","Middle meningeal artery","Facial nerve"],"c":1,"e":"V3 (+ accessory meningeal a.)."},{"q":"Which structures pass through the superior orbital fissure?","o":["CN II only","CN III, IV, V1, VI","CN V2","CN VII, VIII"],"c":1,"e":"Oculomotor, trochlear, ophthalmic, abducens + ophthalmic veins."},{"q":"The internal carotid artery in the neck gives:","o":["Many branches","No branches","Only the lingual","Only the facial"],"c":1,"e":"ICA has no cervical branches."},{"q":"The terminal branches of the external carotid are:","o":["Lingual & facial","Maxillary & superficial temporal","Occipital & facial","Superior thyroid & lingual"],"c":1,"e":"Maxillary + superficial temporal."},{"q":"The middle meningeal artery is a branch of the:","o":["Facial artery","Maxillary artery","Lingual artery","Superficial temporal"],"c":1,"e":"First (mandibular) part of maxillary artery."},{"q":"Parotid gland secretomotor fibers are relayed in the:","o":["Submandibular ganglion","Otic ganglion","Pterygopalatine ganglion","Ciliary ganglion"],"c":1,"e":"IX to otic ganglion to auriculotemporal."},{"q":"Submandibular gland secretomotor fibers come from:","o":["IX","VII (chorda tympani)","V3","X"],"c":1,"e":"VII via chorda tympani to submandibular ganglion."},{"q":"All tongue muscles are supplied by CN XII EXCEPT:","o":["Genioglossus","Hyoglossus","Palatoglossus","Styloglossus"],"c":2,"e":"Palatoglossus = vagus."},{"q":"General sensation of the anterior two-thirds of the tongue is via the:","o":["Glossopharyngeal","Lingual nerve (V3)","Chorda tympani","Hypoglossal"],"c":1,"e":"Lingual nerve; taste via chorda tympani."},{"q":"Taste AND general sensation of the posterior third of the tongue:","o":["Lingual nerve","Glossopharyngeal (IX)","Facial","Vagus"],"c":1,"e":"CN IX."},{"q":"The carotid sheath does NOT contain the:","o":["Common carotid","Internal jugular vein","Vagus nerve","Hypoglossal nerve"],"c":3,"e":"Contains carotid, IJV, vagus."}],"pearls":["Local anaesthetic failures and surgical injuries are best understood as anatomy: know the foramen, the nerve, and its relations before you inject or cut.","The IAN enters the mandibular foramen guarded by the lingula — the landmark for the inferior alveolar nerve block.","The lingual nerve lies close to the lingual plate at the third molar and loops UNDER Wharton's duct — both are at risk in that region.","Transient facial palsy after an IAN block means the solution reached the facial nerve within the parotid — reassure; it recovers as the LA wears off."],"mistakes":["Confusing the sensory (lingual, V3) and taste (chorda tympani, VII) supply of the anterior tongue.","Forgetting that the facial nerve, not a vessel, is the structure most at risk in parotid surgery.","Mixing up the foramina: rotundum (V2) vs ovale (V3) vs spinosum (middle meningeal artery).","Assuming the maxillary sinus drains low — its ostium is high on the medial wall (into the middle meatus).","Forgetting the lingual nerve's superficial position at the lower third molar when raising a lingual flap.","Confusing the foramina: rotundum (V2) vs ovale (V3) vs spinosum (middle meningeal artery).","Mixing the sensory (lingual, V3) and taste (chorda tympani, VII) supply of the anterior two-thirds of the tongue.","Thinking the internal carotid gives branches in the neck (it gives NONE — distinguishes it from the ECA)."],"facts":["CN V exits: V1 superior orbital fissure, V2 foramen rotundum, V3 foramen ovale.","Only trigeminal division with MOTOR fibers = V3 (muscles of mastication).","Foramen spinosum transmits the middle meningeal artery (extradural hemorrhage).","Foramen ovale transmits V3 (+ accessory meningeal artery, lesser petrosal nerve).","Superior orbital fissure: CN III, IV, V1, VI + ophthalmic veins.","Jugular foramen: CN IX, X, XI + internal jugular vein.","Hypoglossal canal: CN XII. Stylomastoid foramen: CN VII (exit).","Internal acoustic meatus: CN VII + VIII.","Facial nerve branches (parotid): Temporal, Zygomatic, Buccal, Marginal mandibular, Cervical.","External carotid has 8 branches; terminals = maxillary + superficial temporal.","Ascending pharyngeal = the only MEDIAL branch of the ECA.","Maxillary artery has 3 parts: mandibular, pterygoid, pterygopalatine.","Middle meningeal artery is a branch of the (1st part of) maxillary artery.","Inferior alveolar artery (to mandibular teeth) arises from the maxillary artery.","Lingual artery branches: suprahyoid, dorsal lingual, sublingual, deep lingual.","Facial artery branches incl: ascending palatine, submental, inferior/superior labial, lateral nasal, angular.","Pterygoid venous plexus communicates with the cavernous sinus (infection spread route).","Danger area of the face drains to the cavernous sinus via ophthalmic/deep facial veins.","Retromandibular vein = superficial temporal + maxillary veins.","Muscles of mastication (V3): masseter, temporalis, medial pterygoid, lateral pterygoid.","Lateral pterygoid: protrudes & depresses mandible; deviates jaw to the OPPOSITE side.","Jaw elevators: masseter, temporalis, medial pterygoid.","Suprahyoid muscles: digastric, stylohyoid, mylohyoid, geniohyoid.","Infrahyoid (strap): sternohyoid, sternothyroid, thyrohyoid, omohyoid.","Tongue motor = hypoglossal (XII), EXCEPT palatoglossus (vagus/pharyngeal plexus).","Genioglossus protrudes; hyoglossus depresses; styloglossus retracts the tongue.","Anterior 2/3 tongue: sensation = lingual nerve (V3); taste = chorda tympani (VII).","Posterior 1/3 tongue: general + taste = glossopharyngeal (IX).","Parotid duct (Stensen's) opens opposite the maxillary 2nd molar.","Submandibular duct = Wharton's; sublingual ducts = Rivinus / Bartholin.","Parotid secretomotor: IX to otic ganglion to auriculotemporal nerve.","Submandibular/sublingual secretomotor: VII via chorda tympani to submandibular ganglion."],"mnemonics":["Foramina: Rotundum→V2, Ovale→V3, Spinosum→Middle meningeal artery.","ECA branches 'Some Anatomists Like Freaking Out Poor Medical Students': Sup.thyroid, Asc.pharyngeal, Lingual, Facial, Occipital, Post.auricular, Maxillary, Sup.temporal.","Facial nerve branches 'Ten Zebras Bit My Comb': Temporal, Zygomatic, Buccal, Marginal mandibular, Cervical."],"diagrams":[{"h":"Trigeminal Nerve (CN V) — branches","cap":"V1/V2 sensory only; V3 = sensory + MOTOR to mastication. Exits: V1 superior orbital fissure, V2 foramen rotundum, V3 foramen ovale.","svg":"<svg viewBox=\"0 0 600 430\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter,Arial\" font-size=\"13\">\n   <rect x=\"16\" y=\"185\" width=\"96\" height=\"46\" rx=\"8\" fill=\"#0d9488\"/><text x=\"64\" y=\"205\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"800\">CN V</text><text x=\"64\" y=\"222\" fill=\"#cffafe\" text-anchor=\"middle\" font-size=\"10\">Trigeminal</text>\n   <line x1=\"112\" y1=\"208\" x2=\"180\" y2=\"60\" stroke=\"#2dd4bf\" stroke-width=\"2\"/><line x1=\"112\" y1=\"208\" x2=\"180\" y2=\"208\" stroke=\"#2dd4bf\" stroke-width=\"2\"/><line x1=\"112\" y1=\"208\" x2=\"180\" y2=\"360\" stroke=\"#2dd4bf\" stroke-width=\"2\"/>\n   <rect x=\"180\" y=\"38\" width=\"170\" height=\"44\" rx=\"8\" fill=\"#141d35\" stroke=\"#2dd4bf\"/><text x=\"265\" y=\"58\" fill=\"#2dd4bf\" text-anchor=\"middle\" font-weight=\"800\">V1 Ophthalmic</text><text x=\"265\" y=\"74\" fill=\"#94a3b8\" text-anchor=\"middle\" font-size=\"10\">Sup. orbital fissure</text>\n   <rect x=\"180\" y=\"186\" width=\"170\" height=\"44\" rx=\"8\" fill=\"#141d35\" stroke=\"#f59e0b\"/><text x=\"265\" y=\"206\" fill=\"#f59e0b\" text-anchor=\"middle\" font-weight=\"800\">V2 Maxillary</text><text x=\"265\" y=\"222\" fill=\"#94a3b8\" text-anchor=\"middle\" font-size=\"10\">Foramen rotundum</text>\n   <rect x=\"180\" y=\"338\" width=\"170\" height=\"44\" rx=\"8\" fill=\"#141d35\" stroke=\"#818cf8\"/><text x=\"265\" y=\"358\" fill=\"#818cf8\" text-anchor=\"middle\" font-weight=\"800\">V3 Mandibular</text><text x=\"265\" y=\"374\" fill=\"#94a3b8\" text-anchor=\"middle\" font-size=\"10\">Foramen ovale (mixed)</text>\n   <g fill=\"#e2e8f0\" font-size=\"12\"><text x=\"362\" y=\"46\">Frontal</text><text x=\"362\" y=\"64\">Lacrimal</text><text x=\"362\" y=\"82\">Nasociliary</text></g>\n   <g fill=\"#e2e8f0\" font-size=\"12\"><text x=\"362\" y=\"178\">Infraorbital</text><text x=\"362\" y=\"196\">Zygomatic</text><text x=\"362\" y=\"214\">PSA / MSA / ASA</text><text x=\"362\" y=\"232\">Greater/Lesser palatine</text><text x=\"362\" y=\"250\">Nasopalatine</text></g>\n   <g fill=\"#e2e8f0\" font-size=\"12\"><text x=\"362\" y=\"326\">Buccal (long buccal)</text><text x=\"362\" y=\"344\">Auriculotemporal</text><text x=\"362\" y=\"362\">Lingual</text><text x=\"362\" y=\"380\">Inferior alveolar to Mental</text><text x=\"362\" y=\"398\" fill=\"#22c55e\">MOTOR: mastication</text></g>\n  </svg>"}]},"odontogenic_infections":{"study":[{"h":"1. Spread & Principles","html":"\n   <p>Odontogenic infections are usually <b>polymicrobial</b> (mixed aerobic + anaerobic; early aerobic streptococci, late anaerobes). Spread follows the path of least resistance, determined by the apex position relative to muscle attachments.</p>\n   <div class=\"hy\"><b>⭐ Principles:</b> remove the cause (drain/extract/endo), establish drainage, support with antibiotics. Pus = incise & drain. {{Penicillin|بنسلين}} remains first-line for most odontogenic infections.</div>"},{"h":"2. Fascial Spaces","html":"\n   <ul><li><b>Canine space</b>: from maxillary canine → angular cheilitis/periorbital swelling.</li>\n   <li><b>Buccal, submandibular, sublingual, submental</b>: from molars/anteriors.</li>\n   <li><b>Masticator</b> (masseteric/pterygomandibular/temporal): trismus.</li>\n   <li><b>Deep:</b> lateral pharyngeal, retropharyngeal → airway/mediastinum danger.</li></ul>"},{"h":"3. Ludwig's Angina","html":"\n   <p><b>Bilateral</b> cellulitis of submandibular + sublingual + submental spaces. Firm \"woody\" floor of mouth, raised tongue, <b>airway emergency</b>.</p>\n   <div class=\"hy\"><b>⭐:</b> Priority = <b>secure the airway</b>, then aggressive IV antibiotics + surgical drainage. Can spread to mediastinum.</div>"},{"h":"4. Osteomyelitis & Specific Infections","html":"\n   <ul><li><b>Osteomyelitis</b>: mandible > maxilla; \"moth-eaten\" bone, sequestrum + involucrum; suppurative (acute) vs chronic.</li>\n   <li><b>Actinomycosis</b>: \"{{sulfur granules|حبيبات كبريتية}}\", multiple sinuses; Tx high-dose long penicillin.</li>\n   <li><b>Candidiasis</b>: white plaques (pseudomembranous), immunocompromised.</li></ul>"},{"h":"5. Microbiology","html":"\n  <ul><li><b>Polymicrobial & mixed</b>: early/acute = facultative <b>aerobic streptococci</b> (Strep. viridans/anginosus); later/established = <b>anaerobes</b> (Prevotella, Porphyromonas, Fusobacterium, Peptostreptococcus).</li>\n  <li>Aerobes initiate; anaerobes predominate as the abscess matures → mixed flora & gas in deep infections.</li></ul>\n  <div class=\"hy\"><b>⭐:</b> Most odontogenic infections are sensitive to <b>penicillin</b>; add/replace with <b>metronidazole</b> for anaerobes, or use co-amoxiclav/clindamycin.</div>"},{"h":"6. Pathways of Spread","html":"\n  <p>Pus follows the path of least resistance, decided by the relation of the tooth apex to the <b>muscle attachment</b> and cortical plate:</p>\n  <ul><li>Perforation <b>above</b> the muscle attachment → spreads to one space; <b>below</b> → another (e.g., mylohyoid line decides sublingual vs submandibular).</li>\n  <li>Most infections perforate the thinner <b>buccal</b> cortex; palatal/lingual spread for specific teeth.</li>\n  <li>Lower 2nd/3rd molar apices lie <b>below</b> mylohyoid → submandibular space.</li></ul>"},{"h":"7. Stages of Infection","html":"\n  <table><tr><th>Stage</th><th>Feature</th></tr>\n  <tr><td>Inoculation (0–3 d)</td><td>Soft, doughy, tender swelling (early cellulitis)</td></tr>\n  <tr><td>Cellulitis (3–5 d)</td><td>Diffuse, firm, red, hot, painful; <b>no pus yet</b></td></tr>\n  <tr><td>Abscess (5+ d)</td><td>Localised, <b>fluctuant</b>, pus formed → incise & drain</td></tr>\n  <tr><td>Resolution</td><td>After source control & drainage</td></tr></table>"},{"h":"8. Cellulitis vs Abscess","html":"\n  <table><tr><th></th><th>Cellulitis</th><th>Abscess</th></tr>\n  <tr><td>Borders</td><td>Diffuse</td><td>Well-circumscribed</td></tr>\n  <tr><td>Pus</td><td>None</td><td>Present (fluctuant)</td></tr>\n  <tr><td>Consistency</td><td>Doughy/indurated</td><td>Fluctuant</td></tr>\n  <tr><td>Danger</td><td>Spreads fast</td><td>Localised</td></tr>\n  <tr><td>Treatment</td><td>Antibiotics + source control</td><td><b>Incision & drainage</b> + source control</td></tr></table>"}],"flashcards":[{"q":"Odontogenic infections are typically?","a":"Polymicrobial (mixed aerobic + anaerobic)."},{"q":"First-line antibiotic for odontogenic infection?","a":"Penicillin."},{"q":"Core management principle?","a":"Remove cause + establish drainage (± antibiotics)."},{"q":"Maxillary canine infection spreads to?","a":"Canine space → periorbital/angular swelling."},{"q":"Ludwig's angina spaces?","a":"Bilateral submandibular + sublingual + submental."}],"quiz":[{"q":"Odontogenic infections are usually:","o":["Single aerobe","Polymicrobial (aerobic+anaerobic)","Viral","Fungal"],"c":1,"e":"Mixed flora."},{"q":"First-line antibiotic for most odontogenic infections:","o":["Penicillin","Vancomycin","Ciprofloxacin","Metronidazole alone"],"c":0,"e":"Penicillin."},{"q":"The single most important step when pus is present:","o":["Antibiotics only","Incision & drainage + remove cause","Analgesia","Warm compress"],"c":1,"e":"Drainage and source control."},{"q":"Ludwig's angina involves:","o":["One buccal space","Bilateral submandibular, sublingual, submental","Canine space","Sinus"],"c":1,"e":"Bilateral floor-of-mouth spaces."},{"q":"The priority in Ludwig's angina is:","o":["Antibiotics","Airway","Analgesia","Biopsy"],"c":1,"e":"Airway is life-threatening."},{"q":"A maxillary canine abscess typically spreads to the:","o":["Submental space","Canine space","Submandibular space","Masticator space"],"c":1,"e":"Canine space."},{"q":"Trismus is most associated with infection of the:","o":["Buccal space","Masticator space","Submental space","Canine space"],"c":1,"e":"Pterygomandibular/masseteric."},{"q":"'Sulfur granules' are characteristic of:","o":["Candidiasis","Actinomycosis","Osteomyelitis","TB"],"c":1,"e":"Actinomyces israelii."},{"q":"Sequestrum and involucrum are seen in:","o":["Osteomyelitis","Cyst","Ameloblastoma","Sinusitis"],"c":0,"e":"Osteomyelitis."},{"q":"Osteomyelitis is more common in the:","o":["Maxilla","Mandible","Zygoma","Palate"],"c":1,"e":"Mandible (poorer blood supply)."},{"q":"Pseudomembranous white plaques that wipe off suggest:","o":["Leukoplakia","Candidiasis","Lichen planus","SCC"],"c":1,"e":"Candidiasis."},{"q":"A potentially fatal spread of deep neck infection is to the:","o":["Orbit","Mediastinum","Scalp","Parotid"],"c":1,"e":"Mediastinitis."},{"q":"Treatment of actinomycosis:","o":["Short antibiotics","Prolonged high-dose penicillin","Antifungals","Steroids"],"c":1,"e":"Long-course penicillin."},{"q":"The space between medial pterygoid and ramus is the:","o":["Buccal","Pterygomandibular","Submental","Canine"],"c":1,"e":"Pterygomandibular space."},{"q":"Cellulitis differs from abscess in that it is:","o":["Localized fluctuant","Diffuse, non-fluctuant, no pus yet","Always chronic","Fungal"],"c":1,"e":"Diffuse spreading inflammation."},{"q":"Early acute odontogenic infections are predominantly:","o":["Strict anaerobes","Facultative aerobic streptococci","Fungi","Viruses"],"c":1,"e":"Aerobes initiate; anaerobes follow."},{"q":"As an odontogenic abscess matures, the flora shifts toward:","o":["Aerobes","Anaerobes (Prevotella, Fusobacterium...)","Candida","Mycobacteria"],"c":1,"e":"Anaerobes predominate later."},{"q":"The first-line antibiotic for most odontogenic infections is:","o":["Vancomycin","Penicillin/amoxicillin","Ciprofloxacin","Gentamicin"],"c":1,"e":"Penicillin sensitive flora."},{"q":"To add anaerobic cover you would combine penicillin with:","o":["Metronidazole","Aciclovir","Fluconazole","Aspirin"],"c":0,"e":"Metronidazole for anaerobes."},{"q":"In true penicillin allergy, a good alternative with bone penetration is:","o":["Clindamycin","Tetracycline","Nystatin","Aciclovir"],"c":0,"e":"Clindamycin."},{"q":"Whether a lower molar infection drains into the sublingual or submandibular space depends on the apex relative to the:","o":["Mental foramen","Mylohyoid line","External oblique ridge","Symphysis"],"c":1,"e":"Above mylohyoid → sublingual; below → submandibular."},{"q":"Infection from a maxillary canine typically points to the:","o":["Submental space","Canine space","Submandibular space","Buccal space"],"c":1,"e":"Canine space → periorbital risk."},{"q":"Marked trismus suggests involvement of the:","o":["Buccal space","Masticator (pterygomandibular/masseteric) space","Submental space","Canine space"],"c":1,"e":"Muscle-related trismus."},{"q":"A spreading, diffuse, non-fluctuant firm swelling without pus is:","o":["Abscess","Cellulitis","Granuloma","Cyst"],"c":1,"e":"Cellulitis precedes abscess."},{"q":"When fluctuant pus is present, the essential treatment is:","o":["Antibiotics alone","Incision and drainage + remove the cause","Analgesia only","Warm compress only"],"c":1,"e":"Drain pus and control the source."},{"q":"Ludwig's angina involves which spaces bilaterally?","o":["Buccal + canine","Submandibular + sublingual + submental","Infratemporal only","Retropharyngeal only"],"c":1,"e":"Bilateral floor-of-mouth spaces."},{"q":"The immediate life threat in Ludwig's angina is:","o":["Bleeding","Airway obstruction","Caries","Pain"],"c":1,"e":"Secure the airway first."},{"q":"Spread from deep neck spaces can be fatal by reaching the:","o":["Scalp","Mediastinum (mediastinitis)","Parotid","Tongue tip"],"c":1,"e":"Via para-/retropharyngeal danger space."},{"q":"Cavernous sinus thrombosis can follow infection spreading from the:","o":["Lower incisors","Upper anterior/canine/infratemporal region (via pterygoid plexus)","Mandibular angle","Floor of mouth only"],"c":1,"e":"Valveless veins to cavernous sinus."}],"pearls":["Source control is the treatment: find and remove the cause (drain/extract/endo) — antibiotics are an adjunct, never a substitute for drainage.","Pus = incise and drain; diffuse non-fluctuant cellulitis = antibiotics + treat the source and re-assess for collection.","In Ludwig's angina the first decision is the airway, not the antibiotic — be ready for an advanced airway/tracheostomy.","Whether a lower molar infection points to the sublingual or the submandibular space is decided by the apex position relative to the mylohyoid line."],"mistakes":["Prescribing antibiotics and sending the patient home when there is drainable pus — the abscess must be incised and the cause removed.","Delaying airway management in Ludwig's angina while focusing on antibiotics.","Underestimating a 'spreading' cellulitis with systemic signs that needs admission and IV therapy.","Missing the route to the cavernous sinus from an upper anterior/canine infection.","Giving a short antibiotic course for actinomycosis or osteomyelitis (both need prolonged treatment).","Treating osteomyelitis with antibiotics alone without removing the sequestrum/source.","Mistaking necrotising fasciitis (rapid spread, crepitus, systemic toxicity) for ordinary cellulitis and delaying surgical debridement.","Relying on antibiotics for pericoronitis without local debridement/irrigation and addressing trauma from the opposing tooth."],"facts":["Odontogenic infections are polymicrobial: early aerobic streptococci → later anaerobes.","First-line antibiotic: penicillin/amoxicillin; add metronidazole for anaerobes; co-amoxiclav broader.","Penicillin allergy → clindamycin (good bone penetration).","Spread decided by apex vs muscle attachment; mylohyoid line: above → sublingual, below → submandibular.","Stages: inoculation → cellulitis (diffuse, no pus) → abscess (fluctuant pus) → resolution.","Cellulitis = diffuse non-suppurative; abscess = localised fluctuant pus → incise & drain.","Maxillary spaces: canine (periorbital risk), buccal, infratemporal (→ cavernous sinus).","Mandibular spaces: submental, sublingual, submandibular, buccal, masticator (trismus).","Ludwig's angina: bilateral submandibular + sublingual + submental → airway emergency.","Deep neck spread: lateral pharyngeal → retropharyngeal → danger space → mediastinitis.","Cavernous sinus thrombosis: spread from upper anterior/canine/infratemporal via pterygoid plexus.","Management principles: remove cause + establish drainage + support + antibiotics (adjunct).","'Pus somewhere → drain it'; antibiotics alone fail without source control.","Osteomyelitis: mandible >> maxilla; sequestrum (dead bone) + involucrum (new bone), 'moth-eaten'.","Garré's = chronic osteomyelitis with proliferative periostitis ('onion-skin') in young patients.","Actinomycosis: 'sulfur granules', multiple sinuses → prolonged high-dose penicillin.","Candidiasis: wipeable white plaques (pseudomembranous) in immunosuppressed/denture wearers.","Pericoronitis: operculum inflammation over a partially erupted lower 3rd molar.","Necrotising fasciitis: rapid spread + crepitus → surgical emergency.","Most deep neck infections are odontogenic (a lower molar)."],"mnemonics":["Management priorities 'Remove-Drain-Support-Antibiotic' (cause first, drainage second, antibiotics adjunct).","Maxillary spaces from canine = Canine space (peri-orbital risk); molars = Buccal/Infratemporal.","Mandibular spaces: above mylohyoid = Sublingual; below = Submandibular; molars deep = Masticator (trismus).","Ludwig's = bilateral Submandibular + Sublingual + Submental ('3 S, both sides') → airway emergency."]},"premalignant":{"study":[{"h":"1. Definitions","html":"\n   <p><b>Premalignant lesion</b> = morphologically altered tissue with ↑ cancer risk (e.g., {{leukoplakia|طلاوة بيضاء}}). <b>Premalignant condition</b> = generalized state with ↑ risk (e.g., {{OSMF|التليف تحت المخاطي}}, lichen planus, sideropenic dysphagia).</p>"},{"h":"2. Leukoplakia & Erythroplakia","html":"\n   <ul><li><b>Leukoplakia</b>: white patch that <b>cannot be wiped off</b> and is not another disease; diagnosis of exclusion. ~5% malignant transformation; <b>speckled/nodular</b> type highest risk.</li>\n   <li><b>Erythroplakia</b>: red velvety patch — <b>highest</b> malignant potential (often already dysplasia/carcinoma in situ).</li></ul>\n   <div class=\"hy\"><b>⭐:</b> Erythroplakia > leukoplakia for malignant risk. Any non-homogeneous/erythroplakic lesion → <b>biopsy</b>.</div>"},{"h":"3. OSMF & Lichen Planus","html":"\n   <ul><li><b>OSMF</b>: areca/betel nut, juxta-epithelial fibrosis, trismus, blanching, burning — premalignant condition.</li>\n   <li><b>Lichen planus</b>: Wickham's striae; erosive type carries some malignant risk.</li>\n   <li>Risk factors overall: tobacco (smoked/smokeless), alcohol (synergistic), betel, sunlight (lip), HPV.</li></ul>"}],"flashcards":[{"q":"Lesion vs condition?","a":"Lesion = local altered tissue (leukoplakia); condition = generalized state (OSMF)."},{"q":"Definition of leukoplakia?","a":"White patch that can't be wiped off, not another disease (exclusion)."},{"q":"Highest malignant potential lesion?","a":"Erythroplakia."},{"q":"Highest-risk leukoplakia type?","a":"Speckled/nodular (non-homogeneous)."}],"quiz":[{"q":"The oral lesion with the HIGHEST malignant potential:","o":["Leukoplakia","Erythroplakia","Lichen planus","Frictional keratosis"],"c":1,"e":"Erythroplakia."},{"q":"Leukoplakia is a diagnosis of:","o":["Confirmation","Exclusion","Imaging","Culture"],"c":1,"e":"Excludes other white lesions."},{"q":"Which leukoplakia has the greatest transformation risk?","o":["Homogeneous","Speckled/nodular","Thin","Smooth"],"c":1,"e":"Non-homogeneous speckled type."},{"q":"OSMF is caused by:","o":["Smoking only","Areca/betel nut","Alcohol only","HPV"],"c":1,"e":"Areca nut."},{"q":"A premalignant CONDITION (not lesion):","o":["Leukoplakia","Erythroplakia","Oral submucous fibrosis","Frictional keratosis"],"c":2,"e":"OSMF is a generalized condition."},{"q":"Wickham's striae are seen in:","o":["Leukoplakia","Lichen planus","Candidiasis","SCC"],"c":1,"e":"Lichen planus."},{"q":"Alcohol and tobacco together act:","o":["Antagonistically","Synergistically","No effect","Protectively"],"c":1,"e":"Synergistic risk."},{"q":"The definitive step for a suspicious patch:","o":["Observe","Biopsy","Antibiotics","Antifungal"],"c":1,"e":"Biopsy to assess dysplasia."},{"q":"A white patch that wipes off is most likely:","o":["Leukoplakia","Candidiasis","Erythroplakia","OSMF"],"c":1,"e":"Pseudomembranous candidiasis."},{"q":"OSMF classically causes:","o":["Macroglossia","Trismus & blanching","Excess salivation","Pigmentation"],"c":1,"e":"Fibrosis → trismus."},{"q":"Most important histological feature predicting malignant change:","o":["Hyperkeratosis","Epithelial dysplasia","Acanthosis","Inflammation"],"c":1,"e":"Degree of dysplasia."},{"q":"Plummer-Vinson (sideropenic dysphagia) is associated with deficiency of:","o":["Vitamin C","Iron","Calcium","B12 only"],"c":1,"e":"Iron deficiency."},{"q":"Lip premalignant change is most linked to:","o":["Sunlight","Spicy food","Cold","Trauma"],"c":0,"e":"Actinic/solar exposure."}],"pearls":["Erythroplakia is far more dangerous than leukoplakia — a red velvety patch often already harbours severe dysplasia or carcinoma in situ, so biopsy promptly.","Leukoplakia is a clinical diagnosis of exclusion; the histological degree of dysplasia, not the white colour, predicts transformation.","Non-homogeneous, speckled, nodular and proliferative verrucous leukoplakias carry the highest transformation risk; the floor of mouth and ventrolateral tongue are high-risk sites."],"mistakes":["Calling a red velvety patch 'just inflammation' and missing erythroplakia/carcinoma in situ.","Diagnosing leukoplakia without excluding candidiasis, lichen planus, frictional keratosis, etc.","Failing to biopsy a non-homogeneous or persistent suspicious patch.","Treating a premalignant lesion without addressing the causative habit.","Confusing a lesion (leukoplakia) with a condition (OSMF) and mis-stating exam answers.","Reassuring and discharging instead of arranging long-term review with re-biopsy of changing lesions.","Calling a red velvety patch 'inflammation' and missing erythroplakia/carcinoma in situ.","Diagnosing leukoplakia without excluding candidiasis, lichen planus, frictional keratosis, etc."],"facts":["Premalignant LESION = local altered tissue (leukoplakia, erythroplakia).","Premalignant CONDITION = generalized state (OSMF, lichen planus, sideropenic dysphagia).","Leukoplakia: white patch that can't be wiped off, not another disease (exclusion).","Leukoplakia transformation ~3-5% (higher if non-homogeneous/dysplastic).","Non-homogeneous/speckled/nodular & proliferative verrucous = highest-risk leukoplakia.","Erythroplakia = highest malignant potential (often already dysplasia/CIS).","High-risk sites: floor of mouth, ventrolateral tongue.","OSMF: areca/betel nut → juxta-epithelial fibrosis → trismus, blanching, burning.","Lichen planus: Wickham's striae; erosive form has small malignant risk.","Risk factors: tobacco, alcohol (synergistic), betel, sunlight (lip), HPV, chronic irritation.","Epithelial dysplasia (mild→moderate→severe→CIS) predicts transformation.","Any non-homogeneous or red lesion → biopsy mandatory.","Management: stop the habit + biopsy/grade dysplasia + excise high-grade + long-term review.","Plummer-Vinson = iron-deficiency sideropenic dysphagia.","Actinic cheilitis (lip) from solar exposure is premalignant.","A premalignant lesion = a morphologically altered tissue with increased cancer risk (e.g., leukoplakia).","A premalignant condition = a generalised state with increased risk (OSMF, lichen planus, sideropenic dysphagia).","Leukoplakia = a white patch that cannot be wiped off and is not another diagnosable disease (a diagnosis of exclusion)."],"mnemonics":["Risk order: Erythroplakia > non-homogeneous leukoplakia > homogeneous leukoplakia.","Lesion vs Condition: Leukoplakia/Erythroplakia = lesions; OSMF/Lichen planus/Sideropenic dysphagia = conditions."]},"medically_compromised":{"study":[{"h":"1. Cardiovascular","html":"\n   <ul><li>Defer elective surgery <b>6 months after MI</b>; manage stress, short appointments.</li>\n   <li><b>Infective endocarditis prophylaxis</b> (e.g., amoxicillin 2 g 1 h before) for high-risk cardiac conditions undergoing procedures involving gingival/periapical manipulation — prosthetic valves, previous IE, certain congenital disease.</li>\n   <li>Limit adrenaline (≤0.04 mg) in significant cardiac disease.</li></ul>"},{"h":"2. Bleeding & Anticoagulants","html":"\n   <ul><li><b>Warfarin</b>: do NOT routinely stop; proceed with simple extraction if <b>INR <3.5–4.0</b>; use local hemostasis ({{tranexamic acid|ترانيكساميك}}, sutures, oxidized cellulose).</li>\n   <li><b>DOACs</b> (apixaban, rivaroxaban): may skip/delay morning dose per protocol.</li>\n   <li>Aspirin: usually continue. Hemophilia/vWD: liaise with hematology, factor cover.</li></ul>\n   <div class=\"hy\"><b>⭐:</b> Stopping anticoagulation risks thrombosis/stroke — local measures usually control dental bleeding.</div>"},{"h":"3. Diabetes","html":"\n   <ul><li>Risk of infection & delayed healing; morning appointments, don't skip meals/insulin.</li>\n   <li>Hypoglycemia is the acute emergency (give oral/IV glucose). Aim HbA1c control before elective surgery.</li></ul>"},{"h":"4. Other (Steroids, Liver, Renal, Pregnancy)","html":"\n   <ul><li><b>Long-term steroids</b>: adrenal suppression — may need steroid cover for major surgery.</li>\n   <li><b>Liver disease</b>: impaired clotting + amide metabolism — reduce dose.</li>\n   <li><b>Pregnancy</b>: elective care in <b>2nd trimester</b>; avoid supine hypotension; safe meds (paracetamol, penicillin); avoid NSAIDs (3rd trimester) & tetracycline.</li>\n   <li><b>Bisphosphonates</b>: MRONJ — avoid extractions where possible.</li></ul>"},{"h":"5. Infective Endocarditis Prophylaxis","html":"\n  <ul><li>For <b>high-risk cardiac conditions</b>: prosthetic valve/material, previous IE, certain congenital heart disease, cardiac transplant with valvulopathy.</li>\n  <li>Procedures needing cover: those involving <b>gingival/periapical manipulation or mucosal perforation</b> (extractions, scaling, surgery).</li>\n  <li>Regimen: <b>amoxicillin 2 g (child 50 mg/kg) orally 1 hour before</b>; penicillin allergy → clindamycin 600 mg.</li>\n  <li>Good oral hygiene reduces cumulative bacteraemia risk more than single prophylaxis.</li></ul>"},{"h":"6. Ischaemic Heart Disease & Hypertension","html":"\n  <ul><li>Defer elective surgery <b>≥6 months after MI</b>; short, stress-reduced, well-anaesthetised appointments.</li>\n  <li>Limit adrenaline to <b>≤0.04 mg</b> (~2 cartridges 1:100,000) in significant cardiac disease.</li>\n  <li>Angina: have GTN available; stop and treat if chest pain occurs.</li>\n  <li>Severe uncontrolled hypertension → defer elective care; monitor BP.</li></ul>"}],"flashcards":[{"q":"Defer elective surgery after MI for?","a":"6 months."},{"q":"INR threshold for simple extraction?","a":"Proceed if INR <3.5–4.0; don't routinely stop warfarin."},{"q":"Why not stop anticoagulants?","a":"Thrombosis/stroke risk; local measures control bleeding."},{"q":"Acute diabetic emergency in clinic?","a":"Hypoglycemia → give glucose."},{"q":"IE prophylaxis drug/dose?","a":"Amoxicillin 2 g, 1 h before."}],"quiz":[{"q":"Elective oral surgery should be deferred after an MI for at least:","o":["1 week","1 month","6 months","2 years"],"c":2,"e":"~6 months."},{"q":"For a simple extraction, warfarin should be:","o":["Always stopped 5 days","Not routinely stopped if INR <3.5–4","Doubled","Replaced by aspirin"],"c":1,"e":"Continue; use local hemostasis."},{"q":"The main reason not to stop anticoagulants:","o":["Cost","Thromboembolism/stroke risk","Allergy","Taste"],"c":1,"e":"Risk of clot/stroke."},{"q":"Standard IE prophylaxis regimen:","o":["Amoxicillin 2 g 1 h before","Penicillin 7 days","Metronidazole","No prophylaxis ever"],"c":0,"e":"Amoxicillin 2 g one hour pre-op."},{"q":"The most common acute emergency in a diabetic dental patient:","o":["Hyperglycemia","Hypoglycemia","Ketoacidosis","Stroke"],"c":1,"e":"Hypoglycemia."},{"q":"Safest trimester for elective dental treatment:","o":["First","Second","Third","Any"],"c":1,"e":"Second trimester."},{"q":"Drug to AVOID in the third trimester:","o":["Paracetamol","Penicillin","NSAIDs","Lidocaine"],"c":2,"e":"NSAIDs (ductus arteriosus)."},{"q":"Antibiotic contraindicated in pregnancy/young children:","o":["Penicillin","Tetracycline","Erythromycin","Cephalexin"],"c":1,"e":"Tetracycline stains teeth."},{"q":"A patient on long-term steroids undergoing major surgery may need:","o":["Insulin","Steroid cover","Antifungal","Iron"],"c":1,"e":"Risk of adrenal crisis."},{"q":"In significant cardiac disease, max adrenaline is:","o":["0.2 mg","0.04 mg","1 mg","No limit"],"c":1,"e":"≤0.04 mg."},{"q":"Liver disease affects LA because:","o":["↑ renal loss","Reduced hepatic amide metabolism","Faster onset","No effect"],"c":1,"e":"Amides metabolized in liver."},{"q":"Bisphosphonate therapy raises the risk of:","o":["Dry socket only","MRONJ","Hyperdontia","Caries"],"c":1,"e":"Osteonecrosis of the jaw."},{"q":"Aspirin before a simple extraction should generally be:","o":["Stopped 7 days","Continued","Doubled","Replaced by warfarin"],"c":1,"e":"Usually continued; local measures."},{"q":"Supine hypotensive syndrome in late pregnancy is relieved by:","o":["Trendelenburg","Left lateral tilt","Sitting fully upright fast","Prone"],"c":1,"e":"Left lateral position relieves IVC compression."},{"q":"A hemophilia A patient needs cover with:","o":["Factor VIII","Vitamin K","Platelets only","Iron"],"c":0,"e":"Factor VIII replacement."},{"q":"Elective surgery after an MI is deferred at least:","o":["1 week","1 month","6 months","2 years"],"c":2,"e":"~6 months."},{"q":"Standard IE prophylaxis is:","o":["Penicillin 7 days","Amoxicillin 2 g 1 h before","Metronidazole","None ever"],"c":1,"e":"Amoxicillin 2 g (clindamycin if allergic)."},{"q":"IE prophylaxis is indicated for:","o":["Mild gingivitis","A prosthetic valve having an extraction","Controlled HTN","Asthma"],"c":1,"e":"High-risk cardiac + gingival manipulation."}],"pearls":["The recurring principle: most medical conditions do not contraindicate treatment — they change its timing, drug choice, haemostasis, and the need for cover or liaison.","Stopping anticoagulation for a simple extraction usually does more harm (thromboembolism/stroke) than the bleed it prevents — operate atraumatically with local haemostasis.","Defer elective surgery for ~6 months after a myocardial infarction, and limit adrenaline to ≤0.04 mg in significant cardiac disease.","Infective endocarditis prophylaxis is reserved for high-risk cardiac conditions undergoing procedures that breach the gingiva — amoxicillin 2 g one hour before (clindamycin if allergic)."],"mistakes":["Stopping warfarin/DOACs routinely for a simple extraction and exposing the patient to clot/stroke risk.","Giving infective endocarditis prophylaxis to low-risk patients (or withholding it from genuinely high-risk ones).","Letting a diabetic skip a meal before an appointment and precipitating hypoglycaemia.","Forgetting steroid cover for a steroid-dependent patient having major surgery.","Using NSAIDs in late pregnancy or prescribing tetracycline to a pregnant patient/child.","Extracting in an IV-bisphosphonate or irradiated patient without considering osteonecrosis.","Performing an inferior alveolar nerve block in a haemophiliac without factor cover.","Treating a dialysis patient ON the dialysis day (heparinised) rather than the day after."],"facts":["Defer elective surgery ≥6 months after MI.","IE prophylaxis: amoxicillin 2 g 1 h before (clindamycin 600 mg if allergic).","IE prophylaxis only for high-risk cardiac + gingival/periapical manipulation.","Warfarin: don't stop for simple extraction if INR<~3.5-4; use local haemostasis.","Don't stop anticoagulants casually — thrombosis/stroke > dental bleeding.","DOACs: miss/delay morning dose; aspirin/clopidogrel usually continued.","Diabetic emergency = hypoglycaemia → oral glucose (glucagon if unconscious).","Cardiac disease: adrenaline ≤0.04 mg (~2 cartridges 1:100,000).","Liver disease: reduce amide LA dose; bleeding risk.","Dialysis: treat the day AFTER dialysis.","Pregnancy: 2nd trimester; left lateral tilt; avoid NSAIDs (3rd tri) & tetracycline.","Steroids long-term: steroid cover for major surgery (adrenal crisis).","Haemophilia A=FVIII, B=FIX, vWD=DDAVP/vWF; avoid IANB; tranexamic acid.","Platelets >50×10⁹/L for extractions.","Bisphosphonates/denosumab → MRONJ: avoid extractions where possible.","Anaphylaxis: IM adrenaline 0.5 mg (1:1000) + airway + oxygen.","Asthma: avoid NSAIDs/aspirin if sensitive; inhaler ready.","Hyperthyroid uncontrolled: avoid adrenaline."],"mnemonics":["MI rule: defer elective surgery ~6 months.","IE prophylaxis = Amoxicillin 2 g, 1 h before (Clindamycin 600 mg if penicillin-allergic)."]},"cysts":{"study":[{"h":"1. Classification","html":"\n   <p><b>Odontogenic</b>: inflammatory (radicular/residual) vs developmental (dentigerous, OKC, eruption, lateral periodontal). <b>Non-odontogenic</b>: nasopalatine duct, etc. A cyst = epithelial-lined pathological cavity.</p>"},{"h":"2. Radicular (Periapical) Cyst","html":"\n   <p><b>Most common</b> odontogenic cyst. Inflammatory, from rests of Malassez at apex of a <b>non-vital</b> tooth. Round/oval well-defined corticated radiolucency at the apex.</p>\n   <div class=\"hy\"><b>⭐:</b> Always associated with a NON-vital tooth. Residual cyst = remains after extraction.</div>"},{"h":"3. Dentigerous Cyst","html":"\n   <p><b>Most common developmental</b> cyst; surrounds the <b>crown of an unerupted tooth</b> (commonly 3rd molar/canine), attached at the <b>CEJ</b>. Well-defined pericoronal radiolucency.</p>"},{"h":"4. Odontogenic Keratocyst (OKC)","html":"\n   <ul><li>From dental lamina; <b>high recurrence</b>; aggressive growth along bone.</li>\n   <li>Parakeratinized lining, palisaded basal cells; thin friable wall.</li>\n   <li>Multiple OKCs → <b>{{Gorlin syndrome|متلازمة غورلن}}</b> (NBCCS).</li>\n   <li>Tx: enucleation ± Carnoy's solution/peripheral ostectomy due to recurrence.</li></ul>\n   <div class=\"hy\"><b>⭐:</b> OKC content has <b>low soluble protein (<4 g/dL)</b>; high keratin. Highest recurrence of jaw cysts.</div>"}],"flashcards":[{"q":"Most common odontogenic cyst?","a":"Radicular (periapical) cyst."},{"q":"Radicular cyst arises from?","a":"Epithelial rests of Malassez (non-vital tooth)."},{"q":"Most common developmental cyst?","a":"Dentigerous cyst."},{"q":"Dentigerous cyst attaches at?","a":"The CEJ of an unerupted tooth crown."}],"quiz":[{"q":"The most common odontogenic cyst:","o":["Dentigerous","Radicular","OKC","Residual"],"c":1,"e":"Radicular/periapical."},{"q":"Radicular cyst is associated with a tooth that is:","o":["Vital","Non-vital","Impacted","Supernumerary"],"c":1,"e":"Non-vital (pulpal necrosis)."},{"q":"Radicular cyst arises from:","o":["Rests of Malassez","Reduced enamel epithelium","Dental lamina","Malassez of follicle"],"c":0,"e":"Epithelial rests of Malassez."},{"q":"A cyst around the crown of an impacted tooth is:","o":["Radicular","Dentigerous","OKC","Nasopalatine"],"c":1,"e":"Dentigerous, attached at CEJ."},{"q":"The jaw cyst with the highest recurrence rate:","o":["Radicular","Dentigerous","OKC","Eruption"],"c":2,"e":"Odontogenic keratocyst."},{"q":"OKC lining is characteristically:","o":["Orthokeratinized","Parakeratinized with palisaded basal cells","Pseudostratified","Non-keratinized cuboidal"],"c":1,"e":"Parakeratin + palisading."},{"q":"Multiple OKCs are a feature of:","o":["Gardner syndrome","Gorlin (NBCC) syndrome","Cherubism","Paget's"],"c":1,"e":"Nevoid basal cell carcinoma syndrome."},{"q":"A cyst remaining after extraction of the offending tooth:","o":["Dentigerous","Residual","Eruption","Lateral periodontal"],"c":1,"e":"Residual cyst."},{"q":"Dentigerous cyst attaches to the tooth at the:","o":["Apex","CEJ","Mid-root","Furcation"],"c":1,"e":"Cementoenamel junction."},{"q":"OKC aspirate typically shows soluble protein:","o":["High >5 g/dL","Low <4 g/dL","Normal serum","No protein"],"c":1,"e":"Low soluble protein, high keratin."},{"q":"Treatment of OKC due to recurrence often adds:","o":["Radiotherapy","Carnoy's solution/peripheral ostectomy","Simple marsupialization only","Antibiotics"],"c":1,"e":"Adjunctive measures lower recurrence."},{"q":"The most common site of a dentigerous cyst:","o":["Maxillary lateral","Mandibular third molar","Central incisor","Premolar"],"c":1,"e":"Mandibular 3rd molar."},{"q":"A well-defined corticated apical radiolucency on a non-vital tooth is most likely:","o":["Dentigerous","Radicular cyst","OKC","Ameloblastoma"],"c":1,"e":"Radicular cyst."},{"q":"Marsupialization is used to:","o":["Remove the whole cyst","Decompress a large cyst","Biopsy only","Place implant"],"c":1,"e":"Decompress, allowing shrinkage."}],"pearls":["A radicular cyst sits at the apex of a NON-VITAL tooth — vitality testing is the quickest way to separate it from developmental cysts.","A pericoronal radiolucency around an impacted tooth is usually a dentigerous cyst, but if the lining shows ameloblastic change it is a unicystic ameloblastoma — send everything for histology.","The OKC behaves like a tumour: high recurrence and growth along the bone with little expansion; multiple OKCs mean Gorlin syndrome."],"mistakes":["Assuming a periapical radiolucency is a cyst without checking pulp vitality.","Treating a pericoronal lesion as a simple dentigerous cyst without histology (missing unicystic ameloblastoma).","Enucleating an OKC simply and expecting no recurrence.","Forgetting that multiple OKCs signal Gorlin syndrome (and its other features).","Enucleating a huge cyst aggressively next to the IAN instead of decompressing it first.","Discarding the lining instead of sending it for histopathology.","Assuming a periapical radiolucency is a cyst without checking pulp vitality.","Treating a pericoronal lesion as a simple dentigerous cyst without histology (missing unicystic ameloblastoma)."],"facts":["A cyst = epithelium-lined pathological cavity.","Most common odontogenic cyst: radicular (periapical), inflammatory, non-vital tooth.","Radicular cyst origin: epithelial rests of Malassez.","Residual cyst = radicular cyst remaining after extraction.","Most common developmental cyst: dentigerous (encloses crown, attached at CEJ).","OKC/KCOT: dental lamina (rests of Serres); highest recurrence.","OKC histology: parakeratinised, palisaded basal layer, corrugated surface, daughter cysts.","OKC aspirate: soluble protein <4 g/dL, keratin.","Multiple OKCs → Gorlin (nevoid basal cell carcinoma) syndrome.","Lateral periodontal cyst: vital tooth, lateral root; botryoid = multilocular variant.","Calcifying odontogenic cyst (Gorlin): ghost cells.","Nasopalatine duct cyst: midline anterior maxilla, 'heart-shaped' (commonest non-odontogenic).","Pseudocysts (no lining): solitary/traumatic bone cyst, aneurysmal bone cyst, Stafne defect.","Stafne defect: lingual mandibular depression with salivary tissue, below IAN canal (incidental).","Management: enucleation (+histology); marsupialisation/decompression for large cysts or to protect IAN.","OKC treatment adds Carnoy's/peripheral ostectomy due to recurrence.","A cyst = an epithelium-lined pathological cavity; it enlarges by osmotic/hydrostatic pressure and bone resorption.","Inflammatory odontogenic cysts: radicular (apical/lateral/residual) and paradental.","Developmental odontogenic cysts: dentigerous, eruption, OKC, lateral periodontal, gingival, glandular, calcifying.","Non-odontogenic cysts: nasopalatine duct and nasolabial."],"mnemonics":["Radicular = non-vital tooth (Rests of Malassez); Residual = left after extraction.","Dentigerous = around the Crown, attached at the CEJ; OKC = Dental lamina, highest Recurrence."]},"oral_cancer":{"study":[{"h":"1. Squamous Cell Carcinoma (SCC)","html":"\n   <p><b>>90%</b> of oral cancers are SCC. Risk: tobacco, alcohol (synergistic), betel, sunlight (lip), HPV-16 (oropharynx). Common sites: <b>lateral border of tongue</b> and floor of mouth.</p>\n   <div class=\"hy\"><b>⭐:</b> A non-healing ulcer >2–3 weeks with rolled/indurated margins → biopsy to exclude SCC.</div>"},{"h":"2. Presentation & Diagnosis","html":"\n   <ul><li>Persistent ulcer, induration, exophytic/endophytic mass, fixation, lymphadenopathy, referred otalgia.</li>\n   <li>Diagnosis: <b>incisional biopsy</b> + imaging (CT/MRI) + neck assessment.</li></ul>"},{"h":"3. TNM Staging & Spread","html":"\n   <p><b>T</b> = tumor size, <b>N</b> = nodes, <b>M</b> = metastasis. Lymphatic spread to cervical nodes (levels I–V); distant spread mainly to lungs.</p>"},{"h":"4. Management","html":"\n   <ul><li>Surgery (wide excision + neck dissection), radiotherapy, chemotherapy — often combined.</li>\n   <li>Prognosis depends on <b>stage</b> and <b>nodal involvement</b> (single most important prognostic factor).</li>\n   <li>Complication of radiotherapy to jaws: <b>{{osteoradionecrosis|تنخر عظمي إشعاعي}}</b> — avoid extractions in irradiated bone.</li></ul>"},{"h":"5. Epidemiology & Risk Factors","html":"\n  <ul><li><b>Tobacco</b> (smoked & smokeless) and <b>alcohol</b> are the major risks — <b>synergistic</b> together.</li>\n  <li><b>Betel quid/areca nut</b> (and OSMF), <b>sunlight</b> (lip), <b>HPV-16</b> (oropharynx/tonsil), immunosuppression, chronic trauma, poor diet (low fruit/veg), previous oral cancer (field change).</li>\n  <li>More common in older males, but HPV-related disease affects younger non-smokers.</li></ul>"}],"flashcards":[{"q":"Most common oral malignancy?","a":"Squamous cell carcinoma (>90%)."},{"q":"Most common intraoral SCC sites?","a":"Lateral tongue & floor of mouth."},{"q":"Synergistic risk factors?","a":"Tobacco + alcohol."},{"q":"Lip cancer risk factor?","a":"Sunlight (actinic)."}],"quiz":[{"q":"Over 90% of oral cancers are:","o":["Adenocarcinoma","Squamous cell carcinoma","Melanoma","Lymphoma"],"c":1,"e":"SCC."},{"q":"Most common intraoral site of SCC:","o":["Hard palate","Lateral border of tongue","Gingiva","Buccal mucosa"],"c":1,"e":"Lateral tongue & floor of mouth."},{"q":"Two synergistic risk factors for oral SCC:","o":["Tobacco & alcohol","Caffeine & sugar","Cold & dry air","Iron & calcium"],"c":0,"e":"Tobacco + alcohol."},{"q":"Lip carcinoma is most associated with:","o":["HPV","Sunlight","Alcohol","Iron deficiency"],"c":1,"e":"Actinic/solar exposure."},{"q":"The virus linked to oropharyngeal SCC:","o":["HSV","HPV-16","EBV","CMV"],"c":1,"e":"HPV-16."},{"q":"A 3-week non-healing indurated ulcer should be:","o":["Observed 3 months","Biopsied","Given antibiotics","Cauterized"],"c":1,"e":"Incisional biopsy."},{"q":"In TNM, N refers to:","o":["Nerve","Nodes","Necrosis","Nucleus"],"c":1,"e":"Regional lymph nodes."},{"q":"The single most important prognostic factor in oral SCC:","o":["Age","Cervical node involvement","Sex","Site only"],"c":1,"e":"Nodal metastasis."},{"q":"Oral SCC most commonly metastasizes distantly to the:","o":["Liver","Lungs","Brain","Bone marrow"],"c":1,"e":"Lungs."},{"q":"Osteoradionecrosis risk means you should avoid:","o":["Brushing","Extractions in irradiated bone","Fluoride","Saliva substitutes"],"c":1,"e":"Extractions in irradiated jaw."},{"q":"Cervical lymphatic levels are numbered:","o":["I–III","I–V","I–VII","A–D"],"c":1,"e":"Levels I–V (±VI)."},{"q":"The earliest clinical change may resemble:","o":["Erythroplakia/leukoplakia","Caries","Abscess","Mucocele"],"c":0,"e":"Premalignant patches."},{"q":"Definitive diagnosis of oral cancer is by:","o":["CT","Histopathology (biopsy)","Blood test","Clinical only"],"c":1,"e":"Biopsy/histopathology."}],"pearls":["Any ulcer that has not healed in three weeks, especially if indurated with rolled margins, must be biopsied to exclude squamous cell carcinoma.","Cervical lymph-node involvement is the single most important prognostic factor — examine and image the neck.","The lateral border of the tongue and the floor of mouth are the highest-risk intra-oral sites."],"mistakes":["Treating a non-healing indurated ulcer as a traumatic ulcer and delaying biopsy.","Ignoring an enlarged, hard cervical node.","Forgetting that a 'numb chin'/lip without a dental cause can signal malignancy.","Extracting teeth in an irradiated jaw and precipitating osteoradionecrosis.","Reassuring a patient with a persistent red/white patch without biopsy.","Missing second primaries because of incomplete mucosal examination/follow-up.","Treating a non-healing indurated ulcer as traumatic and delaying biopsy.","Ignoring an enlarged, hard cervical node."],"facts":[">90% of oral cancers are squamous cell carcinoma (SCC).","Commonest intraoral sites: lateral border of tongue and floor of mouth.","Risk factors: tobacco + alcohol (synergistic), betel/areca, sunlight (lip), HPV-16 (oropharynx).","Premalignant precursors: erythroplakia (highest), leukoplakia, OSMF, erosive lichen planus.","Field cancerisation → multiple primaries & high second-primary risk.","Red flags: ulcer >3 weeks, induration, fixation, neck node, numb lip/chin, referred otalgia.","Diagnosis: incisional biopsy (histopathology).","Staging: TNM (T size/depth, N nodes, M metastasis).","Lymphatic spread to cervical nodes levels I-V; distant spread mainly to lungs.","Single most important prognostic factor: cervical nodal involvement (ENE worsens it).","Early (I-II): single modality; advanced (III-IV): surgery + adjuvant chemoradiotherapy.","Reconstruction: radial forearm (soft tissue), free fibula (mandible).","Radiotherapy effects: mucositis, xerostomia, radiation caries, trismus, ORN.","ORN: avoid extractions in irradiated bone; extract before radiotherapy; HBO adjunct.","Definitive outcome driver = stage + nodal status; early detection saves lives.",">90% of oral cancers are squamous cell carcinoma (SCC).","Commonest intra-oral sites: lateral border of the tongue and the floor of mouth.","Major risk factors: tobacco (smoked & smokeless) and alcohol — synergistic together."],"mnemonics":["Red flags 'ULCER': Unhealing >3 weeks, Lump/node, Colour change (red/white), Edge rolled/indurated, Referred otalgia/numbness.","Prognosis driver = N (nodal status); distant spread mainly to the Lungs."]},"impacted":{"study":[{"h":"1. Definitions & Causes","html":"\n   <p>An <b>impacted tooth</b> fails to erupt into its expected position by the expected time, blocked by bone, tooth, or soft tissue. Commonest: <b>mandibular 3rd molar</b>, then maxillary canine.</p>"},{"h":"2. Winter's & Pell-Gregory Classification (3rd molar)","html":"\n   <ul><li><b>Winter</b> (angulation): mesioangular (commonest), vertical, distoangular (hardest to remove), horizontal.</li>\n   <li><b>Pell & Gregory</b>: depth (A/B/C) and ramus relation (Class 1/2/3).</li></ul>\n   <div class=\"hy\"><b>⭐:</b> <b>Mesioangular</b> is the most common and usually easiest; <b>distoangular</b> is generally the most difficult mandibular impaction to remove.</div>"},{"h":"3. Indications/Contraindications for Removal","html":"\n   <ul><li>Remove for: recurrent {{pericoronitis|التهاب حوائط التاج}}, caries, cyst/tumor, resorption of adjacent tooth, orthodontic need.</li>\n   <li>Avoid prophylactic removal of asymptomatic, disease-free impactions (NICE).</li></ul>"},{"h":"4. Impacted Canine & Complications","html":"\n   <ul><li>Maxillary canine often palatal; localize with <b>parallax (SLOB rule)</b> or CBCT; manage by exposure + orthodontic traction or removal.</li>\n   <li>3rd molar surgery risks: <b>IAN/lingual nerve injury</b>, dry socket, fracture, OAC (upper).</li></ul>"},{"h":"5. Causes & Frequency","html":"\n  <ul><li>Failure to erupt by the expected time due to obstruction by bone, tooth, or soft tissue, or lack of space/abnormal position.</li>\n  <li>Order of frequency: <b>mandibular 3rd molar</b> > maxillary 3rd molar/canine > others (premolars, supernumeraries).</li></ul>"}],"flashcards":[{"q":"Most commonly impacted tooth?","a":"Mandibular third molar."},{"q":"Second most impacted?","a":"Maxillary canine."},{"q":"Most common 3rd molar angulation?","a":"Mesioangular."},{"q":"Hardest mandibular 3rd molar to remove?","a":"Distoangular."}],"quiz":[{"q":"The most commonly impacted tooth:","o":["Maxillary canine","Mandibular third molar","Maxillary third molar","Mandibular premolar"],"c":1,"e":"Lower 3rd molar."},{"q":"The most common angulation of mandibular 3rd molar impaction:","o":["Distoangular","Mesioangular","Horizontal","Vertical"],"c":1,"e":"Mesioangular."},{"q":"Generally the most difficult mandibular 3rd molar to remove:","o":["Mesioangular","Vertical","Distoangular","Horizontal"],"c":2,"e":"Distoangular."},{"q":"Winter's classification is based on:","o":["Depth","Angulation","Ramus relation","Root number"],"c":1,"e":"Angulation."},{"q":"Pell & Gregory classification uses depth and:","o":["Angulation","Relation to ramus","Root shape","Crown size"],"c":1,"e":"Ramus relationship (class 1/2/3)."},{"q":"A clear indication for 3rd molar removal:","o":["Asymptomatic","Recurrent pericoronitis","Patient anxiety","Routine prophylaxis"],"c":1,"e":"Recurrent pericoronitis/pathology."},{"q":"Nerves most at risk during lower 3rd molar surgery:","o":["Facial & lingual","IAN & lingual","Mental & buccal","Hypoglossal"],"c":1,"e":"Inferior alveolar & lingual."},{"q":"The second most commonly impacted tooth:","o":["Maxillary canine","Mandibular canine","Maxillary lateral","Premolar"],"c":0,"e":"Maxillary canine."},{"q":"To localize an impacted canine on two radiographs you use:","o":["TNM","SLOB/parallax rule","Winter's lines","ALARA"],"c":1,"e":"Same Lingual Opposite Buccal."},{"q":"Prophylactic removal of disease-free impacted 3rd molars is:","o":["Always indicated","Not recommend
