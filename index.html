ays in the pharynx</h4><ul><li>Air (nose → larynx)</li><li>Food (mouth → oesophagus)</li></ul>"},{"h":"Functions · الوظائف","lvl":"surface","html":"<table><tr><th>Structure</th><th>Function</th></tr><tr><td><b>Pharynx</b></td><td>A shared passage that directs air to the larynx and food to the oesophagus.</td></tr><tr><td><b>Constrictor muscles</b></td><td>Squeeze in sequence to propel the food bolus into the oesophagus.</td></tr><tr><td><b>Tonsils</b></td><td>Guard the entrance to the gut and airway against ingested/inhaled microbes.</td></tr></table>"},{"h":"Comparisons & Differences · الفوارق","lvl":"surface","html":"<p><b>Nasopharynx</b> vs <b>Oropharynx</b>: The nasopharynx lies behind the nose and is purely an air passage; the oropharynx lies behind the mouth and is shared by air and food.</p>"},{"h":"Precision Facts · معلومات دقيقة","lvl":"surface","html":"<ol class=\"facts\"><li>The pharynx has three parts: nasopharynx, oropharynx and laryngopharynx.</li><li>There are three constrictor muscles of the pharynx.</li><li>The pharynx is shared by the airway and the food passage.</li></ol>"}],"scenarios":[],"quiz":[],"flashcards":[{"q":"Three parts of the pharynx?","a":"Nasopharynx, oropharynx, laryngopharynx"},{"q":"Three constrictor muscles?","a":"Superior, middle, inferior"},{"q":"Nerve to MOST pharyngeal muscles?","a":"Pharyngeal plexus (vagus, X)"}],"pearls":["Pharynx parts: naso- (V2), oro- (IX), laryngo- (X) — that's also the sensory map.","All pharyngeal muscles = vagus EXCEPT stylopharyngeus (IX)."],"mistakes":["<b>Myth:</b> All pharyngeal muscles are supplied by the vagus. <b style=\"color:var(--green)\">Truth:</b> All EXCEPT stylopharyngeus, which is supplied by the glossopharyngeal nerve (IX).","<b>Myth:</b> The gag reflex afferent is the vagus. <b style=\"color:var(--green)\">Truth:</b> The afferent limb is the GLOSSOPHARYNGEAL nerve (IX); the vagus is the efferent."]},"an_larynx":{"hasLevels":true,"ar":"الحنجرة","blurb":"The organ of voice and the guardian of the airway — its cartilages, the two laryngeal nerves, and the all-important muscle that opens the cords.","study":[{"h":"Enumerations · المسميات والأعداد","lvl":"surface","html":"<h4>Two jobs of the larynx</h4><ul><li>Protects the airway during swallowing</li><li>Produces the voice (phonation)</li></ul><h4>The most prominent laryngeal cartilage</h4><ul><li>Thyroid cartilage (the 'Adam's apple')</li></ul>"},{"h":"Functions · الوظائف","lvl":"surface","html":"<table><tr><th>Structure</th><th>Function</th></tr><tr><td><b>Larynx</b></td><td>Guards the airway and generates the voice.</td></tr><tr><td><b>Epiglottis</b></td><td>Folds back over the laryngeal inlet during swallowing to keep food out of the airway.</td></tr><tr><td><b>Vocal cords</b></td><td>Vibrate as air passes to produce sound.</td></tr></table>"},{"h":"Comparisons & Differences · الفوارق","lvl":"surface","html":"<p><b>Thyroid cartilage</b> vs <b>Cricoid cartilage</b>: The thyroid cartilage forms the Adam's apple; the cricoid is the only complete ring, sitting just below it.</p>"},{"h":"Precision Facts · معلومات دقيقة","lvl":"surface","html":"<ol class=\"facts\"><li>The larynx protects the airway and produces the voice.</li><li>The thyroid cartilage forms the Adam's apple.</li><li>The epiglottis covers the airway during swallowing.</li></ol>"}],"scenarios":[],"quiz":[],"flashcards":[{"q":"Adam's apple = which cartilage?","a":"Thyroid cartilage"},{"q":"Only complete cartilage ring?","a":"Cricoid cartilage"},{"q":"Both laryngeal nerves come from?","a":"The vagus (X)"},{"q":"Sensation ABOVE the cords?","a":"Internal laryngeal nerve"}],"pearls":["Posterior cricoarytenoid = the ONLY cord opener (abductor). 'PCA opens'.","Recurrent laryngeal = all muscles EXCEPT cricothyroid (external laryngeal)."],"mistakes":["<b>Myth:</b> The recurrent laryngeal nerve supplies all laryngeal muscles. <b style=\"color:var(--green)\">Truth:</b> All EXCEPT cricothyroid, which is supplied by the external laryngeal nerve.","<b>Myth:</b> The lateral cricoarytenoid opens the vocal cords. <b style=\"color:var(--green)\">Truth:</b> The POSTERIOR cricoarytenoid is the only ABductor (opener); the lateral one closes them."]}});

async function startQuizFromServer(topicName) {
  const btn = document.querySelector(".block .btn");

  if (btn) {
    btn.innerText = "⏳ Generating quiz from textbook...";
    btn.disabled = true;
  }  
  try {
    const response = await fetch(
      "http://127.0.0.1:8787/api/generate-questions",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          topic: topicName,
          numberOfQuestions: 5
        })
      }
    );

    const result = await response.json();

    if (!result.success) {
      throw new Error(result.error || "Failed to generate quiz");
    }


    const pool = result.data.map(item => ({
      q: item.question,
      o: item.options,

      // تحويل نص الإجابة الصحيحة إلى رقم الخيار
      c: item.options.findIndex(
        option => option === item.correct_answer
      ),

      e: item.explanation || ""
    }));
    

    quizState = {
      i: 0,
      score: 0,
      answered: false,
      done: false,
      order: pool
    };

    renderTab();

  } catch (error) {
    console.error(error);

    alert(`❌ ${error.message}`);

    if (btn) {
      btn.innerText = "Start quiz →";
      btn.disabled = false;
    }
  }
}

function answer(k){
  

 if(quizState.answered) return;

 quizState.answered = true;

 const q = quizState.order[quizState.i];

 // دعم أسئلة AI
 const correctIndex =
   q.a !== undefined ? q.a : q.c;

 const correctEl =
   document.getElementById('opt' + correctIndex);

 if(correctEl){
   correctEl.classList.add('correct');
 }

 if(k !== correctIndex){

   const wrongEl =
     document.getElementById('opt' + k);

   if(wrongEl){
     wrongEl.classList.add('wrong');
   }

   recordMistake({
     topic:(COURSE.find(s=>s.id===cur)||{}).name||cur,
     q:q.q,
     o:q.o,
     c:correctIndex,
     e:q.exp || q.e || "",
     picked:k
   });

 } else {

   quizState.score++;

 }

 // عرض الشرح
 const expBox =
   document.getElementById('exp');

 if(expBox){

   expBox.innerHTML = `
     <div style="
       margin-top:12px;
       padding:12px;
       border-radius:12px;
       background:#1e293b;
       border:1px solid #334155;
       line-height:1.7;
     ">
       <div style="color:#22c55e;font-weight:bold;margin-bottom:8px">
         ✅ Correct Answer:
       </div>

       <div>
         ${q.o[correctIndex]}
       </div>

       ${
         (q.exp || q.e)
         ? `
         <hr style="margin:10px 0;border-color:#334155">

         <div style="color:#fbbf24;font-weight:bold;margin-bottom:6px">
           📖 Explanation
         </div>

         <div>
           ${q.exp || q.e}
         </div>
         `
         : ""
       }
     </div>
   `;

   expBox.classList.add('show');
 }

 document.getElementById('next').style.display =
   'inline-block';
}

 COURSE.forEach(s=>{if(s.weight!=null&&CONTENT[s.id]){ready++;den+=s.weight;const pr=progress[s.id];const b=(pr&&pr.best!=null)?pr.best:0;if(pr&&pr.best!=null)tested++;num+=s.weight*b/100;if(b>=80)mastered++;}});
 return {pct:den?Math.round(num/den*100):0,mastered,ready,tested};}
function readLine(){const r=readiness();return `<div class="block" style="margin-top:14px"><div class="rdbar"><div class="ring" style="--p:${r.pct}"><i><b>${r.pct}%</b><small>readiness</small></i></div>
  <div style="flex:1;min-width:160px"><div style="font-weight:800;font-size:15px;margin-bottom:4px">📊 جاهزيتك الكلية (موزونة بالبلوبرنت)</div>
  <div style="color:var(--dim);font-size:13px;line-height:1.7">أتقنت <b style="color:var(--green)">${r.mastered}</b> من ${r.ready} مواضيع (≥80%) · اختبرت ${r.tested}/${r.ready}.<br>الرقم يقدّر درجتك المتوقعة لو كان الامتحان بنفس أوزان موادك الحالية. ارفعه برفع أفضل نتيجة لكل موضوع.</div></div></div></div>`;}

 const r=readiness();const ready=COURSE.filter(s=>s.weight!=null&&CONTENT[s.id]);
 const sorted=[...ready].sort((a,b)=>b.weight-a.weight);
 const totalBest=sorted.map(s=>{const pr=progress[s.id];return (pr&&pr.best!=null)?pr.best:null;});
 v.innerHTML=`<h1>📊 My Progress</h1>
  <p class="lead">نسبة إنجازك تتحدّث تلقائياً بعد كل اختبار. الجاهزية الكلية موزونة بأوزان البلوبرنت — أي أن إتقان المواضيع الأثقل (القلع 10٪، الرضوح 9٪…) يرفع رقمك أكثر.</p>
  <div class="block"><div class="rdbar"><div class="ring" style="--p:${r.pct}"><i><b>${r.pct}%</b><small>readiness</small></i></div>
   <div style="flex:1;min-width:200px">
    <div style="display:flex;gap:16px;flex-wrap:wrap;text-align:center;margin-bottom:6px">
     <div style="flex:1"><div style="font-size:24px;font-weight:900;color:var(--green)">${r.mastered}</div><small style="color:var(--muted)">mastered ≥80%</small></div>
     <div style="flex:1"><div style="font-size:24px;font-weight:900;color:var(--gold)">${r.tested}/${r.ready}</div><small style="color:var(--muted)">topics attempted</small></div>
     <div style="flex:1"><div style="font-size:24px;font-weight:900;color:var(--teal)">${progress._exam!=null?progress._exam+'%':'—'}</div><small style="color:var(--muted)">best mock exam</small></div>
    </div>
    <div style="color:var(--dim);font-size:12.5px">حقّق ≥80٪ في كل موضوع لتصل جاهزيتك إلى 100٪.</div>
   </div></div></div>
  <h3 style="color:var(--gold);margin:18px 0 10px">Per-topic (sorted by exam weight)</h3>
  ${sorted.map(s=>{const pr=progress[s.id];const b=(pr&&pr.best!=null)?pr.best:null;

function resetProgress(){if(typeof confirm!=='undefined'&&!confirm('Reset ALL scores & progress? (Mistakes Bank stays)'))return;COURSE.forEach(s=>{if(progress[s.id])delete progress[s.id];});delete progress._exam;saveProg(progress);renderNav();render();}

/* ===== عبقرينو — offline curriculum answer engine ===== */
let _askIdx=null,askQ="",askRes=null,aiAnswer=null,aiBusy=false,aiError=null;
const STOP=new Set("the of a an is are was were be been being in to and or for with on at by as from that this it its which can may will would should could into not no nor than then so such between also more most each per very using use used common cause causes due if when where what why how do does done may i you your اذا التي الذي الذين في من على الى عن مع او أو ايضا أيضا هذا هذه ذلك تلك يكون تكون كل غير بين قد هو هي هل ما ماهي عند بعد قبل عبر حول نحو".split(/\s+/));
function tokenize(s){const m=(s||'').toLowerCase().match(/[a-z0-9؀-ۿ]+/g)||[];const o={};m.forEach(t=>{if(t.length<2||STOP.has(t))return;o[t]=(o[t]||0)+1;});return o;}
function stripT(s){return (s||'').replace(/\{\{([^|}]+)\|([^}]+)\}\}/g,'$1 $2').replace(/<[^>]+>/g,' ').replace(/&[a-z]+;/g,' ').replace(/\s+/g,' ').trim();}
function buildAskIndex(){if(_askIdx)return _askIdx;const idx=[];
 COURSE.forEach(s=>{const C=CONTENT[s.id];if(!C)return;const T=s.name;
  (C.study||[]).forEach(n=>idx.push({topic:s.id,tname:T,type:'Note',head:stripT(n.h),text:stripT(n.h+' '+n.html),raw:'<h4 style="color:var(--gold);margin-bottom:6px">'+n.h+'</h4>'+n.html,long:true}));
  (C.facts||[]).forEach(f=>idx.push({topic:s.id,tname:T,type:'Fact',head:'',text:stripT(f),raw:f}));
  (C.pearls||[]).forEach(f=>idx.push({topic:s.id,tname:T,type:'Pearl',head:'',text:stripT(f),raw:f}));
  (C.mistakes||[]).forEach(f=>idx.push({topic:s.id,tname:T,type:'Common mistake',head:'',text:stripT(f),raw:f}));
  (C.mnemonics||[]).forEach(f=>idx.push({topic:s.id,tname:T,type:'Mnemonic',head:'',text:stripT(f),raw:f}));
  (C.flashcards||[]).forEach(f=>idx.push({topic:s.id,tname:T,type:'Flashcard',head:stripT(f.q),text:stripT(f.q+' '+f.a),raw:'<b>'+f.q+'</b><br>'+f.a}));});
 idx.forEach(u=>u.toks=tokenize(u.text));_askIdx=idx;return idx;}
function askSearch(q){const idx=buildAskIndex();const qtoks=tokenize(q);const qt=Object.keys(qtoks);if(!qt.length)return [];
 const df={};idx.forEach(u=>qt.forEach(t=>{if(u.toks[t])df[t]=(df[t]||0)+1;}));const N=idx.length;const ql=q.toLowerCase().trim();
 const scored=idx.map(u=>{let sc=0,hit=0;qt.forEach(t=>{const tf=u.toks[t]||0;if(tf){hit++;const idf=Math.log(1+N/(df[t]||1));sc+=(1+Math.log(tf))*idf*(u.head&&u.head.toLowerCase().indexOf(t)>=0?2.2:1);}});
  if(!hit)return null;sc*=hit/qt.length;sc*=(1+hit*0.12);if(ql.length>4&&u.text.toLowerCase().indexOf(ql)>=0)sc*=2.6;return {u,sc};}).filter(Boolean);
 scored.sort((a,b)=>b.sc-a.sc);return scored.slice(0,8);}
function aiUrl(){try{return localStorage.getItem('oms_ai_url')||''}catch(e){return ''}}
function setAiUrl(){var cur=aiUrl();var u=prompt('الصق رابط خادم عبقرينو الذكي (Cloudflare Worker URL).\nاتركه فارغاً لإيقاف الذكاء والعودة للبحث المحلي.',cur);if(u===null)return;try{localStorage.setItem('oms_ai_url',u.trim())}catch(e){}aiAnswer=null;aiError=null;renderAsk(document.getElementById('view'));}
function esc(x){return String(x).replace(/[&<>]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c];});}
function renderAsk(v){const ex=["dry socket management","favourable vs unfavourable mandible fracture","Ludwig angina","inferior alveolar nerve block","ameloblastoma types","oroantral communication closure","leukoplakia management","fascial spaces"];
 const on=!!aiUrl();
 v.innerHTML=`<h1>\u{1F916} عبقرينو <span style="color:var(--gold);font-size:15px">— Ask your curriculum</span></h1>
  <p class="lead">اكتب سؤالك ويجيبك من منهجك. <b>الوضع الذكي</b> (إن فعّلته) يفهم السؤال ويصوغ إجابة دقيقة معتمداً على منهجك فقط؛ وإن لم يتوفّر إنترنت/خادم يرجع للبحث المحلي. <b style="color:var(--gold)">اكتب المصطلح بالإنجليزية للأفضل.</b></p>
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap">
   <span class="chip" style="cursor:default;border-color:${on?'var(--green)':'var(--border)'};color:${on?'var(--green)':'var(--muted)'}">${on?'\u{1F7E2} الوضع الذكي مُفعّل':'⚪ بحث محلي فقط'}</span>
   <span class="chip" onclick="setAiUrl()">⚙ ضبط الذكاء</span></div>
  <div class="askbar"><input id="askin" placeholder="مثال: management of dry socket?" value="${(askQ||'').replace(/"/g,'&quot;')}" onkeydown="if(event.key==='Enter')doAsk()">
   <button class="btn" onclick="doAsk()">اسأل →</button></div>
  <div style="margin:8px 0 2px;font-size:12px;color:var(--muted)">جرّب: ${ex.map(e=>`<span class="chip" onclick="askChip('${e}')">${e}</span>`).join(' ')}</div>
  <div id="askres"></div>`;
 if(askRes||aiAnswer||aiBusy)renderAskRes();}
function askChip(e){askQ=e;var el=document.getElementById('askin');if(el)el.value=e;doAsk();}
async function doAsk(){const el=document.getElementById('askin');if(el)askQ=el.value;aiAnswer=null;aiError=null;aiBusy=false;askRes=askSearch(askQ||'');
 const url=aiUrl();const online=(typeof navigator==='undefined')||navigator.onLine!==false;
 if(url&&(askQ||'').trim()&&online){
  aiBusy=true;renderAskRes();
  try{
   const passages=(askRes||[]).slice(0,6).map(r=>({topic:r.u.tname,type:r.u.type,text:(r.u.text||'').slice(0,900)}));
   const resp=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:askQ,passages})});
   const data=await resp.json();aiBusy=false;
   if(data&&data.answer){aiAnswer=data.answer;}else{aiError=(data&&data.error)||'تعذّر الاتصال بالخادم';}
  }catch(e){aiBusy=false;aiError='تعذّر الاتصال (تحقّق من الإنترنت أو الرابط)';}
  renderAskRes();return;
 }
 renderAskRes();}
function ansHTML(u){return `<div class="${u.long?'ans-clamp':''}">${mark(u.raw||u.text)}</div>`;}
function aiCard(){
 if(aiBusy)return `<div class="block ans-best"><div class="ans-tag">\u{1F916} عبقرينو يفكّر…</div><div class="ans-body" style="color:var(--muted)">يقرأ منهجك ويصوغ الإجابة…</div></div>`;
 if(aiAnswer)return `<div class="block ans-best"><div class="ans-tag">\u{1F916} إجابة عبقرينو الذكية <span style="color:var(--dim)">(معتمدة على منهجك)</span></div><div class="ans-body" style="white-space:pre-wrap;line-height:1.9">${esc(aiAnswer)}</div></div>`;
 if(aiError)return `<div class="block" style="border-color:var(--gold)"><div class="ans-tag" style="color:var(--gold)">⚠ ${esc(aiError)} — عرضتُ لك البحث المحلي بدلاً منه.</div></div>`;
 return '';}
function renderAskRes(){const box=document.getElementById('askres');if(!box)return;
 if(!(askQ||'').trim()){box.innerHTML='';return;}
 const ai=aiCard();
 if(!askRes||!askRes.length){box.innerHTML=ai+`<div class="block"><p>لا توجد مطابقة مباشرة في المنهج. جرّب كلمات مفتاحية أبسط، أو افتح الموضوع المعني من القائمة.</p></div>`;return;}
 const best=askRes[0].u;const rest=askRes.slice(1,6);
 const bestBlock = aiAnswer ? '' : `<div class="block ans-best"><div class="ans-tag">\u{1F4CC} أفضل إجابة من المنهج · <b>${best.tname}</b> · ${best.type}</div><div class="ans-body">${ansHTML(best)}</div><button class="btn ghost sm" onclick="go('${best.topic}')">افتح الموضوع كاملاً ↗</button></div>${rest.length?`<h3 style="color:var(--gold);margin:16px 0 8px">مصادر إضافية من المنهج</h3>`:''}`;
 const head = aiAnswer ? `<h3 style="color:var(--gold);margin:16px 0 8px">المصادر من منهجك (للتحقّق)</h3>` : '';
 const items = aiAnswer ? askRes.slice(0,6) : rest;
 const list = items.map(r=>`<div class="q"><div style="color:var(--muted);font-size:12px;margin-bottom:6px">${r.u.tname} · ${r.u.type}</div><div class="ans-body">${ansHTML(r.u)}</div><button class="btn ghost sm" onclick="go('${r.u.topic}')">افتح الموضوع ↗</button></div>`).join('');
 box.innerHTML=ai+bestBlock+head+list+`<p style="color:var(--dim);font-size:11px;margin-top:12px">عبقرينو يستند إلى منهجك فقط. تحقّق دائماً قبل الاعتماد النهائي.</p>`;}

/* ===== MOCK EXAM MODE ===== */
let examState=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function allExamQ(){const out=[];COURSE.forEach(s=>{if(s.weight!=null&&CONTENT[s.id])CONTENT[s.id].quiz.forEach(q=>out.push({q,topic:s.name}));});return out;}
function buildWeighted(n){const pool=[];COURSE.forEach(s=>{if(s.weight!=null&&CONTENT[s.id]){const qs=CONTENT[s.id].quiz;const want=Math.max(1,Math.round(n*s.weight/100));shuffle(qs).slice(0,Math.min(want,qs.length)).forEach(q=>pool.push({q,topic:s.name}));}});return shuffle(pool).slice(0,n);}
function startExam(p){let qs;if(p==="blueprint")qs=buildWeighted(100);else if(p==="quick")qs=shuffle(allExamQ()).slice(0,25);else if(p==="half")qs=shuffle(allExamQ()).slice(0,50);else qs=shuffle(allExamQ());examState={qs,i:0,answers:{},submitted:false};render();}
function newExam(){examState=null;render();}
function pickExam(k){examState.answers[examState.i]=k;render();}
function examGo(n){examState.i=Math.max(0,Math.min(examState.qs.length-1,n));render();}
function submitExam(){examState.submitted=true;const {qs,answers}=examState;let c=0;qs.forEach((it,idx)=>{if(answers[idx]===it.q.c)c++;else recordMistake({topic:it.topic,q:it.q.q,o:it.q.o,c:it.q.c,e:it.q.e,w:it.q.w,ty:it.q.ty,picked:answers[idx]});});const pct=Math.round(100*c/qs.length);progress._exam=Math.max(progress._exam||0,pct);saveProg(progress);renderNav();render();}
function renderExam(v){
 if(!examState){
  v.innerHTML=`<h1>📝 Mock Exam</h1>
   <p class="lead">Sit a full exam from the whole question bank (currently ${allExamQ().length} MCQs). Wrong answers are shown with the correct answer + full explanation at the end.</p>
   <div class="promise">⚠️ Bank is still growing toward 100+/topic; exams get more realistic as it fills. <b>Blueprint 100</b> samples questions weighted like the real competitive exam.</div>
   <div class="modepick">
    <button onclick="startExam('blueprint')">🎯 Blueprint 100<br><small style="color:var(--muted)">weighted like the real exam</small></button>
    <button onclick="startExam('half')">50 mixed</button>
    <button onclick="startExam('quick')">Quick 25</button>
    <button onclick="startExam('marathon')">Marathon (all)</button>
   </div>
   ${progress._exam!=null?`<p style="color:var(--gold);margin-top:14px">Best mock-exam score: <b>${progress._exam}%</b></p>`:''}`;
  return;
 }
 if(examState.submitted)return renderExamResult(v);
 const {qs,i,answers}=examState;const it=qs[i];const picked=answers[i];
 const answered=Object.keys(answers).length;
 v.innerHTML=`<h1 style="font-size:20px">Mock Exam <span style="color:var(--muted);font-size:14px">— ${i+1} / ${qs.length} &nbsp;·&nbsp; answered ${answered}</span></h1>
  <div class="bar" style="margin:10px 0 16px"><i style="width:${Math.round(100*(i+1)/qs.length)}%"></i></div>
  <div class="q"><div style="color:var(--muted);font-size:12px;margin-bottom:6px">${it.topic}</div>
   <div class="qt">${it.q.q}</div>
   ${it.q.o.map((o,k)=>`<div class="opt ${picked===k?'picked':''}" onclick="pickExam(${k})"><span class="k">${'ABCD'[k]}</span><span>${o}</span></div>`).join('')}
  </div>
  <div class="btnrow" style="justify-content:space-between">
   <button class="btn ghost" onclick="examGo(${i-1})" ${i===0?'disabled':''}>◀ Prev</button>
   <button class="btn ghost" onclick="newExam()">Exit</button>
   ${i<qs.length-1?`<button class="btn" onclick="examGo(${i+1})">Next ▶</button>`:`<button class="btn" onclick="submitExam()">Submit ✓</button>`}
  </div>
  <div class="exam-grid">${qs.map((_,k)=>`<b class="${answers[k]!=null?'ans':''} ${k===i?'cur':''}" onclick="examGo(${k})">${k+1}</b>`).join('')}</div>
  <button class="btn" style="margin-top:6px" onclick="submitExam()">Submit exam now</button>`;
}
function renderExamResult(v){
 const {qs,answers}=examState;let c=0;const wrong=[];
 qs.forEach((it,idx)=>{answers[idx]===it.q.c?c++:wrong.push({it,idx});});
 const pct=Math.round(100*c/qs.length);
 const g=pct>=85?['Excellent','#22c55e']:pct>=80?['Pass standard','#22c55e']:pct>=60?['Keep going','#f59e0b']:['Needs review','#ef4444'];
 v.innerHTML=`<div class="result"><div style="font-size:44px">${pct>=80?'🎉':pct>=60?'👍':'💪'}</div>
   <div class="score" style="color:${g[1]}">${pct}%</div>
   <div class="scorebadge" style="background:${g[1]}22;color:${g[1]};border:1px solid ${g[1]}55">${g[0]} — ${c}/${qs.length} correct</div>
   <div class="btnrow"><button class="btn" onclick="newExam()">New exam</button><button class="btn ghost" onclick="go('progress')">📊 Progress</button><button class="btn ghost" onclick="go('home')">Home</button></div>${readLine()}</div>
  <h3 style="color:var(--gold);margin:8px 0 12px">Review — ${wrong.length} to fix</h3>
  ${wrong.length===0?'<p class="lead">Perfect — nothing to review. 🏆</p>':wrong.map(w=>`<div class="q">
    <div style="color:var(--muted);font-size:12px;margin-bottom:4px">${w.it.topic}</div>
    <div class="qt">${w.it.q.q}</div>
    <div class="opt wrong"><span class="k">✗</span><span>Your answer: ${answers[w.idx]!=null?'ABCD'[answers[w.idx]]+'. '+w.it.q.o[answers[w.idx]]:'(blank)'}</span></div>
    <div class="opt correct"><span class="k">✓</span><span>Correct: ${'ABCD'[w.it.q.c]}. ${w.it.q.o[w.it.q.c]}</span></div>
    <div class="exp show">${expHTML(w.it.q)}</div></div>`).join('')}`;
}
/* ===== MISTAKES BANK ===== */
function mlist(){return progress.__mistakes||(progress.__mistakes=[]);}
function recordMistake(m){const arr=mlist();const ex=arr.find(x=>x.q===m.q);if(ex){ex.picked=m.picked;ex.ts=Date.now();}else{arr.push({id:'m'+Date.now()+Math.random().toString(36).slice(2,7),topic:m.topic,q:m.q,o:m.o,c:m.c,e:m.e,w:m.w,ty:m.ty,picked:m.picked,ts:Date.now()});}saveProg(progress);renderNav();}
function removeMistake(id){progress.__mistakes=mlist().filter(x=>x.id!==id);saveProg(progress);renderNav();render();}
function clearMistakes(){if(typeof confirm!=='undefined'&&!confirm('Clear ALL saved mistakes?'))return;progress.__mistakes=[];saveProg(progress);renderNav();render();}
let mq=null;
function startMQ(){const arr=shuffle(mlist());if(!arr.length)return;mq={order:arr.slice(),i:0,answered:false,_correct:false};render();}
function mqAnswer(k){if(mq.answered)return;mq.answered=true;const it=mq.order[mq.i];document.getElementById('mopt'+it.c).classList.add('correct');if(k!==it.c)document.getElementById('mopt'+k).classList.add('wrong');mq._correct=(k===it.c);document.getElementById('mexp').classList.add('show');document.getElementById('mnext').style.display='inline-block';}
function mqNext(){const it=mq.order[mq.i];if(mq._correct){progress.__mistakes=mlist().filter(x=>x.id!==it.id);saveProg(progress);}mq.i++;mq.answered=false;mq._correct=false;renderNav();render();}
function exitMQ(){mq=null;render();}
function renderMistakes(v){
 const arr=mlist();
 if(mq){
  if(mq.i>=mq.order.length){v.innerHTML=`<div class="result"><div style="font-size:40px">🎯</div><div style="font-size:22px;font-weight:900">Retest complete</div><p style="color:var(--muted);margin-top:8px">Mastered ones were removed. <b>${arr.length}</b> still in the bank.</p><div class="btnrow"><button class="btn" onclick="exitMQ()">Back to bank</button></div></div>`;return;}
  const it=mq.order[mq.i];
  v.innerHTML=`<h1 style="font-size:20px">🔁 Retest <span style="color:var(--muted);font-size:14px">— ${mq.i+1} / ${mq.order.length}</span></h1>
   <div class="q"><div style="color:var(--muted);font-size:12px;margin-bottom:6px">${it.topic}</div>
    <div class="qt">${it.q}</div>
    ${it.o.map((o,k)=>`<div class="opt" id="mopt${k}" onclick="mqAnswer(${k})"><span class="k">${'ABCD'[k]}</span><span>${o}</span></div>`).join('')}
    <div class="exp" id="mexp">${expHTML(it)}</div></div>
   <div class="btnrow" style="justify-content:space-between"><button class="btn ghost" onclick="exitMQ()">Exit</button>
    <button class="btn" id="mnext" style="display:none" onclick="mqNext()">${mq.i<mq.order.length-1?'Next ▶':'Finish'}</button></div>`;
  return;
 }
 if(!arr.length){v.innerHTML=`<h1>❌ Mistakes Bank</h1><p class="lead">Every question you answer wrong — in topic quizzes or mock exams — is saved here automatically with the correct answer and explanation, so you can review it and never forget it.</p><div class="block"><p>Nothing saved yet. Once you miss a question it lands here. 💪</p></div>`;return;}
 const byT={};arr.forEach(m=>{(byT[m.topic]=byT[m.topic]||[]).push(m);});
 v.innerHTML=`<h1>❌ Mistakes Bank <span style="color:var(--muted);font-size:15px">— ${arr.length} saved</span></h1>
  <p class="lead">Your personal error log. Review the correct answer + why, then retest until the bank is empty. Mastered questions are removed automatically on a correct retest.</p>
  <div class="btnrow" style="justify-content:flex-start;margin-bottom:8px">
   <button class="btn" onclick="startMQ()">🔁 Retest all (${arr.length})</button>
   <button class="btn ghost" onclick="clearMistakes()">Clear all</button></div>
  ${Object.keys(byT).map(t=>`<h3 style="color:var(--gold);margin:16px 0 10px">${t} (${byT[t].length})</h3>`+byT[t].map(m=>`
   <div class="q"><div class="qt">${m.q}</div>
    <div class="opt wrong"><span class="k">✗</span><span>You chose: ${m.picked!=null?'ABCD'[m.picked]+'. '+m.o[m.picked]:'(blank)'}</span></div>
    <div class="opt correct"><span class="k">✓</span><span>Correct: ${'ABCD'[m.c]}. ${m.o[m.c]}</span></div>
    <div class="exp show">${expHTML(m)}</div>
    <button class="btn ghost" style="margin-top:8px;padding:6px 16px;font-size:13px" onclick="removeMistake('${m.id}')">✓ Mastered — remove</button>
   </div>`).join('')).join('')}`;
}
renderNav();render();
/* PWA: register service worker only when served over http(s), not file:// */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}

</script><script>
/* ===================== ACCESS LAYER (paywall / accounts / preview / PayTabs) ===================== */
/* Configure this to your deployed Worker URL: */
const API_BASE = (window.OMS_API_BASE || "https://omsprep-api.YOUR-SUBDOMAIN.workers.dev");

let AUTH = { token: localStorage.getItem("oms_token") || null, email: null, name: null };
let ENT  = { access: "none", until: null, plan: null };   // entitlement
let PAID_LOADED = false;

function authHeaders(){ return AUTH.token ? { "Authorization": "Bearer " + AUTH.token } : {}; }

async function apiGET(path){
  const r = await fetch(API_BASE + path, { headers: { ...authHeaders() } });
  return { ok: r.ok, status: r.status, data: await r.json().catch(()=>({})) };
}
async function apiPOST(path, body){
  const r = await fetch(API_BASE + path, { method:"POST", headers:{ "Content-Type":"application/json", ...authHeaders() }, body: JSON.stringify(body||{}) });
  return { ok: r.ok, status: r.status, data: await r.json().catch(()=>({})) };
}

function isUnlocked(){ return ENT.access === "full" || ENT.access === "preview"; }

/* Merge the protected 60% into window.CONTENT once unlocked */
function mergePaid(paid, watermark){
  for (const id in paid){
    const f = window.CONTENT[id] || {};
    const p = paid[id] || {};
    // concatenate arrays; keep free first
    ["study","scenarios","flashcards","quiz","pearls","mistakes","facts"].forEach(k=>{
      if (p[k] && p[k].length){ f[k] = (f[k]||[]).concat(p[k]); }
    });
    window.CONTENT[id] = f;
  }
  window.__WATERMARK = watermark || "";
  PAID_LOADED = true;
}

async function refreshMe(){
  if (!AUTH.token) { ENT = { access:"none" }; return; }
  const me = await apiGET("/api/me");
  if (!me.ok) { AUTH.token=null; localStorage.removeItem("oms_token"); ENT={access:"none"}; return; }
  AUTH.email = me.data.email; AUTH.name = me.data.name;
  ENT = me.data.entitlement || { access:"none" };
  ENT.previewUsed = me.data.previewUsed;
  if (isUnlocked() && !PAID_LOADED){
    const c = await apiGET("/api/content");
    if (c.ok && c.data.content) mergePaid(c.data.content, c.data.watermark);
  }
}

/* ---------- UI: auth modal & account bar ---------- */
function authModal(mode){ // 'login' | 'signup'
  const m = mode || "login";
  const wrap = document.createElement("div");
  wrap.className = "oms-modal";
  wrap.innerHTML = `
    <div class="oms-card">
      <div class="oms-tabs">
        <button class="oms-tab ${m==='login'?'on':''}" data-m="login">تسجيل الدخول</button>
        <button class="oms-tab ${m==='signup'?'on':''}" data-m="signup">حساب جديد</button>
      </div>
      <div class="oms-body">
        <input id="oms-name" class="oms-in" placeholder="الاسم (اختياري)" style="${m==='signup'?'':'display:none'}">
        <input id="oms-email" class="oms-in" type="email" placeholder="البريد الإلكتروني">
        <input id="oms-pass" class="oms-in" type="password" placeholder="كلمة المرور (٦ أحرف على الأقل)">
        <div id="oms-err" class="oms-err"></div>
        <button id="oms-go" class="oms-btn">${m==='login'?'دخول':'إنشاء الحساب'}</button>
        <button class="oms-x" id="oms-close">إغلاق</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  let cur = m;
  wrap.querySelectorAll(".oms-tab").forEach(b=>b.onclick=()=>{ wrap.remove(); authModal(b.dataset.m); });
  wrap.querySelector("#oms-close").onclick=()=>wrap.remove();
  wrap.querySelector("#oms-go").onclick=async()=>{
    const email=wrap.querySelector("#oms-email").value.trim();
    const password=wrap.querySelector("#oms-pass").value;
    const name=wrap.querySelector("#oms-name").value.trim();
    const err=wrap.querySelector("#oms-err"); err.textContent="";
    const res = cur==='login' ? await apiPOST("/api/login",{email,password})
                              : await apiPOST("/api/signup",{email,password,name});
    if(!res.ok){ err.textContent = res.data.error || "حدث خطأ"; return; }
    AUTH.token=res.data.token; localStorage.setItem("oms_token",AUTH.token);
    wrap.remove();
    await refreshMe(); renderNav(); render(); renderAccountBar();
  };
}

function logout(){ AUTH={token:null}; ENT={access:"none"}; PAID_LOADED=false; localStorage.removeItem("oms_token");
  // reload free-only content (drop merged paid in memory)
  location.reload();
}

function fmtLeft(until){
  if(!until) return "";
  const ms=until-Date.now(); if(ms<=0) return "انتهت";
  const d=Math.floor(ms/86400000), h=Math.floor(ms%86400000/3600000), mi=Math.floor(ms%3600000/60000);
  if(d>0) return `${d} يوم`;
  if(h>0) return `${h} ساعة ${mi} د`;
  return `${mi} دقيقة`;
}

function renderAccountBar(){
  let bar=document.getElementById("oms-acct");
  if(!bar){ bar=document.createElement("div"); bar.id="oms-acct"; bar.className="oms-acct"; document.body.appendChild(bar); }
  if(!AUTH.token){
    bar.innerHTML=`<button class="oms-mini" onclick="authModal('login')">دخول / اشتراك</button>`;
    return;
  }
  let badge="";
  if(ENT.access==="full") badge=`<span class="oms-pill full">مشترك · ${fmtLeft(ENT.until)}</span>`;
  else if(ENT.access==="preview") badge=`<span class="oms-pill prev">معاينة · ${fmtLeft(ENT.until)}</span>`;
  else badge=`<span class="oms-pill none">مجاني</span>`;
  bar.innerHTML=`${badge}
    <button class="oms-mini" onclick="openPaywall()">${ENT.access==='full'?'تجديد':'اشترك'}</button>
    <button class="oms-mini ghost" onclick="logout()">خروج</button>`;
}

/* ---------- Paywall (plans + preview + zaincash) ---------- */
async function openPaywall(){
  if(!AUTH.token){ authModal('signup'); return; }
  const p = await apiGET("/api/plans");
  const plans = p.data.plans || {};
  const wrap=document.createElement("div"); wrap.className="oms-modal";
  const planCards = Object.entries(plans).map(([k,v])=>`
     <div class="oms-plan">
       <div class="oms-plan-t">${v.label}</div>
       <div class="oms-plan-p">${v.price.toLocaleString()} <small>د.ع</small></div>
       <button class="oms-btn" onclick="payNow('${k}')">ادفع بالبطاقة</button>
     </div>`).join("");
  const canPreview = !ENT.previewUsed && ENT.access!=="full";
  wrap.innerHTML=`
    <div class="oms-card wide">
      <h3 style="margin:0 0 4px">الاشتراك الكامل</h3>
      <p style="color:var(--muted);font-size:13px;margin-bottom:14px">افتح كل المستويات (المتوسط والعميق) وكامل المواضيع السريرية.</p>
      <div class="oms-plans">${planCards}</div>
      ${canPreview?`<button class="oms-btn ghost" style="margin-top:12px" onclick="startPreview()">🔓 معاينة مجانية كاملة لمدة ساعتين</button>`:''}
      <div class="oms-zc">💳 الدفع بالبطاقة عبر PayTabs (فوري). &nbsp; أو تحويل <b>ZainCash</b> يدوي — راسلنا بالإيصال وبريدك لنفعّل حسابك.</div>
      <button class="oms-x" onclick="this.closest('.oms-modal').remove()">إغلاق</button>
    </div>`;
  document.body.appendChild(wrap);
}
async function payNow(plan){
  const r=await apiPOST("/api/pay/create",{plan});
  if(r.ok && r.data.redirect_url){ location.href=r.data.redirect_url; }
  else alert(r.data.error||"تعذّر بدء الدفع");
}
async function startPreview(){
  const r=await apiPOST("/api/preview/start",{});
  if(r.ok){ document.querySelectorAll('.oms-modal').forEach(m=>m.remove()); await refreshMe(); renderNav(); render(); renderAccountBar(); }
  else alert(r.data.error||"تعذّرت المعاينة");
}

/* If returning from PayTabs (?pay=done), refresh entitlement */
async function handlePayReturn(){
  const u=new URL(location.href);
  if(u.searchParams.get("pay")==="done"){
    // webhook may take a moment; poll a few times
    for(let i=0;i<5;i++){ await refreshMe(); if(ENT.access==="full") break; await new Promise(r=>setTimeout(r,1500)); }
    history.replaceState({},"",location.pathname);
    renderNav(); render(); renderAccountBar();
    if(ENT.access==="full") alert("تم تفعيل اشتراكك ✅");
  }
}

/* keep the account bar's countdown fresh */
setInterval(()=>{ if(AUTH.token) renderAccountBar(); }, 60000);

</script>
</body></html>
