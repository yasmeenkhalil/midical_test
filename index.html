<html lang="en" dir="ltr"><head>

<title>OMSPrep + Atlas — OMFS & Head/Neck Anatomy</title>

<style>
:root{--bg:#0a0f1e;--surface:#0f1729;--elev:#141d35;--border:#1e2d52;--teal:#2dd4bf;--teald:#0d9488;--gold:#f59e0b;--text:#e2e8f0;--muted:#64748b;--dim:#94a3b8;--green:#22c55e;--red:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh}
.ar{font-family:'Cairo',sans-serif;direction:rtl}
.app{display:flex;min-height:100vh}
.side{width:300px;background:var(--surface);border-right:1px solid var(--border);flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:18px 20px;border-bottom:1px solid var(--border);font-weight:900;font-size:20px}
.brand span{color:var(--teal)}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
.searchbox{padding:10px 14px;border-bottom:1px solid var(--border)}
.searchbox input{width:100%;padding:8px 12px;border-radius:9px;background:var(--elev);border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:13px}
.navitem{padding:10px 18px;cursor:pointer;border-left:3px solid transparent;display:flex;align-items:center;gap:9px;font-size:12.5px;transition:.15s}
.navitem:hover{background:var(--elev)}
.navitem.active{background:rgba(45,212,191,.1);border-left-color:var(--teal);color:var(--teal);font-weight:700}
.navitem .w{margin-left:auto;font-size:10.5px;font-weight:800;background:var(--elev);padding:2px 7px;border-radius:20px;color:var(--gold)}
.navitem.locked{opacity:.45}
.navgroup{padding:12px 18px 6px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);border-top:1px solid var(--border);margin-top:6px}
.navitem .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.main{flex:1;overflow-y:auto}
.inner{max-width:900px;margin:0 auto;padding:26px 32px 80px}
h1{font-size:27px;font-weight:900;margin-bottom:6px}
.lead{color:var(--dim);font-size:14px;line-height:1.8;margin-bottom:20px}
.promise{background:linear-gradient(135deg,rgba(245,158,11,.12),rgba(45,212,191,.08));border:1px solid rgba(245,158,11,.35);border-radius:14px;padding:14px 18px;margin-bottom:22px;font-size:13.5px;line-height:1.7}
.promise b{color:var(--gold)}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);cursor:pointer;user-select:none;background:var(--surface);border:1px solid var(--border);padding:8px 14px;border-radius:10px}
.toggle.on{border-color:var(--teal);color:var(--teal)}
.sec-card{background:linear-gradient(135deg,rgba(20,29,53,.95),rgba(15,23,41,.9));border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:12px;cursor:pointer;transition:.15s}
.sec-card:hover{border-color:var(--teal)}
.sec-card .top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sec-card .name{font-weight:800;font-size:15px}
.sec-card .pct{margin-left:auto;font-size:18px;font-weight:900;color:var(--teal)}
.sec-card .subs{color:var(--muted);font-size:12.5px;line-height:1.6}
.pill{font-size:10px;font-weight:800;padding:2px 9px;border-radius:20px}
.pill.ready{background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.3)}
.pill.soon{background:rgba(100,116,139,.15);color:var(--muted);border:1px solid rgba(100,116,139,.3)}
.bar{height:6px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--teald));border-radius:99px}
.tabs{display:flex;gap:6px;margin-bottom:22px;border-bottom:1px solid var(--border);flex-wrap:wrap}
/* level switch */
.lvlsw{display:flex;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:5px;margin:4px 0 6px;flex-wrap:wrap}
.lvlbtn{flex:1;min-width:120px;border:none;background:transparent;color:var(--muted);font-family:inherit;font-weight:700;font-size:13px;padding:9px 12px;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:.18s}
.lvlbtn:hover{color:var(--text)}
.lvlbtn.active{background:var(--elev);color:var(--lc,#2dd4bf);box-shadow:inset 0 0 0 1px var(--lc,#2dd4bf)}
.lvldot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.lvlhint{font-size:11.5px;color:var(--muted);margin-bottom:14px;text-align:center}
/* scenarios */
.scn .scn-lvl{font-size:10px;font-weight:800;text-transform:uppercase;background:var(--elev);color:var(--gold);padding:2px 9px;border-radius:20px;margin-left:6px;vertical-align:middle}
.scn-vig{background:var(--elev);border-left:3px solid var(--teal);border-radius:8px;padding:12px 14px;font-style:italic;color:var(--text);margin-bottom:12px;line-height:1.8}
.scn-q{font-weight:700;color:var(--teal);margin-bottom:12px;line-height:1.7}
.scn-reveal{margin-bottom:4px}
.scn-ans{animation:fadein .3s}
.scn-a{background:linear-gradient(135deg,rgba(45,212,191,.12),rgba(15,23,41,.5));border:1px solid var(--border);border-radius:10px;padding:13px 15px;line-height:1.85;color:var(--text)}
.scn-pearls{margin-top:11px;border-top:1px solid var(--border);padding-top:10px}
.scn-pearls b{color:var(--gold);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.scn-pearls ul{padding-left:20px;margin-top:6px}
.scn-pearls li{font-size:13px;line-height:1.7;color:var(--dim)}
@keyframes fadein{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.tab{padding:10px 16px;cursor:pointer;font-weight:700;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--teal);border-bottom-color:var(--teal)}
.block{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 22px;margin-bottom:16px}
.block h3{font-size:17px;font-weight:800;color:var(--teal);margin-bottom:12px}
.block h4{font-size:14px;font-weight:800;margin:14px 0 6px;color:var(--gold)}
.block p,.block li{font-size:14px;line-height:1.9;color:var(--text)}
.block ul{padding-left:20px;margin:6px 0}
.block li{margin-bottom:5px}
.block b{color:#fff}
.hy{background:rgba(245,158,11,.1);border-left:3px solid var(--gold);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:13.5px}
.hy b{color:var(--gold)}
ol.facts{padding-left:22px;margin:4px 0}
ol.facts li{font-size:13.5px;line-height:1.75;margin-bottom:8px;color:var(--text)}
ol.facts li b{color:#fff}
.svgwrap{background:var(--elev);border:1px solid var(--border);border-radius:12px;padding:10px;overflow-x:auto}
.svgwrap svg{width:100%;height:auto;min-width:520px}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12.5px}
th,td{border:1px solid var(--border);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--elev);color:var(--teal)}
.term{border-bottom:1px dotted var(--gold);cursor:help;position:relative}
.term>i{display:none;position:absolute;bottom:130%;left:50%;transform:translateX(-50%);background:#000;color:var(--gold);font-family:'Cairo';font-style:normal;font-size:12px;padding:4px 10px;border-radius:8px;white-space:nowrap;z-index:30;border:1px solid var(--gold)}
.term:hover>i,.term.show>i{display:block}
body.showtr .term>i{display:inline;position:static;transform:none;background:transparent;border:none;color:var(--gold);font-size:12px;margin-left:4px;padding:0;white-space:normal}
body.showtr .term>i::before{content:"("}body.showtr .term>i::after{content:")"}
.fc-wrap{text-align:center}
.fc{background:linear-gradient(135deg,var(--elev),var(--surface));border:1px solid var(--border);border-radius:18px;min-height:210px;display:flex;align-items:center;justify-content:center;padding:30px;cursor:pointer;font-size:17px;line-height:1.8;position:relative}
.fc .side-lbl{position:absolute;top:12px;left:16px;font-size:11px;font-weight:800;color:var(--muted)}
.fc.back{border-color:var(--teal)}
.fc-nav{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:16px}
.fc-count{color:var(--muted);font-size:13px}
.q{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px}
.q .qt{font-size:15px;font-weight:700;line-height:1.7;margin-bottom:14px}
.opt{padding:11px 15px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;font-size:14px;display:flex;gap:10px;transition:.15s}
.opt:hover{border-color:var(--teal)}
.opt .k{font-weight:800;color:var(--muted)}
.opt.picked{background:rgba(45,212,191,.12);border-color:var(--teal);color:var(--teal)}
.exam-grid{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.exam-grid b{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;background:var(--elev);border:1px solid var(--border);cursor:pointer}
.exam-grid b.ans{background:rgba(45,212,191,.2);border-color:var(--teal);color:var(--teal)}
.exam-grid b.cur{outline:2px solid var(--gold)}
.opt.correct{background:rgba(34,197,94,.12);border-color:var(--green);color:var(--green)}
.opt.wrong{background:rgba(239,68,68,.1);border-color:var(--red);color:var(--red)}
.exp{margin-top:10px;padding:12px 14px;background:rgba(45,212,191,.07);border:1px solid rgba(45,212,191,.25);border-radius:10px;font-size:13.5px;line-height:1.7;display:none}
.exp.show{display:block}.exp b{color:var(--teal)}
.btn{padding:12px 26px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--teal),var(--teald));color:var(--bg);font-weight:800;font-family:inherit;font-size:15px;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.result{text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:34px;margin-bottom:16px}
.result .score{font-size:46px;font-weight:900}
.scorebadge{display:inline-block;padding:4px 14px;border-radius:20px;font-weight:800;font-size:13px;margin-top:8px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;justify-content:center}
.modepick{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.modepick button{flex:1;min-width:130px;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:inherit;font-size:13px;cursor:pointer}
.modepick button:hover{border-color:var(--teal)}
@media(max-width:720px){.side{position:fixed;left:-300px;z-index:50;transition:.25s}.side.open{left:0}.inner{padding:18px}.menu-btn{display:flex!important}}
.menu-btn{display:none;position:fixed;top:14px;left:14px;z-index:60;background:var(--teal);color:var(--bg);border:none;width:44px;height:44px;border-radius:12px;font-size:20px;cursor:pointer}
.askbar{display:flex;gap:8px;margin:14px 0 6px}
.askbar input{flex:1;padding:13px 16px;border-radius:12px;border:1px solid var(--border);background:var(--elev);color:var(--text);font-family:inherit;font-size:15px}
.btn.sm{padding:7px 16px;font-size:13px;margin-top:10px}
.chip{display:inline-block;background:var(--elev);border:1px solid var(--border);border-radius:20px;padding:3px 11px;margin:2px 1px;cursor:pointer;color:var(--teal);font-size:12px}
.ans-best{border:1px solid var(--teal);box-shadow:0 0 0 1px rgba(45,212,191,.15)}
.ans-tag{font-size:12px;color:var(--muted);margin-bottom:8px}
.ans-body{line-height:1.85}
.ans-clamp{max-height:430px;overflow:auto}
.ring{--p:0;width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--teal) calc(var(--p)*1%),var(--elev) 0);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ring i{width:92px;height:92px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;font-style:normal}
.ring b{font-size:28px;font-weight:900;color:var(--teal)}
.ring small{font-size:10px;color:var(--muted)}
.rdbar{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
</style></head>

<div class="app">
  <aside class="side" id="side">
    <div class="brand">OMS<span>Prep</span><small>Competitive Exam Reference — University of Anbar</small></div>
    <div class="searchbox"><input id="navsearch" placeholder="🔎 Filter topics..." oninput="renderNav()"></div>

<script>
/* OMSPrep content bank — window.CONTENT keyed by topic id.
   Each topic: {study:[{h,html}], flashcards:[{q,a}], quiz:[{q,o[4],c,e}]}
   {{english|arabic}} markers render as hover tooltips. */
window.CONTENT={};
Object.assign(window.CONTENT, {"local_anesthesia":{"study":[{"h":"1. Mechanism of Action","html":"\n   <p>Local anesthetics reversibly block {{voltage-gated Na⁺ channels|قنوات الصوديوم}} from the <b>inside</b> of the membrane, preventing {{depolarization|زوال الاستقطاب}}. The <b>unionized base</b> crosses the membrane; the <b>ionized cation</b> blocks the channel.</p>\n   <table><tr><th>Property</th><th>Determines</th></tr>\n   <tr><td>pKa</td><td><b>Onset</b> (closer to 7.4 = faster)</td></tr>\n   <tr><td>Lipid solubility</td><td><b>Potency</b></td></tr>\n   <tr><td>Protein binding</td><td><b>Duration</b></td></tr></table>\n   <p>Fiber block order: {{autonomic|الودي}} → pain → temperature → touch → pressure → motor.</p>\n   <div class=\"hy\"><b>⭐:</b> In an {{abscess|خراج}}, low pH ↑ ionized fraction → LA fails. Use a regional block away from infection.</div>"},{"h":"2. Esters vs Amides","html":"\n   <table><tr><th></th><th>Esters</th><th>Amides</th></tr>\n   <tr><td>Examples</td><td>Procaine, Cocaine, Tetracaine, Benzocaine</td><td>Lidocaine, Mepivacaine, Prilocaine, Articaine, Bupivacaine</td></tr>\n   <tr><td>Metabolism</td><td>Plasma {{pseudocholinesterase|كولينستراز}}</td><td>Liver</td></tr>\n   <tr><td>Allergy</td><td>Higher (PABA)</td><td>Rare</td></tr></table>\n   <div class=\"hy\"><b>⭐:</b> Amides have two \"i\"s in the name. True allergy is mostly to esters/preservatives.</div>"},{"h":"3. Agents & Maximum Doses","html":"\n   <table><tr><th>Agent</th><th>Max dose</th><th>Note</th></tr>\n   <tr><td>Lidocaine + adr</td><td>7 mg/kg (≤500)</td><td>plain 4.4 mg/kg</td></tr>\n   <tr><td>Articaine 4%</td><td>7 mg/kg</td><td>72 mg/cartridge</td></tr>\n   <tr><td>Mepivacaine</td><td>4.4 mg/kg (≤400)</td><td>3% plain</td></tr>\n   <tr><td>Prilocaine</td><td>6 mg/kg</td><td>methemoglobinemia risk</td></tr>\n   <tr><td>Bupivacaine</td><td>1.3 mg/kg (≤90)</td><td>longest acting</td></tr></table>\n   <p>Cartridge = <b>1.8 mL</b>. mg = %×10×1.8. Lidocaine 2% = <b>36 mg</b>/cartridge.</p>"}],"flashcards":[{"q":"LA mechanism?","a":"Reversible block of voltage-gated Na⁺ channels."},{"q":"Property determining onset?","a":"pKa."},{"q":"Property determining duration?","a":"Protein binding (bupivacaine longest)."},{"q":"Property determining potency?","a":"Lipid solubility."},{"q":"Why LA fails in abscess?","a":"Low pH ↑ ionized fraction; less base crosses membrane."},{"q":"Ester vs amide metabolism?","a":"Esters: plasma pseudocholinesterase. Amides: liver."},{"q":"mg per cartridge of 2% lidocaine?","a":"36 mg."}],"quiz":[{"q":"The most commonly used LA in dentistry:","o":["Bupivacaine","Lidocaine","Mepivacaine","Procaine"],"c":1,"e":"Lidocaine 2%."},{"q":"LA act by:","o":["Opening K⁺ channels","Blocking Na⁺ channels","Ca²⁺ influx","Cl⁻ hyperpolarization"],"c":1,"e":"Na⁺ channel block."},{"q":"Duration is determined by:","o":["pKa","Lipid solubility","Protein binding","MW"],"c":2,"e":"Protein binding."},{"q":"Onset is determined by:","o":["pKa","Protein binding","Lipid solubility","Conc."],"c":0,"e":"pKa near tissue pH = faster."},{"q":"LA fails in infection because:","o":["High pH","Low pH ↑ ionized form","Pus dilution","Bacteria"],"c":1,"e":"Acidic pH raises ionized fraction."},{"q":"Esters are metabolized by:","o":["Liver CYP","Plasma pseudocholinesterase","Kidney","Lung"],"c":1,"e":"Plasma esterase; PABA → allergy."},{"q":"Max lidocaine WITH adrenaline:","o":["3 mg/kg","4.4 mg/kg","7 mg/kg","10 mg/kg"],"c":2,"e":"7 mg/kg (≤500 mg)."},{"q":"mg in 1.8 mL of 2% lidocaine:","o":["18","36","54","72"],"c":1,"e":"20×1.8=36."},{"q":"LA causing methemoglobinemia:","o":["Lidocaine","Bupivacaine","Prilocaine","Mepivacaine"],"c":2,"e":"High-dose prilocaine."},{"q":"Max adrenaline in cardiac patient:","o":["0.2 mg","0.04 mg","0.5 mg","1 mg"],"c":1,"e":"≤0.04 mg."},{"q":"Transient facial palsy in IANB due to:","o":["Lingual injury","LA in parotid","Pterygoid hematoma","Mental block"],"c":1,"e":"CN VII in parotid."},{"q":"Hematoma is most associated with:","o":["IAN","PSA","Greater palatine","Mental"],"c":1,"e":"PSA / pterygoid plexus."},{"q":"Best technique with trismus:","o":["IANB","Gow-Gates","Akinosi","Infiltration"],"c":2,"e":"Akinosi closed-mouth."},{"q":"Most common office emergency:","o":["Anaphylaxis","Vasovagal syncope","Toxicity","Arrest"],"c":1,"e":"Syncope."},{"q":"PSA block spares:","o":["MB root of 1st molar","DB root","2nd molar","3rd molar"],"c":0,"e":"MB root = MSA."},{"q":"Earliest sign of LA toxicity:","o":["Seizure","Circumoral numbness/metallic taste","Arrest","Coma"],"c":1,"e":"Precedes CNS excitation."},{"q":"The active form of LA that crosses the nerve membrane is the:","o":["Ionized cation","Unionized base","Salt","Ester"],"c":1,"e":"Base crosses; cation blocks the channel inside."},{"q":"Which fibres are blocked FIRST by LA?","o":["Large motor","Small autonomic/pain (B,C)","Proprioceptive","Pressure"],"c":1,"e":"Small fibres first."}],"pearls":["LA fails in an abscess because the acidic tissue increases the ionised fraction — block the nerve in healthy tissue away from the infection, do not keep injecting into the inflamed area.","Always aspirate before depositing solution — it is the single best guard against an intravascular injection and systemic toxicity.","Know the cartridge maths: a 1.8 mL cartridge of 2% lidocaine contains 36 mg; calculate the maximum for the patient's weight before you start."],"mistakes":["Injecting repeatedly into an acutely infected/abscessed area instead of using a regional block in healthy tissue.","Not aspirating → intravascular injection and toxicity.","Exceeding the maximum dose by not calculating mg per cartridge against body weight.","Using a standard adrenaline-containing dose freely in a significant cardiac patient.","Mistaking a vasovagal faint for an allergic reaction and giving adrenaline unnecessarily.","Missing methaemoglobinaemia (cyanosis unresponsive to oxygen) after high-dose prilocaine.","Injecting repeatedly into an acutely infected/abscessed area (low pH → failure) instead of a regional block in healthy tissue.","Not aspirating → intravascular injection and toxicity."],"facts":["Mechanism: block voltage-gated Na+ channels from inside → no depolarisation.","pKa → onset; lipid solubility → potency; protein binding → duration.","Fibre block order: autonomic → pain → temperature → touch → pressure → motor.","Esters (procaine, cocaine, tetracaine, benzocaine): plasma pseudocholinesterase; PABA → allergy.","Amides (lidocaine, mepivacaine, prilocaine, articaine, bupivacaine): hepatic metabolism; rare allergy.","Lidocaine max: 4.4 mg/kg plain, 7 mg/kg with adrenaline (≤500 mg).","Articaine 4% = 7 mg/kg; mepivacaine 4.4 mg/kg; prilocaine 6 mg/kg; bupivacaine 1.3 mg/kg (longest).","Cartridge = 1.8 mL; lidocaine 2% = 36 mg/cartridge; articaine 4% = 72 mg.","Vasoconstrictors: prolong, deepen, ↓ toxicity, haemostasis.","Adrenaline max: healthy 0.2 mg (~11 cartridges 1:100,000); cardiac 0.04 mg (~2 cartridges).","Felypressin = alternative vasoconstrictor; avoid in pregnancy.","Maxilla: PSA (molars, except MB root of 1st = MSA), MSA, ASA, greater palatine, nasopalatine.","Mandible: IAN, lingual, long buccal, mental/incisive.","IANB landmarks: coronoid notch, pterygomandibular raphe; 6-10 mm above occlusal plane; ~20-25 mm to bone.","Gow-Gates: neck of condyle (whole V3); Akinosi: closed-mouth (for trismus).","Local complications: failure (commonest), hematoma (PSA), trismus, transient facial palsy (parotid), paraesthesia (4% agents).","Systemic: vasovagal syncope (commonest emergency); LAST (CNS excitation → depression → CVS); methaemoglobinaemia (prilocaine).","Adrenaline cautions: uncontrolled HTN, hyperthyroidism, phaeochromocytoma, TCA/MAOI, non-selective β-blockers, cocaine.","Why LA fails in abscess: low pH ↑ ionised fraction → less base crosses membrane.","Earliest toxicity signs: circumoral numbness, metallic taste, tinnitus, lightheadedness."],"mnemonics":["Properties: pKa→Onset, Lipid solubility→Potency, Protein binding→Duration ('OPD').","Esters vs Amides: Amides have two 'i's in the name; esters (PABA) cause most allergy."]},"exodontia":{"study":[{"h":"1. Principles & Mechanics","html":"\n   <p>Exodontia = atraumatic, painless removal via <b>socket expansion</b> using: <b>lever, wedge, wheel & axle</b>. Force is slow along the long axis.</p>\n   <div class=\"hy\"><b>⭐:</b> An {{elevator|الرافعة}} must rest on <b>sound bone</b>; never use an adjacent tooth as fulcrum unless it is also for extraction.</div>"},{"h":"2. Indications & Contraindications","html":"\n   <h4>Indications</h4>\n   <ul><li>Unrestorable caries, non-vital symptomatic teeth, advanced {{periodontitis|الداء حول السني}}, orthodontic/prosthetic, impacted/supernumerary, teeth in fracture line/cyst, pre-radiotherapy.</li></ul>\n   <h4>Contraindications</h4>\n   <p><b>Local:</b> acute infection/ANUG, {{irradiated bone|عظم مشعّع}} (ORN), within malignancy.</p>\n   <p><b>Systemic:</b> uncontrolled DM, bleeding disorders/anticoagulants, {{bisphosphonates|بيسفوسفونات}} (MRONJ), recent MI (<6 mo).</p>"},{"h":"3. Instruments & Technique","html":"\n   <p>Forceps grip the <b>root beneath gingiva</b>. Movements: apical pressure → buccolingual expansion → <b>rotation</b> (single conical roots: upper incisors, lower premolars) → traction.</p>\n   <p>Elevators: straight (Coupland's), Warwick James, Cryer's.</p>"},{"h":"4. Surgical (Transalveolar) Extraction","html":"\n   <p>Indications: failed forceps, retained/fractured roots, ankylosis, hypercementosis, impaction.</p>\n   <ul><li>Full-thickness {{mucoperiosteal flap|شريحة مخاطية سمحاقية}}, broad base; bone removal with irrigation; tooth division; debride; tension-free closure.</li></ul>"},{"h":"5. Intra-op Complications","html":"\n   <ul><li>Fracture (crown/root/bone/<b>tuberosity</b>/mandible), displacement (antrum/IAN canal/soft tissue), <b>OAC</b>, nerve injury (IAN/lingual), hemorrhage, TMJ dislocation.</li></ul>\n   <p>Nerve injury: {{neurapraxia|توقف مؤقت}} → axonotmesis → {{neurotmesis|قطع كامل}} (worst).</p>"},{"h":"6. Dry Socket (Alveolar Osteitis)","html":"\n   <p>Premature clot loss (fibrinolysis), NOT infection.</p>\n   <ul><li>Risk: mandibular molars, smoking, OCP, traumatic extraction, females.</li>\n   <li>Pain <b>day 3–5</b>, empty socket, bad odor, <b>no pus</b>.</li>\n   <li>Tx: irrigation + sedative dressing (ZOE/Alvogyl) + analgesia; <b>no routine antibiotics</b>.</li></ul>"},{"h":"7. OAC & Hemorrhage","html":"\n   <p><b>OAC:</b> {{Valsalva|فالسالفا}} test. <2 mm leave; 2–6 mm figure-8 suture; >6 mm buccal advancement (Rehrmann) flap. Root in antrum → {{Caldwell-Luc|كالدويل-لوك}}.</p>\n   <p><b>Hemorrhage:</b> primary / reactionary (hours) / secondary (days, infective). Tx: pressure, sutures, oxidized cellulose, {{tranexamic acid|ترانيكساميك}}.</p>"},{"h":"8. Socket Healing & Post-op","html":"\n   <p>Clot → {{granulation tissue|نسيج حبيبي}} → woven bone → remodeling.</p>\n   <ul><li>Bite gauze 30–60 min, no rinsing 24 h, no smoking/sucking/hot fluids, warm saline after 24 h.</li></ul>"},{"h":"A1. Definition, Aims & Exam Weight","html":"\n  <p><b>Exodontia</b> = the painless removal of a whole tooth, or tooth root, from its bony socket with minimal trauma to the investing tissues, so the wound heals uneventfully and leaves a ridge that supports a prosthesis.</p>\n  <ul><li>Exam weight: <b>10% (Section II)</b> — one of the two heaviest single topics, so it must be mastered in depth.</li>\n  <li>Two routes: <b>intra-alveolar (closed/forceps)</b> and <b>trans-alveolar (open/surgical)</b>.</li>\n  <li>The three pillars of an atraumatic extraction: <b>adequate access, a controlled expanding force, and an unobstructed pathway of removal</b>.</li></ul>"},{"h":"A2. Applied Anatomy of the Extraction","html":"\n  <ul><li>The tooth is held by the <b>periodontal ligament</b> in a socket of <b>bundle bone (lamina dura)</b>; extraction works by <b>dilating the socket</b> and tearing the PDL.</li>\n  <li><b>Bone character:</b> maxillary bone is thin & porous (expands readily, favours infiltration LA); mandibular bone is dense cortical (resists expansion, needs blocks and often surgery for molars).</li>\n  <li><b>Buccal plate</b> is usually the thinnest wall (path of least resistance) — except the <b>palatal root of upper molars</b> and the dense buccal shelf at the lower molar region.</li>\n  <li><b>Danger relations:</b> upper molar/premolar apices → <b>maxillary antrum</b>; lower molar apices → <b>inferior alveolar canal</b>; lower lingual plate is thin near the 3rd molar → <b>lingual nerve & sublingual/submandibular spaces</b>; lone upper molar → <b>tuberosity</b>.</li></ul>"}],"flashcards":[{"q":"Three mechanical principles of extraction?","a":"Lever, wedge, wheel & axle."},{"q":"Elevator support?","a":"Sound bone, not adjacent tooth."},{"q":"Teeth extracted by rotation?","a":"Upper incisors, lower premolars (single conical roots)."},{"q":"Radiation contraindication?","a":"Irradiated bone — ORN risk."},{"q":"MRONJ drug cause?","a":"Bisphosphonates/antiresorptives."},{"q":"Dry socket timing & feel?","a":"Day 3–5, severe pain, empty socket, no pus."}],"quiz":[{"q":"Principle NOT used by an elevator:","o":["Lever","Wedge","Wheel and axle","Hydraulic"],"c":3,"e":"Not hydraulic."},{"q":"Maxillary central incisor extracted by:","o":["Buccolingual","Rotation","Figure-8","Apical only"],"c":1,"e":"Single conical root → rotation."},{"q":"Dry socket presents:","o":["Immediately","Day 3–5","2 weeks","Only with pus"],"c":1,"e":"Day 3–5, empty socket, no pus."},{"q":"NOT a dry socket risk:","o":["Smoking","OCP","Mandibular molar","Maxillary anterior"],"c":3,"e":"Mandibular molars, not maxillary anteriors."},{"q":"Dry socket management:","o":["Antibiotics","Irrigation + sedative dressing","Re-extraction","Curettage"],"c":1,"e":"Sedative dressing + analgesia."},{"q":"3 mm OAC management:","o":["Leave/figure-8 suture","Buccal flap now","Caldwell-Luc","Never treat"],"c":0,"e":"2–6 mm → suture/clot."},{"q":"OAC confirmation test:","o":["Tinel's","Valsalva","Phalen's","Percussion"],"c":1,"e":"Valsalva."},{"q":"Upper molar fragment displaced into:","o":["Mandibular canal","Maxillary antrum","Submandibular","Lingual pouch"],"c":1,"e":"Antrum is adjacent."},{"q":"Reactionary hemorrhage cause:","o":["Infection","Vasoconstrictor wears off","Factor deficiency","Suture failure"],"c":1,"e":"Within hours."},{"q":"Surgical flap should have:","o":["Narrow base","Broad base","Incision over defect","No relieving incision"],"c":1,"e":"Broad base for supply."},{"q":"Drug raising MRONJ risk:","o":["Beta-blockers","Bisphosphonates","Statins","Antihistamines"],"c":1,"e":"Antiresorptives."},{"q":"Worst nerve injury grade:","o":["Neurapraxia","Axonotmesis","Neurotmesis","Paresthesia"],"c":2,"e":"Complete transection."},{"q":"Socket healing begins with:","o":["Woven bone","Blood clot","Granulation","Remodeling"],"c":1,"e":"Clot first."},{"q":"Most common dry socket site:","o":["Maxillary incisors","Mandibular molars","Maxillary canines","Mandibular incisors"],"c":1,"e":"Mandibular molars."},{"q":"Root in sinus retrieved via:","o":["IANB","Caldwell-Luc","Rehrmann only","Leave"],"c":1,"e":"Caldwell-Luc."},{"q":"Forceps engage the tooth:","o":["On crown","On root beneath gingiva","Contact point","Cusp tips"],"c":1,"e":"Root grip."},{"q":"Exodontia relies primarily on which physical process?","o":["Cutting bone away","Expansion of the bony socket","Dissolving the root","Heating the tooth"],"c":1,"e":"Controlled socket expansion + use of lever/wedge/wheel-and-axle."},{"q":"During forceps extraction the FIRST controlled movement is:","o":["Rotation","Apical seating then buccolingual expansion","Traction","Lingual pull only"],"c":1,"e":"Seat apically, then expand bucco-lingually."},{"q":"Maxillary molars are generally NOT rotated because they have:","o":["A single conical root","Three divergent roots","No roots","Fused roots always"],"c":1,"e":"Multi-rooted/divergent → rotation would fracture roots."},{"q":"The buccal point (beak) on upper molar forceps engages the:","o":["Palatal root","Buccal furcation between the two buccal roots","Crown only","Lingual cusp"],"c":1,"e":"Engages the buccal bifurcation."},{"q":"An elevator works on all the following principles EXCEPT:","o":["Lever","Wedge","Wheel and axle","Capillary action"],"c":3,"e":"Mechanical principles only."},{"q":"A Cryer's elevator is especially useful for:","o":["Removing the interradicular septum/retained root","Cutting mucosa","Suturing","Bone grafting"],"c":0,"e":"Angled elevator for septum/roots."},{"q":"The safest fulcrum for an elevator is:","o":["The adjacent tooth","Sound alveolar bone","The opposing tooth","The lingual mucosa"],"c":1,"e":"Never an adjacent tooth unless it is also being removed."},{"q":"Indications for surgical (open) extraction include all EXCEPT:","o":["Retained fractured root","Hypercementosis/ankylosis","A mobile single-rooted tooth with simple access","Heavily curved roots"],"c":2,"e":"A simple mobile tooth needs forceps, not a flap."},{"q":"A flap for surgical extraction must have a base that is:","o":["Narrower than the apex","At least as wide as the free margin (broad)","Over a bony defect","Pointed"],"c":1,"e":"Broad base preserves blood supply."},{"q":"Releasing incisions should avoid:","o":["Sound bone","The interdental papilla midpoint and bony prominences/vital structures","Keratinised gingiva","The buccal sulcus"],"c":1,"e":"Avoid mid-papilla, eminences, mental nerve."},{"q":"The most common complication after a lower 3rd molar extraction is:","o":["Mandible fracture","Dry socket","Death","OAC"],"c":1,"e":"Alveolar osteitis is relatively common."},{"q":"Dry socket is fundamentally due to:","o":["Bacterial abscess","Premature breakdown of the blood clot (fibrinolysis)","Allergy","Foreign body only"],"c":1,"e":"Localised osteitis from clot loss, not infection."},{"q":"Which is NOT a recognised risk factor for dry socket?","o":["Smoking","Oral contraceptives","Traumatic extraction","Profuse early bleeding forming a firm clot"],"c":3,"e":"Good clot formation reduces risk."},{"q":"First-line management of an established dry socket:","o":["Systemic antibiotics alone","Irrigation + obtundent dressing + analgesia","Aggressive curettage to bone","Re-suturing tightly"],"c":1,"e":"Sedative dressing (e.g., Alvogyl) and analgesia."},{"q":"A fractured maxillary tuberosity during extraction is most likely with the:","o":["Lower incisor","Lone-standing/last upper molar","Lower canine","Upper central"],"c":1,"e":"Isolated upper molar, large antrum, ankylosis."},{"q":"If the tuberosity fractures but stays attached to the tooth and gingiva you should ideally:","o":["Remove everything forcibly","Splint/stabilise and delay, treat the tooth conservatively (endo) if possible","Ignore it","Pack and discharge"],"c":1,"e":"Avoid large OAC; stabilise, plan surgical removal later."},{"q":"The MOST serious immediate risk if a root is pushed lingually in the lower molar region is:","o":["OAC","Displacement into the submandibular/sublingual space","Sinusitis","Dry socket"],"c":1,"e":"Through the thin lingual plate into the floor of mouth."},{"q":"A root displaced into the maxillary antrum is best retrieved by:","o":["Blind suction through the socket repeatedly","Caldwell-Luc or endoscopic approach","Leaving it always","IANB"],"c":1,"e":"Confirm radiographically, then antral approach."}],"pearls":["Most extraction failures are failures of ACCESS and VISUALISATION, not of force — if you are pulling hard, stop and reassess (flap, bone removal, sectioning).","Read the radiograph BEFORE the forceps: root number, curvature, bulbous/hypercementosed apices, relation to the IAN canal and antrum, and bone density.","Expansion, not traction, delivers the tooth — slow controlled buccolingual force lets elastic bone yield.","Support the alveolus with the non-dominant hand on every extraction (protects bone, feels expansion, controls the forceps if the tooth gives suddenly).","An elevator is a lever + wedge — it must rest on SOUND bone with a defined point of application, never on an adjacent tooth you intend to keep.","If a maxillary molar root disappears, it is in the antrum or the infratemporal fossa until imaging proves otherwise — never blindly poke through the socket apex.","In an anticoagulated patient the safest plan is to operate atraumatically and pack/suture — stopping the drug is usually MORE dangerous than the bleed.","Dry socket is a clinical diagnosis (severe pain day 3-5, empty malodorous socket, NO pus, NO swelling) — antibiotics do not treat it.","Bilateral lower 8 surgery in a patient who needs to keep eating/talking is often staged — never risk bilateral lingual/IAN morbidity unnecessarily.","The commonest reason a 'simple' extraction becomes difficult is an undiagnosed root curvature or hypercementosis — always study the apex on the film.","Maxillary first premolar roots are frequently bifid and thin — extract by buccopalatal expansion only; rotation snaps them."],"mistakes":["Giving antibiotics for a dry socket — it is localised osteitis from clot loss, not an infection; treat with irrigation + a sedative dressing + analgesia.","Stopping warfarin/DOAC routinely for a simple extraction — risks thrombosis/stroke; proceed with local haemostasis if INR < ~3.5-4.","Applying traction before expansion → root fracture; always seat apically and expand first.","Using an adjacent tooth as an elevator fulcrum → luxating/damaging a tooth you meant to keep.","Repeatedly probing a suspected oro-antral communication → enlarges it and pushes infection into the sinus.","Forcing a lone upper molar → fractured maxillary tuberosity; deliver with care, and if the tuberosity moves with the tooth, stop and reassess.","Blind apical instrumentation near the lower 8 roots → inferior alveolar nerve injury; image first and consider coronectomy.","Mistaking reactionary bleeding (hours later, vasoconstrictor worn off) for a clotting disorder.","Not reading the radiograph before starting → surprise curved/hypercementosed roots and avoidable fractures.","Gripping the crown instead of the root beneath the gingiva → crown fractures, leaving a buried root."],"facts":["Mechanical principles of extraction: lever, wedge, wheel & axle.","Forceps movement sequence: apical seating → buccolingual expansion → rotation → traction.","Rotation suits single conical roots: upper incisors & lower premolars.","Elevator fulcrum must be sound bone — never an adjacent retained tooth.","Surgical extraction indications: failed forceps, retained/fractured roots, ankylosis, hypercementosis, impaction.","Flap rule: broad base, full thickness, no incision over a bony defect/eminence.","Dry socket = alveolar osteitis (clot fibrinolysis), NOT infection; pain day 3-5, empty socket, no pus.","Dry socket risks: mandibular molars, smoking, oral contraceptives, traumatic/surgical extraction, females.","Dry socket Tx: irrigation + obtundent dressing (ZOE/Alvogyl) + analgesia; antibiotics not routine.","OAC diagnosis: Valsalva (air/bubbles), nasal regurgitation, echo on suction.","OAC management by size: <2 mm clot; 2-6 mm figure-8 suture; >6 mm buccal advancement (Rehrmann)/palatal flap.","Root displaced into antrum → Caldwell-Luc or endoscopic retrieval.","Haemorrhage types: primary (intra-op), reactionary (hours, vasoconstrictor wears off), secondary (days, infective).","Local haemostatics: pressure, sutures, oxidized cellulose, gelatin sponge, tranexamic acid.","Socket healing: clot → granulation tissue → woven bone → remodelling.","Tuberosity fracture risk: lone-standing/last upper molar.","Nerve injury grades: neurapraxia (temporary) → axonotmesis → neurotmesis (worst).","Warfarin + simple extraction: don't stop; proceed if INR < ~3.5-4 with local measures.","IV bisphosphonates → MRONJ risk: avoid extraction where possible."],"mnemonics":["Forceps movements: 'A-BoR-T' = Apical pressure, Buccolingual expansion, Rotation (single conical roots), Traction.","Rotation-friendly teeth (single conical roots): upper incisors & lower premolars ('UP-Low-P').","Dry socket risk = 'STOP F': Smoking, Trauma/surgical, Oral Contraceptives, Posterior mandible (molars), Female.","OAC size rule: <2 clot, 2-6 suture, >6 flap ('2 and 6 are the gates').","Difficult extraction predictors 'CHAB-D': Curved/dilacerated roots, Hypercementosis, Ankylosis, dense Bone, Divergent roots."]},"trauma":{"study":[{"h":"1. Initial Assessment (ATLS)","html":"\n   <p>Trauma management follows <b>ATLS</b>: <b>A</b>irway (with C-spine control), <b>B</b>reathing, <b>C</b>irculation, <b>D</b>isability, <b>E</b>xposure. In maxillofacial trauma the <b>airway</b> is the priority — bleeding, displaced fractures, and the tongue can obstruct it.</p>\n   <div class=\"hy\"><b>⭐:</b> A bilateral parasymphyseal (\"{{flail|رفرفة}}\") mandible fracture can cause the tongue to fall back → airway obstruction. Always rule out C-spine injury.</div>"},{"h":"2. Mandibular Fractures","html":"\n   <p>Common sites: <b>condyle</b> (most common), angle, body, parasymphysis. Often <b>bilateral</b> (one direct + one contralateral indirect).</p>\n   <h4>Signs</h4>\n   <ul><li>Malocclusion, step deformity, mobility, {{paresthesia|تنمّل}} of lower lip (IAN), sublingual {{ecchymosis|كدمة}} (pathognomonic), trismus.</li></ul>\n   <h4>Favorable vs Unfavorable</h4>\n   <p>Muscle pull (masseter/medial pterygoid/temporalis elevate; depressors pull down) determines whether the fracture is <b>favorable</b> (resisted by muscle) or <b>unfavorable</b> (displaced).</p>\n   <p>Tx: closed reduction + {{IMF/MMF|تثبيت بين الفكين}} vs open reduction internal fixation (<b>ORIF</b>) with miniplates along {{Champy lines|خطوط شامبي}}.</p>"},{"h":"3. Midface — Le Fort Classification","html":"\n   <table><tr><th>Type</th><th>Line</th><th>Sign</th></tr>\n   <tr><td><b>Le Fort I</b></td><td>Horizontal, above apices (Guérin)</td><td>Mobile maxilla, palate moves</td></tr>\n   <tr><td><b>Le Fort II</b></td><td>Pyramidal, through nasal bridge/infraorbital</td><td>Nose+maxilla move together</td></tr>\n   <tr><td><b>Le Fort III</b></td><td>Craniofacial disjunction</td><td>Whole face mobile, {{CSF rhinorrhea|سيلان السائل الدماغي}}</td></tr></table>"},{"h":"4. Zygomatic & Orbital Fractures","html":"\n   <ul><li><b>Zygomatic complex (ZMC)</b>: flattened cheek, lateral subconjunctival hemorrhage, infraorbital paresthesia, trismus, step at infraorbital rim.</li>\n   <li><b>Orbital blowout</b>: enophthalmos, {{diplopia|ازدواج الرؤية}}, restricted upgaze (inferior rectus entrapment), \"{{teardrop sign|علامة الدمعة}}\" on imaging.</li></ul>"},{"h":"5. Imaging & Principles of Fixation","html":"\n   <p>Best imaging = <b>CT</b>. OPG + PA mandible for mandible; occipitomental (Waters') for midface.</p>\n   <p>Fracture management = <b>reduction → fixation → immobilization → rehabilitation</b>. Treat within \"golden\" period; antibiotics for compound fractures (any fracture through a tooth-bearing area is compound).</p>"},{"h":"6. Airway & Emergency Management","html":"\n  <p>Maxillofacial trauma threatens the airway in several ways:</p>\n  <ul><li>Posteroinferior displacement of a fractured maxilla blocking the nasopharynx.</li>\n  <li>Bilateral parasymphyseal (\"bucket-handle\") fracture → tongue falls back.</li>\n  <li>Haemorrhage, oedema, foreign bodies (teeth, dentures), vomit.</li></ul>\n  <h4>Management ladder</h4>\n  <ul><li>Chin lift/jaw thrust, suction, remove debris; recover/pull tongue forward.</li>\n  <li>Airway adjuncts; definitive: intubation; <b>surgical airway (cricothyroidotomy)</b> if obstructed and cannot intubate.</li>\n  <li>Control haemorrhage by pressure/packing; reduce displaced maxilla manually.</li></ul>\n  <div class=\"hy\"><b>⭐:</b> In the trauma patient: <b>Airway with cervical spine control comes first</b> — assume C-spine injury until cleared.</div>"},{"h":"7. Mandibular Fractures — sites & frequency","html":"\n  <p>The mandible is a ring; fractures are often <b>multiple/bilateral</b> (a blow causes one direct + one contralateral indirect fracture).</p>\n  <table><tr><th>Site</th><th>Note</th></tr>\n  <tr><td><b>Condyle</b></td><td>Most common; may be intracapsular or subcondylar</td></tr>\n  <tr><td>Angle</td><td>Often related to an impacted 3rd molar (weak point)</td></tr>\n  <tr><td>Body / parasymphysis</td><td>Common; canine region is a weak point</td></tr>\n  <tr><td>Ramus / coronoid</td><td>Uncommon (protected by muscle/zygoma)</td></tr></table>"},{"h":"8. Favourable vs Unfavourable Fractures","html":"\n  <p>Whether muscle pull <b>displaces</b> the fracture or <b>holds it together</b> defines it:</p>\n  <ul><li><b>Favourable</b>: fracture line + muscle vectors resist displacement.</li>\n  <li><b>Unfavourable</b>: muscles distract the fragments (e.g., posterior fragment pulled up by masseter/temporalis/medial pterygoid; anterior pulled down by suprahyoids/digastric).</li></ul>\n  <p>Assessed in both <b>horizontal</b> and <b>vertical</b> planes. Unfavourable fractures usually need open reduction & fixation.</p>"},{"h":"9. Signs of Mandibular Fracture","html":"\n  <ul><li><b>Malocclusion</b> (often the earliest reliable sign), step deformity, mobility/crepitus.</li>\n  <li><b>Sublingual haematoma/ecchymosis</b> (Coleman sign) — highly suggestive of a body fracture.</li>\n  <li>Lower-lip <b>paraesthesia</b> (inferior alveolar nerve), trismus, gingival tears, bleeding.</li>\n  <li>Deviation on opening (toward the side of a condylar fracture).</li></ul>"},{"h":"10. Condylar Fractures (special)","html":"\n  <ul><li>Signs: pre-auricular pain/swelling, deviation to the fractured side on opening, anterior open bite (if bilateral), bleeding from the ear (or middle cranial fossa injury).</li>\n  <li><b>Most are managed conservatively</b> (closed): analgesia, soft diet, short IMF + early mobilisation/physiotherapy to avoid ankylosis.</li>\n  <li>Open reduction (ORIF) indications: displacement into middle cranial fossa, inability to obtain occlusion, lateral extracapsular displacement, foreign body, bilateral with comminuted midface.</li>\n  <li>In <b>children</b>: high remodelling potential; conservative care to avoid growth disturbance & ankylosis.</li></ul>"},{"h":"11. Principles of Fracture Management","html":"\n  <p>The classic sequence: <b>Reduction → Fixation → Immobilisation → Rehabilitation</b>.</p>\n  <ul><li><b>Reduction</b>: restore anatomical position; the <b>occlusion is the guide</b> for jaw fractures.</li>\n  <li><b>Fixation</b>: <b>closed</b> (intermaxillary/maxillomandibular fixation, IMF/MMF) vs <b>open</b> (ORIF with mini-plates/screws).</li>\n  <li><b>Load-sharing</b> (mini-plates along Champy's lines) vs <b>load-bearing</b> (reconstruction plate for comminuted/atrophic/defect cases).</li></ul>\n  <div class=\"hy\"><b>⭐ Champy's lines</b> = ideal lines of osteosynthesis along which a single mini-plate neutralises tensile forces in the mandible.</div>"},{"h":"12. Midface — Le Fort & NOE","html":"\n  <table><tr><th>Type</th><th>Level / sign</th></tr>\n  <tr><td>Le Fort I (Guérin)</td><td>Horizontal above apices; mobile tooth-bearing maxilla</td></tr>\n  <tr><td>Le Fort II</td><td>Pyramidal through nasofrontal & infraorbital rims; nose moves with maxilla</td></tr>\n  <tr><td>Le Fort III</td><td>Craniofacial disjunction; whole face mobile; CSF rhinorrhoea</td></tr>\n  <tr><td>NOE</td><td>Naso-orbito-ethmoid: telecanthus, flattened nasal bridge, CSF leak</td></tr></table>\n  <p>Test mobility by holding the anterior maxilla and feeling movement at the relevant level. Beware <b>CSF rhinorrhoea</b> (halo/double-ring sign, glucose-positive).</p>"},{"h":"13. Zygomatic Complex (ZMC) & Arch","html":"\n  <ul><li>ZMC = \"tripod/quadripod\" fracture at frontozygomatic suture, infraorbital rim, zygomaticomaxillary buttress, zygomatic arch.</li>\n  <li>Signs: flattened malar prominence, <b>infraorbital nerve paraesthesia</b>, periorbital/subconjunctival haemorrhage, step at infraorbital rim, trismus (coronoid impingement), diplopia.</li>\n  <li>Isolated arch fracture: limited mouth opening from impingement on the coronoid; reduced via <b>Gillies temporal</b> approach.</li></ul>"},{"h":"14. Orbital Floor 'Blowout' Fracture","html":"\n  <ul><li>Mechanism: sudden ↑ intra-orbital pressure → floor (or medial wall) gives way.</li>\n  <li>Signs: <b>enophthalmos</b>, <b>diplopia</b>, restricted <b>upgaze</b> (inferior rectus entrapment, +ve forced duction), infraorbital paraesthesia, orbital emphysema.</li>\n  <li>Imaging: coronal CT — \"<b>teardrop</b>\" of herniated tissue into the antrum.</li>\n  <li>Repair indications: significant enophthalmos, persistent diplopia, large defect, entrapment (esp. paediatric \"white-eye\" — urgent).</li></ul>"},{"h":"15. Dentoalveolar & Soft-tissue Trauma","html":"\n  <ul><li><b>Dentoalveolar</b>: subluxation, luxation, avulsion, alveolar segment fracture. <b>Avulsed permanent tooth</b>: replant ASAP; storage in <b>milk/HBSS/saliva</b>; splint 1–2 weeks; do NOT scrub the root.</li>\n  <li><b>Soft tissue</b>: clean, explore for foreign bodies/teeth, debride conservatively (good facial blood supply), layered closure; map & repair facial-nerve and parotid-duct injuries; tetanus prophylaxis.</li></ul>"}],"flashcards":[{"q":"First priority in facial trauma?","a":"Airway (with C-spine control)."},{"q":"Most common mandibular fracture site?","a":"Condyle."},{"q":"Pathognomonic sign of mandibular fracture?","a":"Sublingual ecchymosis."},{"q":"Le Fort I level?","a":"Horizontal above apices (Guérin)."},{"q":"Le Fort II shape?","a":"Pyramidal (through nasal bridge & infraorbital)."}],"quiz":[{"q":"The first priority in a maxillofacial trauma patient is:","o":["Stop bleeding","Airway with C-spine control","Reduce fracture","Suture lacerations"],"c":1,"e":"ATLS: Airway first, protect cervical spine."},{"q":"Most common site of mandibular fracture:","o":["Symphysis","Condyle","Angle","Ramus"],"c":1,"e":"Condyle is most common."},{"q":"Pathognomonic sign of a mandibular fracture:","o":["Trismus","Sublingual ecchymosis","Malocclusion","Swelling"],"c":1,"e":"Sublingual hematoma/ecchymosis."},{"q":"Le Fort I is:","o":["Pyramidal","Horizontal above the apices","Craniofacial disjunction","Orbital floor"],"c":1,"e":"Guérin / horizontal maxillary fracture."},{"q":"Craniofacial disjunction is:","o":["Le Fort I","Le Fort II","Le Fort III","ZMC"],"c":2,"e":"Le Fort III."},{"q":"CSF rhinorrhea is most associated with:","o":["Le Fort I","Le Fort III","Mandibular angle","Dentoalveolar"],"c":1,"e":"High midface/Le Fort III."},{"q":"Numbness of the cheek after a zygomatic fracture is due to:","o":["Facial nerve","Infraorbital nerve","Lingual nerve","Mental nerve"],"c":1,"e":"Infraorbital nerve (V2)."},{"q":"Orbital blowout fracture typically restricts:","o":["Downgaze","Upgaze","Abduction","Adduction"],"c":1,"e":"Inferior rectus entrapment limits upgaze; diplopia."},{"q":"Best imaging modality for facial fractures:","o":["OPG","CT scan","Ultrasound","MRI"],"c":1,"e":"CT is gold standard."},{"q":"An 'unfavorable' fracture is one that:","o":["Resists displacement by muscles","Is displaced by muscle pull","Is non-displaced","Is greenstick"],"c":1,"e":"Muscle pull displaces unfavorable fractures."},{"q":"IMF stands for:","o":["Internal metal fixation","Intermaxillary fixation","Infraorbital muscle flap","Internal mandibular fixation"],"c":1,"e":"Intermaxillary (maxillomandibular) fixation."},{"q":"A fracture passing through a tooth socket is considered:","o":["Simple/closed","Compound/open","Greenstick","Pathological"],"c":1,"e":"Open/compound → antibiotics indicated."},{"q":"The Waters' (occipitomental) view best shows:","o":["Mandibular condyle","Midface/maxillary sinuses","C-spine","TMJ"],"c":1,"e":"Midface and antra."},{"q":"Guérin's fracture is another name for:","o":["Le Fort I","Le Fort II","ZMC","Nasal"],"c":0,"e":"Le Fort I."},{"q":"Most common cause of airway obstruction in bilateral parasymphyseal fracture:","o":["Edema","Tongue falling back","Blood clot","Foreign body"],"c":1,"e":"Loss of anterior support → tongue prolapse."},{"q":"The immediate priority in a multiply-injured facial trauma patient is:","o":["Reduce the fracture","Airway with cervical spine control","Suture lacerations","Take radiographs"],"c":1,"e":"ATLS: A before B and C."},{"q":"In a bilateral parasymphyseal mandibular fracture, airway obstruction occurs because:","o":["Blood clot","Loss of anterior tongue support → tongue falls back","Oedema only","Foreign body"],"c":1,"e":"'Bucket-handle' loss of support."},{"q":"The mandible most commonly fractures at more than one site because it is:","o":["A flat plate","A ring (a blow causes a contralateral indirect fracture)","Very thin everywhere","Avascular"],"c":1,"e":"Ring structure → paired fractures."},{"q":"Bleeding from the ear after facial trauma may indicate a fracture of the:","o":["Symphysis","Condyle / middle cranial fossa","Angle","Coronoid"],"c":1,"e":"Condylar/skull base injury."},{"q":"On opening, the mandible deviates TOWARD the side of a:","o":["Body fracture","Unilateral condylar fracture","Symphysis fracture","Angle fracture"],"c":1,"e":"Loss of translation on that side."},{"q":"Bilateral condylar fractures classically cause:","o":["Crossbite","Anterior open bite","Deep bite","No occlusal change"],"c":1,"e":"Loss of posterior ramus height bilaterally."},{"q":"Most condylar fractures are managed by:","o":["Always ORIF","Closed treatment + early mobilisation/physiotherapy","Condylectomy","No treatment"],"c":1,"e":"Conservative to preserve function/avoid ankylosis."},{"q":"An indication for OPEN reduction of a condylar fracture is:","o":["Minimal displacement","Displacement into the middle cranial fossa / inability to obtain occlusion","A child","Unilateral undisplaced"],"c":1,"e":"Absolute/relative ORIF indications."},{"q":"Champy's lines describe the ideal placement of:","o":["IMF wires","Mini-plates (osteosynthesis lines) on the mandible","Skin incisions","Sutures"],"c":1,"e":"Lines of ideal osteosynthesis."},{"q":"A reconstruction (load-bearing) plate is needed for:","o":["A simple favourable fracture","A comminuted or atrophic/defect mandible","A greenstick fracture","A dentoalveolar fracture"],"c":1,"e":"Load-bearing when bone cannot share load."},{"q":"Le Fort II is best described as:","o":["Horizontal above the apices","Pyramidal (nasofrontal + infraorbital rims)","Craniofacial disjunction","Orbital floor"],"c":1,"e":"Pyramidal midface fracture."},{"q":"CSF rhinorrhoea is MOST associated with:","o":["Le Fort I","High midface / Le Fort III / anterior skull base","Mandibular angle","Dentoalveolar"],"c":1,"e":"Cribriform/skull base disruption."},{"q":"A simple test for CSF leak at the bedside is:","o":["Litmus only","Halo (double-ring) sign / glucose-positive fluid","Percussion","Vitality test"],"c":1,"e":"Halo sign and glucose."},{"q":"The naso-orbito-ethmoid (NOE) fracture characteristically causes:","o":["Trismus","Telecanthus and a flattened nasal bridge","Anterior open bite","Numb lower lip"],"c":1,"e":"Medial canthal disruption."},{"q":"A flattened cheek with infraorbital paraesthesia and a step at the infraorbital rim indicates a:","o":["Mandibular fracture","Zygomatic complex (ZMC) fracture","Le Fort I","Nasal fracture"],"c":1,"e":"ZMC 'tripod' fracture."},{"q":"Trismus after a zygomatic fracture is usually due to:","o":["TMJ ankylosis","Impingement of the depressed arch/zygoma on the coronoid","Muscle spasm only","Infection"],"c":1,"e":"Mechanical block of the coronoid."},{"q":"An isolated zygomatic ARCH fracture is classically reduced via the:","o":["Caldwell-Luc","Gillies temporal approach","Le Fort I down-fracture","Coronal flap only"],"c":1,"e":"Gillies lift."},{"q":"Restricted UPGAZE with diplopia after a blow to the eye suggests:","o":["Le Fort I","Orbital floor blowout with inferior rectus entrapment","Nasal fracture","Mandibular fracture"],"c":1,"e":"Entrapment limits elevation."},{"q":"The 'teardrop' sign on a coronal CT indicates:","o":["Sinusitis","Herniation of orbital contents into the maxillary antrum","A cyst","A tumour"],"c":1,"e":"Blowout fracture herniation."},{"q":"A paediatric 'white-eye' blowout fracture is important because it:","o":["Never needs surgery","May need urgent release (trapdoor entrapment, minimal signs)","Is always benign","Heals with antibiotics"],"c":1,"e":"Greenstick trapdoor → urgent."},{"q":"The best imaging for facial fractures overall is:","o":["OPG","CT scan","Ultrasound","MRI"],"c":1,"e":"CT (often with 3D reconstruction)."},{"q":"The occipitomental (Waters') view is most useful for the:","o":["Mandibular condyle","Midface / maxillary sinuses / orbital rims","Cervical spine","TMJ"],"c":1,"e":"Midface assessment."}],"pearls":["In every facial trauma the first question is the airway, and the second is the cervical spine — fractures and aesthetics wait.","The occlusion is the surgeon's road map: if a fracture is reduced and the patient bites normally, the reduction is correct.","The mandible is a ring — find the second fracture (commonly a contralateral condyle) before you are satisfied.","Sublingual ecchymosis is almost pathognomonic of a mandibular body fracture — look for it.","Any fracture that communicates with the mouth, a tooth socket or skin is compound (open) and needs antibiotics.","Bleeding from the ear after a blow to the chin means a condylar (or skull-base) injury until proven otherwise.","Most condylar fractures are managed closed with early mobilisation — the enemy is ankylosis, especially in children.","Restricted UPGAZE with diplopia after a peri-orbital blow is inferior rectus entrapment from an orbital floor blowout."],"mistakes":["Treating the obvious facial wound while missing airway compromise or a C-spine injury.","Being satisfied with one mandibular fracture and missing the contralateral condyle.","Passing a nasogastric tube or nasopharyngeal airway in a suspected base-of-skull/high-midface fracture (risk of intracranial passage).","Calling an anterior open bite after a chin blow 'malocclusion' without imaging the condyles.","Open-reducing every condylar fracture instead of managing most closed with early movement.","Forgetting antibiotics for a compound fracture that runs through a tooth socket.","Scrubbing the root of an avulsed tooth or storing it dry, killing the PDL and dooming the replant.","Mistaking entrapment diplopia for simple swelling and delaying release of a trapped inferior rectus."],"facts":["ATLS order: Airway (+C-spine) → Breathing → Circulation → Disability → Exposure.","Mandibular fracture sites (frequency): condyle > angle > body > parasymphysis > ramus > coronoid.","Mandible is a ring → fractures are often bilateral (direct + contralateral indirect).","Pathognomonic sign of mandibular body fracture: sublingual ecchymosis (Coleman sign).","Earliest reliable clinical sign of a jaw fracture: malocclusion / occlusal step.","Le Fort I: horizontal above apices (Guérin) — mobile tooth-bearing maxilla.","Le Fort II: pyramidal — through nasofrontal & infraorbital rims.","Le Fort III: craniofacial disjunction — whole face mobile, CSF rhinorrhoea.","NOE fracture: telecanthus + flattened nasal bridge + CSF leak.","ZMC 'tripod': frontozygomatic suture + infraorbital rim + zygomaticomaxillary buttress + arch.","ZMC signs: flat malar, infraorbital paraesthesia, subconjunctival haemorrhage, trismus, IO rim step.","Orbital blowout: enophthalmos + diplopia + restricted UPGAZE (inferior rectus entrapment) + 'teardrop'.","Fracture management sequence: Reduction → Fixation → Immobilisation → Rehabilitation.","Reduction guide for jaw fractures = the occlusion.","Fixation: closed (IMF/MMF) vs open (ORIF mini-plates along Champy's lines).","Load-sharing (mini-plates) vs load-bearing (reconstruction plate for comminuted/atrophic/defect).","Favourable fracture = muscle pull resists displacement; unfavourable = muscles distract.","A fracture through a tooth-bearing area = compound (open) → antibiotics.","Condylar fractures: mostly closed treatment + early mobilisation (avoid ankylosis).","Deviation on opening is TOWARD the side of a unilateral condylar fracture."],"mnemonics":["Primary survey 'ABCDE': Airway+C-spine, Breathing, Circulation, Disability, Exposure.","Le Fort levels 'I-II-III' = horizontal (Guérin) / pyramidal / craniofacial disjunction.","Mandible fracture frequency 'Con-A-B-P': Condyle > Angle > Body > Parasymphysis.","ZMC signs 'FISTS': Flat malar, Infraorbital paraesthesia, Subconjunctival haemorrhage, Trismus, Step at the rim."],"diagrams":[{"h":"Le Fort levels — scheme","cap":"Test maxillary mobility by grasping the anterior maxilla and feeling at which level it moves.","svg":"<svg viewBox=\"0 0 560 232\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter,Arial\" font-size=\"12.5\">\n   <rect x=\"10\" y=\"14\" width=\"540\" height=\"58\" rx=\"10\" fill=\"#141d35\" stroke=\"#ef4444\" stroke-width=\"2\"/>\n   <text x=\"24\" y=\"37\" fill=\"#ef4444\" font-weight=\"800\">Le Fort I — horizontal, above the apices (Guérin)</text>\n   <text x=\"24\" y=\"57\" fill=\"#e2e8f0\">only the tooth-bearing maxilla (palate) is mobile</text>\n   <rect x=\"10\" y=\"84\" width=\"540\" height=\"58\" rx=\"10\" fill=\"#141d35\" stroke=\"#f59e0b\" stroke-width=\"2\"/>\n   <text x=\"24\" y=\"107\" fill=\"#f59e0b\" font-weight=\"800\">Le Fort II — pyramidal: nasal bridge + infraorbital rims</text>\n   <text x=\"24\" y=\"127\" fill=\"#e2e8f0\">the nose moves together with the maxilla</text>\n   <rect x=\"10\" y=\"154\" width=\"540\" height=\"64\" rx=\"10\" fill=\"#141d35\" stroke=\"#2dd4bf\" stroke-width=\"2\"/>\n   <text x=\"24\" y=\"177\" fill=\"#2dd4bf\" font-weight=\"800\">Le Fort III — craniofacial disjunction (orbits + zygomatic arches)</text>\n   <text x=\"24\" y=\"197\" fill=\"#e2e8f0\">the whole face is mobile; beware CSF rhinorrhoea</text>\n  </svg>"}]},"principles_surgery":{"study":[{"h":"1. Asepsis & Sterilization","html":"\n   <p><b>Sterilization</b> = killing ALL microorganisms incl. spores; <b>disinfection</b> = killing most pathogens (not all spores). <b>Antisepsis</b> = on living tissue.</p>\n   <ul><li><b>Autoclave</b> (moist heat): 121°C/15 psi/15 min — most reliable.</li><li>Dry heat 160°C/2 h; chemical (glutaraldehyde) for heat-sensitive items.</li>\n   <li>Spore strip ({{Geobacillus/Bacillus|بكتيريا اختبار}}) = best biological indicator of autoclave efficacy.</li></ul>"},{"h":"2. Wound Healing","html":"\n   <p>Phases: <b>Hemostasis → Inflammation (0–3 d) → Proliferation (granulation, 3–21 d) → Remodeling (maturation, up to 1 yr)</b>.</p>\n   <ul><li><b>Primary intention</b>: clean apposed edges (sutured) — minimal scar.</li>\n   <li><b>Secondary intention</b>: open wound, granulation fills — more scar.</li>\n   <li><b>Tertiary (delayed primary)</b>: closed after a delay (contaminated wounds).</li></ul>\n   <div class=\"hy\"><b>⭐:</b> {{Collagen|الكولاجين}} (type III → I) provides tensile strength; vitamin C is essential for collagen synthesis.</div>"},{"h":"3. Hemostasis","html":"\n   <p>Stages: vascular spasm → platelet plug → coagulation cascade → fibrinolysis.</p>\n   <ul><li>Local control: pressure, sutures, diathermy, bone wax, oxidized cellulose (Surgicel), {{tranexamic acid|ترانيكساميك}}.</li>\n   <li>Intrinsic pathway → aPTT; extrinsic → PT/INR.</li></ul>"},{"h":"4. Flaps, Incisions & Suturing","html":"\n   <ul><li>Flap: <b>broad base</b> (blood supply), full thickness, avoid vital structures, no sharp angles.</li>\n   <li>Incision along {{Langer's lines|خطوط لانغر}} for best cosmetic scar.</li>\n   <li>Sutures: <b>resorbable</b> (catgut, Vicryl, PGA) vs <b>non-resorbable</b> (silk, nylon, prolene). Silk = good handling but more reaction.</li></ul>"},{"h":"5. Surgical Diagnosis & Biopsy","html":"\n   <ul><li><b>Incisional biopsy</b>: large/suspicious lesions (sample taken incl. margin).</li><li><b>Excisional biopsy</b>: small benign lesions (whole lesion removed).</li>\n   <li><b>FNAC</b> for neck masses/salivary; never excisional biopsy of a suspected major salivary malignancy without planning.</li></ul>"}],"flashcards":[{"q":"Sterilization vs disinfection?","a":"Sterilization kills all microbes incl. spores; disinfection does not kill all spores."},{"q":"Autoclave parameters?","a":"121°C, 15 psi, 15 min (moist heat)."},{"q":"Best indicator of autoclave efficacy?","a":"Biological spore test."},{"q":"Wound healing phases?","a":"Hemostasis → inflammation → proliferation → remodeling."},{"q":"Healing by primary intention?","a":"Clean apposed sutured edges, minimal scar."}],"quiz":[{"q":"Sterilization is defined as destruction of:","o":["Most pathogens","All microorganisms including spores","Only bacteria","Only viruses"],"c":1,"e":"All microbes incl. spores."},{"q":"Standard autoclave cycle:","o":["100°C/5 min","121°C/15 psi/15 min","160°C/30 min","60°C/1 h"],"c":1,"e":"Moist heat 121°C."},{"q":"Best test of sterilization efficacy:","o":["Color strip","Biological spore test","Time only","Visual"],"c":1,"e":"Spore (biological) indicator."},{"q":"Correct order of wound healing:","o":["Inflammation→hemostasis→remodeling","Hemostasis→inflammation→proliferation→remodeling","Proliferation→inflammation→hemostasis","Remodeling first"],"c":1,"e":"Standard sequence."},{"q":"Healing of a sutured clean wound is by:","o":["Secondary intention","Primary intention","Tertiary intention","No healing"],"c":1,"e":"Primary intention."},{"q":"Vitamin essential for collagen synthesis:","o":["Vitamin A","Vitamin C","Vitamin D","Vitamin K"],"c":1,"e":"Vitamin C."},{"q":"INR/PT evaluates the:","o":["Intrinsic pathway","Extrinsic pathway","Platelets","Fibrinolysis"],"c":1,"e":"Extrinsic/common."},{"q":"A surgical flap must have:","o":["Narrow base","Broad base","Sharp angles","Partial thickness only"],"c":1,"e":"Broad base = supply."},{"q":"Incisions giving the best scar follow:","o":["Random direction","Langer's lines","Across creases","Vertical only"],"c":1,"e":"Langer's (skin tension) lines."},{"q":"Which is a NON-resorbable suture?","o":["Catgut","Vicryl","Silk","PGA"],"c":2,"e":"Silk is non-resorbable."},{"q":"A 3 cm suspicious ulcer should have:","o":["Excisional biopsy","Incisional biopsy","No biopsy","FNAC only"],"c":1,"e":"Incisional for large/suspicious lesions."},{"q":"Antisepsis refers to microbial control on:","o":["Instruments","Living tissue","Surfaces","Air"],"c":1,"e":"On living tissue."},{"q":"Bone wax is used for:","o":["Soft tissue bleeding","Bone bleeding (mechanical)","Suturing","Disinfection"],"c":1,"e":"Mechanical hemostasis on bone."},{"q":"Collagen providing early wound strength is mainly:","o":["Type I","Type III then I","Type IV","Elastin"],"c":1,"e":"Type III early, replaced by type I."},{"q":"Delayed primary (tertiary) closure is used for:","o":["Clean wounds","Contaminated wounds","All wounds","Cosmetic only"],"c":1,"e":"Contaminated wounds closed after delay."},{"q":"Antisepsis specifically refers to microbial control on:","o":["Instruments","Living tissue","Floors","Air"],"c":1,"e":"On living tissue (vs disinfection of surfaces)."},{"q":"Flash autoclave sterilisation is typically:","o":["121°C/15 min","134°C/~3 min","160°C/2 h","60°C/1 h"],"c":1,"e":"Higher temp, shorter time."},{"q":"Dry-heat sterilisation parameters are about:","o":["100°C/5 min","160°C/2 h","121°C/15 min","37°C/24 h"],"c":1,"e":"Hot-air oven."},{"q":"Ethylene oxide is used to sterilise:","o":["Metal only","Heat-sensitive items","Bone","Skin"],"c":1,"e":"Gas sterilisation for delicate/heat-labile items."},{"q":"In Spaulding's classification, instruments that penetrate tissue are:","o":["Non-critical","Semi-critical","Critical (must be sterile)","Optional"],"c":2,"e":"Critical items require sterilisation."},{"q":"The proliferative phase of wound healing features:","o":["Clot only","Granulation tissue, angiogenesis, epithelialisation","Scar maturation only","Necrosis"],"c":1,"e":"Days 3-21."},{"q":"Early wound collagen is mainly type ___, later replaced by type ___:","o":["I → III","III → I","IV → I","I → IV"],"c":1,"e":"Type III then remodelled to type I."},{"q":"Healing by secondary intention is characterised by:","o":["Apposed sutured edges","Granulation filling a gap, more contraction/scar","No healing","Immediate closure"],"c":1,"e":"Open wound heals by granulation."},{"q":"Granulation tissue is a feature of which healing phase?","o":["Haemostasis","Proliferative phase","Remodelling","Inflammatory phase"],"c":1,"e":"Proliferation: angiogenesis + granulation + epithelialisation."},{"q":"A factor that impairs wound healing is:","o":["Good nutrition","Smoking/ischaemia, diabetes, steroids","Vitamin C","Youth"],"c":1,"e":"Many systemic/local factors impair healing."},{"q":"Primary haemostasis refers to:","o":["Fibrin formation","Platelet plug formation","Fibrinolysis","Scar"],"c":1,"e":"Platelet adhesion/aggregation."}],"pearls":["Sterilisation kills everything including spores; the only proof it worked is a biological spore test, not the colour strip.","Healing is a sequence — haemostasis, inflammation, proliferation, remodelling — and anything that starves tissue of oxygen (smoking, ischaemia, tension) stalls it.","A flap lives on its base: keep the base broad and never place the incision over the bony defect you are trying to cover."],"mistakes":["Trusting a chemical colour strip alone as proof of sterilisation instead of a spore test.","Designing a flap with a narrow base or an incision over the defect → necrosis/dehiscence.","Closing a wound under tension → breakdown.","Ordering the wrong coagulation test for the anticoagulant in use.","Excising a large suspicious ulcer instead of taking an incisional biopsy first.","Giving 'prophylactic' antibiotics after the operation, when tissue levels are too late to help.","Ignoring early tachycardia in haemorrhage and waiting for hypotension (a late sign).","Trusting a chemical colour strip alone as proof of sterilisation instead of a spore test."],"facts":["Sterilization kills ALL microbes incl. spores; disinfection does not kill all spores; antisepsis = on living tissue.","Autoclave: 121°C/15 psi/15 min (or 134°C/3 min flash); dry heat 160°C/2 h.","Best sterilisation test = biological spore indicator.","Spaulding: critical items (penetrate tissue) → sterile; semi-critical → high-level disinfection; non-critical → low-level.","Wound healing phases: haemostasis → inflammation (0-3 d) → proliferation (3-21 d) → remodelling (up to 1 yr).","Collagen type III early → replaced by type I; vitamin C essential.","Healing types: primary (apposed/sutured), secondary (granulation, more scar), tertiary (delayed primary, contaminated).","Haemostasis stages: vascular spasm → platelet plug (primary) → coagulation/fibrin (secondary) → fibrinolysis.","PT/INR = extrinsic (warfarin); aPTT = intrinsic (heparin); bleeding time/platelets = primary haemostasis.","Local haemostatics: pressure, sutures, bone wax, diathermy, oxidized cellulose, gelatin, tranexamic acid.","Resorbable sutures: catgut, Vicryl (polyglactin), PGA, Monocryl.","Non-resorbable: silk (braided, reactive), nylon, polypropylene (Prolene), PTFE.","Oral mucosal sutures removed in 5-7 days.","Incisions along Langer's (skin tension) lines for best scars; flaps need a broad base.","Biopsy: incisional (large/suspicious), excisional (small benign), FNAC (neck/salivary masses).","Wound classes: clean → clean-contaminated → contaminated → dirty (rising SSI risk).","Surgical antibiotic prophylaxis: within ~60 min before incision.","Shock types: hypovolaemic (commonest in trauma), cardiogenic, distributive (septic/anaphylactic/neurogenic), obstructive."],"mnemonics":["Wound healing 'H-I-P-R': Haemostasis, Inflammation, Proliferation, Remodelling.","Coagulation tests 'PET': PT→Extrinsic (warfarin); aPTT→inTrinsic (heparin)."]},"implants":{"study":[{"h":"1. Osseointegration","html":"\n   <p><b>{{Osseointegration|التكامل العظمي}}</b> (Brånemark) = direct structural & functional connection between living bone and a load-bearing implant surface, with no fibrous tissue. Implants are commercially pure <b>titanium</b> (or Ti alloy) with a {{TiO₂|أكسيد التيتانيوم}} oxide layer.</p>\n   <div class=\"hy\"><b>⭐:</b> Fibrous encapsulation = <b>failure</b>. Excessive heat during drilling (>47°C) or micromotion (>100 µm) prevents osseointegration.</div>"},{"h":"2. Requirements & Healing Times","html":"\n   <ul><li>Drilling with copious irrigation, low speed, graduated burs — avoid bone overheating.</li>\n   <li>Healing: <b>mandible ~3 months</b>, <b>maxilla ~4–6 months</b> (less dense bone).</li>\n   <li>Primary stability is essential; bone quality classified D1–D4 (Lekholm & Zarb).</li></ul>"},{"h":"3. Indications & Contraindications","html":"\n   <p>Indications: single/multiple tooth loss, edentulous arch, retention for prosthesis.</p>\n   <p><b>Absolute contraindications:</b> recent MI/uncontrolled systemic disease, IV {{bisphosphonates|بيسفوسفونات}}, head/neck radiotherapy (ORN risk), uncontrolled diabetes.</p>\n   <p><b>Relative:</b> smoking, bruxism, poor hygiene, inadequate bone.</p>"},{"h":"4. Bone Augmentation & Sinus Lift","html":"\n   <ul><li>{{GBR|توجيه تجدد العظم}} (guided bone regeneration) with membranes; block/particulate grafts.</li>\n   <li><b>Sinus lift</b> when posterior maxillary height is insufficient: direct (lateral window) or indirect (osteotome/Summers).</li>\n   <li>Need ≥1–1.5 mm bone around implant; ≥3 mm between implants.</li></ul>"},{"h":"5. Components & Materials","html":"\n  <ul><li><b>Fixture</b> (endosseous body), <b>abutment</b> (transmucosal connector), <b>prosthetic screw</b>, crown/prosthesis.</li>\n  <li>Material: <b>commercially pure titanium</b> (grade 4) or Ti-6Al-4V alloy; surface oxide <b>TiO₂</b> enables integration. Zirconia is a metal-free alternative.</li>\n  <li>Surface treatments (SLA, anodised, blasted) increase roughness → faster/stronger osseointegration.</li>\n  <li>Connection types: external hex, internal hex, <b>conical (Morse taper)</b> — affects micro-gap/microleakage.</li></ul>"},{"h":"6. Bone Quality & Quantity","html":"\n  <ul><li><b>Lekholm & Zarb D1–D4</b>: D1 dense cortical (anterior mandible) → D4 thin cortex, low-density trabecular (posterior maxilla). D1/D2 give best primary stability; D4 is most challenging.</li>\n  <li>Need adequate height & width: keep ≥1.5–2 mm bone buccal/lingual, ≥1.5 mm from adjacent teeth, ≥3 mm between implants, and a safe margin (~2 mm) above the <b>IAN canal</b>.</li></ul>"}],"flashcards":[{"q":"Define osseointegration.","a":"Direct bone-to-implant contact with no intervening fibrous tissue."},{"q":"Implant material of choice?","a":"Commercially pure titanium (TiO₂ layer)."},{"q":"Sign of implant failure histologically?","a":"Fibrous encapsulation."},{"q":"Critical drilling temperature to avoid?","a":">47°C (causes bone necrosis)."}],"quiz":[{"q":"Osseointegration means:","o":["Fibrous attachment","Direct bone-implant contact","Cemental attachment","PDL formation"],"c":1,"e":"Direct bone contact, no fibrous tissue."},{"q":"Implant material of choice:","o":["Stainless steel","Titanium","Cobalt-chromium","Zirconia only"],"c":1,"e":"Commercially pure titanium."},{"q":"Critical temperature above which bone necroses during drilling:","o":["37°C","47°C","60°C","100°C"],"c":1,"e":"47°C for ~1 min."},{"q":"Healing time in the mandible is about:","o":["2 weeks","6 weeks","3 months","1 year"],"c":2,"e":"~3 months."},{"q":"Maxillary implants take longer because:","o":["More muscle","Less dense bone","More nerves","Thicker cortex"],"c":1,"e":"Lower bone density."},{"q":"Histological sign of implant failure:","o":["Lamellar bone","Fibrous encapsulation","Woven bone","Osteoid"],"c":1,"e":"Fibrous tissue = failure."},{"q":"Absolute contraindication to implants:","o":["Smoking","IV bisphosphonates","Mild gingivitis","Age 60"],"c":1,"e":"IV bisphosphonates (MRONJ)."},{"q":"A sinus lift is indicated when:","o":["Excess bone height","Insufficient posterior maxillary height","Mandibular atrophy","Anterior crowding"],"c":1,"e":"Deficient posterior maxilla."},{"q":"Bone quality classification (D1–D4) is by:","o":["Misch only","Lekholm & Zarb","Brånemark","Champy"],"c":1,"e":"Lekholm & Zarb."},{"q":"Minimum recommended distance between implants:","o":["1 mm","3 mm","6 mm","10 mm"],"c":1,"e":"~3 mm."},{"q":"Primary stability mainly depends on:","o":["Saliva","Bone quality & surgical technique","Crown shape","Tongue"],"c":1,"e":"Bone quality and engagement."},{"q":"Brånemark is associated with:","o":["Le Fort","Osseointegration","Champy lines","TNM"],"c":1,"e":"Discovered osseointegration."},{"q":"Indirect sinus lift technique uses:","o":["Lateral window","Osteotome (Summers)","Caldwell-Luc","Le Fort I"],"c":1,"e":"Osteotome/Summers approach."},{"q":"Smoking is a ___ contraindication:","o":["Absolute","Relative","Not a factor","Beneficial"],"c":1,"e":"Relative; impairs healing."},{"q":"GBR uses:","o":["Sutures only","Membranes ± graft","Implants only","Lasers"],"c":1,"e":"Guided bone regeneration with barrier membranes."},{"q":"Osseointegration was first described by:","o":["Misch","Brånemark","Lekholm","Schneider"],"c":1,"e":"Per-Ingvar Brånemark."},{"q":"The implant surface oxide responsible for biocompatibility is:","o":["Aluminium oxide","Titanium dioxide (TiO2)","Silver oxide","Zinc oxide"],"c":1,"e":"Passive TiO2 layer on titanium."},{"q":"The three parts of a typical implant restoration are fixture, abutment and:","o":["Membrane","Prosthetic (retaining) screw/crown","Graft","Healing cap only"],"c":1,"e":"Fixture–abutment–screw/crown."},{"q":"Bone temperature during osteotomy should be kept below:","o":["37°C","47°C","60°C","100°C"],"c":1,"e":">47°C for ~1 min causes bone necrosis."},{"q":"The best primary stability is obtained in which bone quality?","o":["D4","D1/D2","D4 only","None"],"c":1,"e":"Dense cortical/corticotrabecular bone."},{"q":"D4 bone (thin cortex, low-density trabecular) is most often found in the:","o":["Anterior mandible","Posterior maxilla","Symphysis","Anterior maxilla"],"c":1,"e":"Posterior maxilla is most challenging."},{"q":"Micromotion exceeding which threshold during healing risks fibrous encapsulation?","o":["10 µm","100 µm","1 mm","5 mm"],"c":1,"e":"~100 µm threshold."},{"q":"Histological evidence of implant failure is:","o":["Lamellar bone contact","A fibrous tissue layer at the interface","Woven bone","Osteoid"],"c":1,"e":"Fibrous encapsulation = failure."},{"q":"Immediate loading requires above all:","o":["Low torque","High primary stability","Soft bone","A submerged implant"],"c":1,"e":"Adequate primary stability to resist micromotion."},{"q":"Placing an implant into a fresh extraction socket is called:","o":["Delayed placement","Immediate placement","Two-stage surgery","Sinus lift"],"c":1,"e":"Immediate (type 1) placement."},{"q":"In a two-stage protocol the implant is initially:","o":["Loaded immediately","Submerged below the mucosa","Left exposed","Splinted to teeth"],"c":1,"e":"Buried, then second-stage uncovering."}],"pearls":["Osseointegration is won or lost at surgery: keep the bone below 47°C with copious irrigation and graduated drilling, and achieve primary stability.","Micromotion is the enemy — excessive movement during healing turns bone-to-implant contact into fibrous encapsulation (failure).","Primary stability comes from engaging dense native bone; in soft D4 posterior maxilla, under-prepare and consider a delayed/loading protocol."],"mistakes":["Drilling fast/dry → bone overheating (>47°C) → necrosis → fibrous encapsulation and failure.","Forcing primary stability in poor bone instead of choosing a delayed/longer-healing protocol.","Ignoring the IAN canal on imaging and causing nerve injury.","Perforating the lingual plate in the anterior mandible without anticipating major bleeding.","Calling peri-implantitis 'mucositis' and missing progressive bone loss.","Leaving a mobile integrated implant in situ instead of removing it.","Placing implants in an IV-bisphosphonate or irradiated patient.","Drilling fast/dry → bone overheating (>47°C) → necrosis and fibrous encapsulation."],"facts":["Osseointegration (Brånemark): direct bone-implant contact, no fibrous layer.","Implant material: commercially pure titanium (grade 4) / Ti-6Al-4V; passive TiO2 oxide; zirconia = metal-free.","Components: fixture + abutment + prosthetic screw/crown.","Connection types: external hex, internal hex, conical (Morse taper).","Bone quality (Lekholm & Zarb): D1 dense cortical → D4 thin cortex/low-density trabecular (posterior maxilla).","Best primary stability: D1/D2; most challenging: D4.","Avoid bone temperature >47°C during drilling (necrosis); copious irrigation, graduated burs.","Micromotion >100 µm during healing → fibrous encapsulation/failure.","Insertion torque ~30-35 Ncm for good primary stability.","Healing: ~3 months mandible, ~4-6 months maxilla.","Loading: conventional (after healing), early (1 wk-2 mo), immediate (<48 h, needs high stability).","Minimum spacing: ~1.5-2 mm bone buccal/lingual, ~1.5 mm from teeth, ~3 mm between implants, ~2 mm above IAN.","Graft types: autograft (osteogenic, gold standard), allograft, xenograft (Bio-Oss), alloplast (HA/β-TCP).","Graft properties: osteogenesis (autograft only), osteoinduction (BMP), osteoconduction (scaffold).","Sinus lift: direct (lateral window, very low bone) vs indirect (osteotome/Summers, ~5-8 mm).","Main sinus-lift complication: Schneiderian membrane perforation.","Absolute contraindications: recent MI, IV bisphosphonates, head/neck radiotherapy, uncontrolled disease.","Relative: smoking, bruxism, poor hygiene, periodontitis, inadequate bone."],"mnemonics":["Implant success 'PILS': Primary stability, Irrigation (<47°C), Low micromotion, Sterile/atraumatic.","Bone quality D1→D4 = dense cortical → soft trabecular (D4 = posterior maxilla, ha
